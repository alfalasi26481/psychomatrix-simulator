<style>
:root{
  --navy:#14335c; --navy2:#1d4477; --gold:#c9a227; --gold2:#e6c35c;
  --blue:#1f6fd6; --blue-soft:#e8f1fc; --bg:#eef2f7; --card:#ffffff;
  --ink:#1c2431; --ink2:#4a5568; --muted:#8a94a6; --line:#dde4ee;
  --green:#1d8a3c; --green-soft:#e5f5e9; --orange:#e07b1f; --red:#c8342e;
  --red-soft:#fbf0ef; --lightblue:#3b82d6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.85; min-height:100vh;
}
/* ======== الترويسة ======== */
.topbar{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff; padding:10px 20px; display:flex; align-items:center; gap:13px;
  border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:50;
}
.topbar .logo{width:44px;height:44px;flex:none}
.topbar .brand-txt{min-width:0;overflow:hidden}
.topbar .t1{font-size:16.5px;font-weight:800;letter-spacing:.2px}
.topbar .t2{font-size:11px;color:#c8d4e6}
.topbar .spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 13px;
  font-size:12.5px;font-weight:800;color:#fff;white-space:nowrap;
}
.topbar .home-btn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
  color:#fff; border-radius:8px; padding:7px 14px; font-family:inherit;
  font-size:13px; cursor:pointer; font-weight:700;
}
.topbar .home-btn:hover{background:rgba(255,255,255,.22)}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 120px}
/* ======== لوحة المتدرب ======== */
.dash{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;
}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;text-align:center;box-shadow:0 1px 6px rgba(20,51,92,.05);
}
.stat .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.3}
.stat .l{font-size:12px;color:var(--muted);font-weight:700}
.stat .v small{font-size:13px;color:var(--muted)}
/* ======== الشاشة الرئيسية ======== */
.hero{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:26px 24px; text-align:center; margin-bottom:18px;
  box-shadow:0 2px 10px rgba(20,51,92,.06);
}
.hero .biglogo{width:96px;height:96px;margin:0 auto 10px}
.hero h1{margin:0;font-size:24px;color:var(--navy)}
.hero .en{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:2px;margin-top:2px}
.hero p{color:var(--ink2);font-size:14px;max-width:62ch;margin:10px auto 0}
.disclaimer{
  margin-top:14px;background:#fdf6e3;border:1px solid #ecd9a0;border-radius:10px;
  padding:9px 13px;font-size:12px;color:#7a5c10;
}
.tests{display:grid;gap:13px;margin-top:18px}
.test-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 1px 6px rgba(20,51,92,.05);
}
.test-card .icon{
  width:50px;height:50px;border-radius:12px;background:var(--blue-soft);
  display:grid;place-items:center;font-size:23px;flex:none;border:1px solid #cfe0f5;
}
.test-card .info{flex:1;min-width:210px}
.test-card h3{margin:0;font-size:16px;color:var(--navy)}
.test-card .meta{color:var(--muted);font-size:12px;margin-top:2px}
.test-card .meta b{color:var(--ink2)}
.hist{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.hist .h{
  font-size:11px;font-weight:800;border-radius:6px;padding:1px 8px;
  background:#f2f5fa;border:1px solid var(--line);color:var(--ink2);
}
.hist .h.best{background:var(--green-soft);border-color:#bfe5c9;color:var(--green)}
.btn{
  font-family:inherit;font-weight:800;border-radius:9px;cursor:pointer;
  font-size:14px;padding:10px 20px;border:1px solid transparent;transition:filter .15s,transform .1s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{filter:brightness(1.08)}
.btn.green{background:var(--green);color:#fff}
.btn.outline{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn.ghost{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--red);border-color:#e5b3b0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 11px}
.badge.done{background:var(--green-soft);color:var(--green);border:1px solid #bfe5c9}
.badge.pending{background:#f2f4f8;color:var(--muted);border:1px solid var(--line)}
.final-row{margin-top:16px;text-align:center}
/* ======== التعليمات واختيار الوضع ======== */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:24px;box-shadow:0 2px 10px rgba(20,51,92,.06);animation:fadein .3s ease;
}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.panel h2.title{
  margin:0 0 4px;text-align:center;color:var(--navy);font-size:21px;
  border-bottom:3px solid var(--gold);display:table;padding:0 8px 6px;margin-inline:auto;
}
.panel .subtitle{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:16px}
.inst ol{padding-right:20px;color:var(--ink2);font-size:14px}
.inst li{margin-bottom:7px}
.inst .note{
  background:var(--blue-soft);border:1px solid #cfe0f5;border-radius:10px;
  padding:10px 14px;font-size:13px;color:var(--ink2);margin-top:12px;
}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.mode-btn{
  text-align:right;background:#fff;border:2px solid var(--line);border-radius:13px;
  padding:15px 17px;cursor:pointer;font-family:inherit;transition:border-color .15s;
}
.mode-btn:hover{border-color:var(--blue)}
.mode-btn h4{margin:0 0 4px;font-size:15.5px;color:var(--navy)}
.mode-btn p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}
.mode-btn.practice h4{color:var(--green)}
/* ======== شريط التقدم والمؤقت ======== */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.qcount{color:var(--muted);font-size:13px;font-weight:700}
.timer{
  font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--navy);
  background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 16px;
}
.timer.low{color:var(--red);border-color:#e5b3b0;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.pill{
  font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 12px;border:1.5px solid;
}
.pill.practice{color:var(--green);border-color:#bfe5c9;background:var(--green-soft)}
.pill.exam{color:var(--navy);border-color:#c5d2e5;background:#eef3fa}
.pbar{height:6px;background:#dfe6f0;border-radius:99px;overflow:hidden;margin-bottom:18px}
.pbar .f{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
/* ======== سؤال العبارات ======== */
.qtext{font-size:18.5px;font-weight:700;text-align:center;margin:8px 0 24px;color:var(--ink)}
.agree{display:grid;gap:9px;max-width:560px;margin:0 auto}
.agree button{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:11px 18px;cursor:pointer;font-family:inherit;font-size:14.5px;
  font-weight:700;color:var(--ink2);transition:all .13s;
}
.agree button:hover{border-color:var(--blue);background:var(--blue-soft)}
.agree button.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--navy)}
.dots{display:flex;gap:6px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy);display:block}
.dots i.f{background:var(--navy)}
.agree button.sel .dots i{border-color:var(--blue)}
.agree button.sel .dots i.f{background:var(--blue)}
/* ======== أسئلة GCAT ======== */
.gcat-q{font-size:17px;font-weight:700;text-align:center;margin:4px 0 12px}
.gcat-stim{
  border:2px dashed var(--navy);border-radius:10px;padding:13px 20px;
  text-align:center;font-size:21px;font-weight:800;max-width:440px;margin:0 auto 22px;
  letter-spacing:2px;background:#fbfcfe;
}
.gcat-stim.seq{font-size:27px;direction:ltr}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;max-width:700px;margin:0 auto}
.opts button{
  background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:13px 10px 11px;cursor:pointer;font-family:inherit;font-size:15.5px;
  font-weight:700;color:var(--ink);transition:all .13s;position:relative;
}
.opts button:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.opts button.sel{border-color:var(--blue);background:var(--blue-soft)}
.opts button.correct{border-color:var(--green);background:var(--green-soft)}
.opts button.wrong{border-color:var(--red);background:var(--red-soft)}
.opts button:disabled{cursor:default}
.opts button .n{
  display:block;margin:7px auto 0;width:21px;height:21px;border-radius:50%;
  background:var(--navy);color:#fff;font-size:12px;line-height:21px;font-weight:800;
}
.opts button.sel .n{background:var(--blue)}
.opts button.correct .n{background:var(--green)}
.opts button.wrong .n{background:var(--red)}
.opts.shapes button{font-size:23px;letter-spacing:2px;direction:ltr}
/* الشرح الفوري في وضع التدريب */
.feedback{
  max-width:700px;margin:16px auto 0;border-radius:12px;padding:13px 16px;
  font-size:14px;animation:fadein .25s ease;border:1.5px solid;
}
.feedback.ok{background:var(--green-soft);border-color:#bfe5c9;color:#14532d}
.feedback.no{background:var(--red-soft);border-color:#e5b3b0;color:#7f1d1d}
.feedback b{display:block;margin-bottom:2px}
/* علم المراجعة وشبكة التنقل */
.flagbar{display:flex;justify-content:center;margin-top:14px}
.flag-btn{
  background:#fff;border:1.5px dashed var(--line);border-radius:999px;color:var(--muted);
  font-family:inherit;font-size:12.5px;font-weight:800;padding:6px 18px;cursor:pointer;
}
.flag-btn.on{color:var(--orange);border-color:var(--orange);border-style:solid;background:#fdf3e7}
.qnav{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.qnav button{
  width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  font-family:inherit;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;position:relative;
}
.qnav button.answered{background:var(--blue-soft);border-color:#b9d4f3;color:var(--navy)}
.qnav button.current{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 2px rgba(20,51,92,.15)}
.qnav button.flagged::after{content:'⚑';position:absolute;top:-8px;left:-4px;font-size:11px;color:var(--orange)}
/* ======== سيناريوهات الحكم ======== */
.scen-card{
  background:linear-gradient(180deg,#eaf2fd,#f6faff);border:1px solid #c9dcf5;
  border-radius:12px;padding:15px 18px;margin-bottom:16px;
  box-shadow:0 2px 8px rgba(31,111,214,.08);
}
.scen-card h4{margin:0 0 5px;color:var(--navy);font-size:15.5px}
.scen-card p{margin:0;color:var(--ink2);font-size:14px}
.scen-hint{text-align:center;font-weight:800;color:var(--navy);font-size:14.5px;margin:12px 0}
.resp{border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:11px;background:#fff}
.resp .rtext{font-size:14px;color:var(--ink);margin-bottom:9px;font-weight:600}
.rate{display:flex;gap:7px;flex-wrap:wrap}
.rate button{
  flex:1;min-width:105px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 5px;
  cursor:pointer;font-family:inherit;font-size:11px;font-weight:800;color:var(--muted);
  transition:all .12s;
}
.rate .rd{display:flex;gap:4px;direction:ltr}
.rate .rd i{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;display:block}
.rate .rd i.f{background:currentColor}
.rate button[data-v="1"]{color:var(--red)} .rate button[data-v="2"]{color:var(--orange)}
.rate button[data-v="3"]{color:var(--lightblue)} .rate button[data-v="4"]{color:var(--green)}
.rate button:hover{border-color:currentColor}
.rate button.sel{border-color:currentColor;background:currentColor}
.rate button.sel span,.rate button.sel .rd i{color:#fff;border-color:#fff}
.rate button.sel .rd i.f{background:#fff}
.expert-tag{
  display:inline-block;margin-top:8px;font-size:12px;font-weight:800;
  border-radius:8px;padding:3px 12px;background:#eef3fa;border:1px solid #c5d2e5;color:var(--navy);
}
/* ======== شريط التنقل السفلي ======== */
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--navy);display:flex;justify-content:space-between;align-items:center;
  border-top:3px solid var(--gold);padding-bottom:env(safe-area-inset-bottom);
}
.navbar button{
  background:none;border:0;color:#fff;font-family:inherit;font-size:15px;
  font-weight:800;padding:14px 30px;cursor:pointer;display:flex;align-items:center;gap:8px;
}
.navbar button:hover:not(:disabled){background:rgba(255,255,255,.1)}
.navbar button:disabled{opacity:.35;cursor:not-allowed}
.navbar .mid{color:#c8d4e6;font-size:12.5px}
/* ======== النتائج والتقرير ======== */
.result-hero{text-align:center;padding:6px 0 2px}
.result-hero .icon{font-size:40px}
.result-hero h2{margin:6px 0 2px;color:var(--navy);font-size:21px}
.result-hero p{color:var(--ink2);margin:0 0 8px;font-size:13.5px}
.score-big{font-size:50px;font-weight:800;color:var(--navy);line-height:1.2}
.score-big small{font-size:15px;color:var(--muted);font-weight:600}
.delta{font-size:13px;font-weight:800}
.delta.up{color:var(--green)} .delta.dn{color:var(--red)}
.bar-row{display:grid;grid-template-columns:165px 1fr 56px;align-items:center;gap:12px;margin-bottom:10px}
.bar-row .lbl{font-size:13px;color:var(--ink2)}
.bar-row .trk{height:11px;background:#e3e9f2;border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--blue);border-radius:99px;transition:width .6s}
.bar-row .fill.gold{background:var(--gold)}
.bar-row .fill.red{background:var(--red)}
.bar-row .val{font-size:12.5px;font-weight:800;color:var(--navy);text-align:left;font-variant-numeric:tabular-nums}
.sec-h{color:var(--navy);font-size:16.5px;margin:22px 0 4px;border-right:4px solid var(--gold);padding-right:10px}
.sec-sub{color:var(--muted);font-size:12px;margin:0 0 13px;padding-right:14px}
.comp{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:11px;background:#fff}
.comp .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.comp .name{font-weight:800;font-size:14.5px;color:var(--navy)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 13px;border:1.5px solid}
.lvl.s{color:var(--green);border-color:#bfe5c9;background:var(--green-soft)}
.lvl.n{color:var(--gold);border-color:#ecd9a0;background:#fdf8ea}
.lvl.d{color:var(--red);border-color:#e5b3b0;background:var(--red-soft)}
.comp .rec{font-size:12.5px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:7px;margin-top:5px}
.comp .rec b{color:var(--navy)}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th,table.rt td{border:1px solid var(--line);padding:7px 11px;text-align:right}
table.rt th{background:#f4f7fb;color:var(--navy);font-size:12px}
table.rt td{color:var(--ink2)}
.review-item{border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:10px}
.review-item.wrong{border-color:#e5b3b0;background:#fffafa}
.review-item .rq{font-weight:700;font-size:14px;margin-bottom:4px}
.review-item .ra{font-size:13px;color:var(--ink2)}
.review-item .ra b.ok{color:var(--green)} .review-item .ra b.no{color:var(--red)}
.review-item .rex{font-size:12.5px;color:var(--ink2);border-top:1px dashed var(--line);margin-top:7px;padding-top:6px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
/* ======== الاحتفال ======== */
.confetti{position:fixed;top:-12px;z-index:100;font-size:18px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.4}}
/* ======== شاشة التثبيت ======== */
.install-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.install-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.install-card h4{margin:0 0 6px;color:var(--navy);font-size:15px}
.install-card ol{margin:0;padding-right:18px;font-size:13px;color:var(--ink2)}
.install-card li{margin-bottom:4px}
.iprights{
  text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px;

function streak(){
  let n=0;const d=new Date();
  for(;;){
    const key=d.toISOString().slice(0,10);
    if(S.days.includes(key)){n++;d.setDate(d.getDate()-1)}
    else if(n===0&&key===today()){d.setDate(d.getDate()-1);if(!S.days.includes(d.toISOString().slice(0,10)))break}
    else break;
  }
  return n;
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

/* ---------- تبديل ترتيب الأسئلة في كل محاولة ----------
   الخلط العشوائي الكامل يجعل عبارات البُعد الواحد تتجاور أحيانًا وهذا يُفسد قياس
   الاستبيانات المهنية. لذا نخلط داخل كل بُعد ثم نوزّع الأبعاد بالتناوب بترتيب
   عشوائي في كل جولة: ترتيب مختلف كليًا كل محاولة وبلا تجاور. */
function buildSpreadOrder(items,keyOf){
  const pools={},keys=[];
  items.forEach((it,i)=>{const k=keyOf(it);if(!pools[k]){pools[k]=[];keys.push(k)}pools[k].push(i)});
  keys.forEach(k=>{pools[k]=shuffle(pools[k])});
  const depth=Math.max(...keys.map(k=>pools[k].length));
  const out=[];
  for(let round=0;round<depth;round++){
    for(const k of shuffle(keys)){const v=pools[k][round];if(v!==undefined)out.push(v)}
  }
  return out;
}
/* الشخصية: عبارات الأبعاد موزّعة، ثم تُدسّ عبارات فحص الاتساق الأربع بعيدًا عن
   توأمها (25 موضعًا على الأقل) حتى يبقى الفحص صالحًا بعد الخلط. */
function buildPqOrder(){
  const dimIdx=[],checkIdx=[];
  PQ_ITEMS.forEach((it,i)=>{(it.d==='chk'?checkIdx:dimIdx).push(i)});
  const order=buildSpreadOrder(dimIdx.map(i=>PQ_ITEMS[i]),it=>it.d).map(k=>dimIdx[k]);
  for(const ci of shuffle(checkIdx)){
    const twin=PQ_ITEMS.findIndex(x=>x.cid===PQ_ITEMS[ci].chk);
    const twinPos=order.indexOf(twin);
    let pos=null;
    for(let tries=0;tries<60;tries++){
      const cand=25+Math.floor(Math.random()*(order.length-25));
      if(twinPos<0||Math.abs(cand-twinPos)>=25){pos=cand;break}
    }
    order.splice(pos===null?order.length-1:pos,0,ci);
  }
  return order;
}
function buildDbOrder(){return buildSpreadOrder(DB_ITEMS,it=>it.d)}
/* المواقف القيادية: ترتيب السيناريوهات وترتيب الردود داخل كل سيناريو */
function buildJudgOrder(){return shuffle(SCENARIOS.map((_,i)=>i))}
function buildJudgOpts(){return SCENARIOS.map(sc=>shuffle(sc.r.map((_,i)=>i)))}
/* GCAT: خلط مواضع الخيارات داخل كل سؤال حتى لا يُحفظ «الجواب هو الخيار الثالث» */
function buildGcatOpts(order){return (order||[]).map(gi=>shuffle(GCAT_BANK[gi].o.map((_,i)=>i)))}

/* ترتيب العرض الحالي لأدوات العبارات (يُبنى عند أول استخدام ويثبت داخل المحاولة) */
function orderFor(test){
  if(test==='pq'){if(!S.pqOrder||S.pqOrder.length!==PQ_ITEMS.length){S.pqOrder=buildPqOrder();save()}return S.pqOrder}
  if(test==='db'){if(!S.dbOrder||S.dbOrder.length!==DB_ITEMS.length){S.dbOrder=buildDbOrder();save()}return S.dbOrder}
  return null;
}
function judgOrder(){if(!S.judgOrder||S.judgOrder.length!==SCENARIOS.length){S.judgOrder=buildJudgOrder();save()}return S.judgOrder}
function judgOpts(){if(!S.judgOpts||S.judgOpts.length!==SCENARIOS.length){S.judgOpts=buildJudgOpts();save()}return S.judgOpts}
function gcatOpts(){if(!S.gcatOpts||S.gcatOpts.length!==(S.gcatOrder||[]).length){S.gcatOpts=buildGcatOpts(S.gcatOrder);save()}return S.gcatOpts}

              ?`<div class="hist"><span class="h" style="background:#fdf8ea;border-color:#ecd9a0;color:#8a6d00">⏸ محفوظ: أجبت عن ${n} من ${tot} — يمكنك الاستئناف</span></div>`:''})()}
        </div>
        ${S.done[t.id]
          ?`<button class="btn outline" onclick="go('testResult',{test:'${t.id}'})">النتيجة</button>
            <button class="btn ghost" onclick="retake('${t.id}')">↻ إعادة</button>`
          :`<button class="btn primary" onclick="go('inst',{test:'${t.id}'})">${((t.id==='pq'||t.id==='db')&&answeredCount(t.id)>0)?'استئناف':'ابدأ'}</button>`}
      </div>`).join('')}
  </div>
  <div class="final-row">
    <button class="btn gold" style="font-size:15.5px;padding:12px 30px" ${doneCount===4?'':'disabled'} onclick="go('report')">
      📋 ${doneCount===4?'عرض تقرير المرشح النهائي':`تقرير المرشح يُفتح بعد إكمال الأدوات الأربع (${doneCount}/4)`}
    </button>
    <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn gold" href="https://alfalasi26481.github.io/leadership-test-ability/" style="text-decoration:none;display:inline-block">⚖️ Leadership Test Ability — منصة الحكم على المواقف (60 موقفًا)</a>
      <a class="btn ghost" href="judgment/" style="text-decoration:none;display:inline-block">مجلس الحكم القيادي</a>
      <button class="btn ghost" onclick="go('install')">📲 تثبيت التطبيق على جهازك</button>
      ${doneCount>0?`<button class="btn danger" onclick="resetAll()">مسح جميع النتائج</button>`:''}
    </div>
  </div>`;
}

function retake(id){
  if(!confirm('إعادة هذا الاختبار تمسح إجاباته الحالية وتعطيك ترتيب أسئلة جديدًا كليًا (يبقى سجل محاولاتك). نتابع؟'))return;
  S[id]={};delete S.done[id];
  // مسح ترتيب المحاولة السابقة ⇒ ترتيب مختلف في المحاولة الجديدة
  if(id==='pq')S.pqOrder=null;
  if(id==='db')S.dbOrder=null;
  if(id==='judg'){S.judgOrder=null;S.judgOpts=null}
  if(id==='gcat'){S.gcatOrder=null;S.gcatOpts=null;S.flags={};S.gcatTimeLeft=GCAT_SECONDS;S.gcatTimedOut=false}
  save();go('inst',{test:id});
}
function resetAll(){
  if(!confirm('سيتم مسح جميع النتائج والسجل نهائيًا. هل تريد المتابعة؟'))return;
  localStorage.removeItem(KEY);S=fresh();save();go('home');
}

/* أول سؤال لم يُجب عنه — لاستئناف الاستبيانات الطويلة من حيث توقف المتدرب */
function firstUnanswered(test,total){
  const ord=orderFor(test)||[];
  for(let i=0;i<total;i++)if(S[test][ord[i]]===undefined)return i;
  return 0;
}
function answeredCount(test){return Object.keys(S[test]||{}).length}
function startTest(test,mode){
  if(test==='pq'){orderFor('pq');return go('pq',{idx:firstUnanswered('pq',PQ_ITEMS.length)})}
  if(test==='db'){orderFor('db');return go('db',{idx:firstUnanswered('db',DB_ITEMS.length)})}
  if(test==='gcat'){
    // كل محاولة: أسئلة مسحوبة من البنك بترتيب جديد + مواضع خيارات جديدة
    S.gcatMode=mode;S.gcat={};S.flags={};S.gcatOrder=drawGcat();S.gcatOpts=buildGcatOpts(S.gcatOrder);
    S.gcatTimeLeft=GCAT_SECONDS;S.gcatTimedOut=false;save();
  }
  if(test==='judg'){S.judgMode=mode;S.judg={};S.judgOrder=buildJudgOrder();S.judgOpts=buildJudgOpts();save()}
  go(test,{idx:0});
}

function answerAgree(test,i,level,total){

function nextAgree(test,i,total){
  if(S[test][orderFor(test)[i]]===undefined)return;

    S.done[test]=true;
    const score=test==='pq'?avg(Object.values(scorePQ())):100-avg(Object.values(scoreDB()));

function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function renderGcat(){

  const revealed=practice&&val!==undefined;
  app.innerHTML=`

    <div class="opts ${item.sh?'shapes':''}">
      ${(gcatOpts()[i]||item.o.map((_,k)=>k)).map((orig,pos)=>{
        // orig = الخيار الأصلي · pos = موضعه المعروض في هذه المحاولة
        let cls=val===orig?'sel':'';
        if(revealed){if(orig===item.a)cls='correct';else if(val===orig)cls='wrong'}
        return `<button class="${cls}" ${revealed?'disabled':''} onclick="answerGcat(${i},${orig})">${item.o[orig]}<span class="n">${pos+1}</span></button>`;
      }).join('')}
    </div>
    ${revealed?`<div class="feedback ${val===item.a?'ok':'no'}">
      <b>${val===item.a?'✅ إجابة صحيحة':'❌ إجابة غير صحيحة — الصحيح: '+item.o[item.a]}</b>${item.ex}
    </div>`:''}
    ${practice?'':`<div class="flagbar">
      <button class="flag-btn ${S.flags[i]?'on':''}" onclick="toggleFlag(${i})">🚩 ${S.flags[i]?'مُعلَّم للمراجعة':'علِّم هذا السؤال للمراجعة'}</button>
    </div>`}
  </section>`;
  navEl.innerHTML=`<div class="navbar">
    <button ${i===0?'disabled':''} onclick="go('gcat',{idx:${i-1}})">❮ السابق</button>
    <span class="mid">السؤال ${i+1} / ${items.length}</span>

  </div>`;
  if(!practice){
    stopTimer();
    timerHandle=setInterval(()=>{
      S.gcatTimeLeft=Math.max(0,S.gcatTimeLeft-1);
      const el=document.getElementById('gtimer');
      if(el){el.textContent='⏱ '+fmtTime(S.gcatTimeLeft);if(S.gcatTimeLeft<=60)el.classList.add('low')}
      if(S.gcatTimeLeft%5===0)save();
      if(S.gcatTimeLeft<=0){S.gcatTimedOut=true;finishGcat()}
    },1000);
  }
}
function toggleFlag(i){S.flags[i]=!S.flags[i];save();render()}
function answerGcat(i,k){
  const practice=S.gcatMode==='practice';
  if(practice&&S.gcat[i]!==undefined)return;
  S.gcat[i]=k;save();
  if(practice){render()}
  else setTimeout(()=>{
    const items=gcatItems();
    if(i+1<items.length)go('gcat',{idx:i+1});else go('gcatReview');

function nextGcat(i){

/* =====================================================================
   التصحيح
   ===================================================================== */
function scorePQ(){
  const out={};
  Object.keys(PQ_DIMS).forEach(d=>{
    const idxs=PQ_ITEMS.map((it,i)=>({it,i})).filter(x=>x.it.d===d);
    let sum=0;
    idxs.forEach(x=>{const v=S.pq[x.i]??3;sum+=x.it.r?6-v:v});
    out[d]=Math.round((sum-idxs.length)/(idxs.length*4)*100);
  });
  return out;
}
/* مؤشر اتساق الإجابات: يقارن كل عبارة فحص بالعبارة المكافئة لها.
   فرق 0 = تطابق تام، وكل درجة فرق تخصم من الاتساق. */
function consistencyScore(){
  const pairs=[];
  PQ_ITEMS.forEach((it,i)=>{
    if(!it.chk)return;
    const j=PQ_ITEMS.findIndex(x=>x.cid===it.chk);
    if(j<0)return;
    const a=S.pq[i],b=S.pq[j];
    if(a===undefined||b===undefined)return;
    pairs.push({gap:Math.abs(a-b),a,b,t:it.t});
  });
  if(!pairs.length)return null;
  const avgGap=pairs.reduce((x,p)=>x+p.gap,0)/pairs.length;
  const pct=Math.max(0,Math.round((1-avgGap/4)*100));
  return {pct,pairs,
    label:pct>=85?'اتساق عالٍ':pct>=65?'اتساق مقبول':'اتساق منخفض',
    cls:pct>=85?'s':pct>=65?'n':'d',
    note:pct>=85?'إجاباتك متسقة عبر الصياغات المختلفة — وهذا ما تقيسه الأنظمة الرسمية وتعتمد عليه في الثقة بالنتيجة.'
        :pct>=65?'اتساق مقبول، لكن راجع سرعة إجابتك: العبارات المتشابهة يجب أن تتلقى تقييمًا متقاربًا.'
        :'إجاباتك متباينة على عبارات متكافئة المعنى — في الاختبار الرسمي قد يُقرأ ذلك كإجابة غير متأنية أو محاولة تجميل. أجب بعفوية وبإجابتك الأولى.'};
}
function scoreDB(){
  const out={};
  Object.keys(DB_TRAITS).forEach(d=>{
    const idxs=DB_ITEMS.map((it,i)=>({it,i})).filter(x=>x.it.d===d);
    let sum=0;
    idxs.forEach(x=>{sum+=S.db[x.i]??1});
    out[d]=Math.round((sum-idxs.length)/(idxs.length*4)*100);
  });
  return out;
}
function scoreGcatAll(){
  const items=gcatItems();
  const per={v:{c:0,t:0},n:{c:0,t:0},a:{c:0,t:0}};
  items.forEach((it,i)=>{per[it.dom].t++;if(S.gcat[i]===it.a)per[it.dom].c++});
  const pct=k=>per[k].t?Math.round(per[k].c/per[k].t*100):0;
  const totalC=per.v.c+per.n.c+per.a.c;
  return {v:pct('v'),n:pct('n'),a:pct('a'),detail:per,
    total:items.length?Math.round(totalC/items.length*100):0};
}
function scoreJudg(){
  let pts=0,max=0;
  SCENARIOS.forEach((sc,i)=>{
    sc.r.forEach((resp,ri)=>{
      max+=3;
      const v=(S.judg[i]||{})[ri];
      if(v!==undefined)pts+=3-Math.abs(v-resp.k);
    });
  });
  return Math.round(pts/max*100);
}
function allScores(){
  return {pq:scorePQ(),db:scoreDB(),gcat:scoreGcatAll(),judg:scoreJudg()};
}
function deltaChip(id,score){
  const at=S.attempts[id]||[];
  if(at.length<2)return '';
  const prev=at[at.length-2].score;
  const d=score-prev;
  if(d===0)return `<span class="delta">＝ مثل محاولتك السابقة</span>`;
  return d>0?`<span class="delta up">▲ +${d} عن محاولتك السابقة</span>`
            :`<span class="delta dn">▼ ${d} عن محاولتك السابقة</span>`;
}

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{
    // هل كان جهاز المستخدم يعمل بنسخة سابقة من التطبيق؟
    const hadController=!!navigator.serviceWorker.controller;
    let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      // عند وصول نسخة أحدث لمستخدم قديم: إعادة تحميل واحدة تعرض التحديث فورًا
      // (أول تثبيت لا يحتاج إعادة تحميل لأن الصفحة أحدث نسخة أصلًا)
      if(!hadController||reloaded)return;
      reloaded=true;location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
