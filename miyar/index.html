   w:'يفتح باب تدخلات لا تُغلق، ويعرّضك ومؤسستك لمساءلة حين يظهر أثر التفضيل لاحقًا.'},
  {t:'أواجه المسؤول وأخبره بوضوح أن تدخله غير مقبول.', k:2,
   w:'موقف صحيح مبدئيًا لكنه بلا توثيق؛ يخلق خصومة ولا يترك أثرًا يحميك إن أُنكر الحديث.'},
 ]},

{id:'ق3-12', lvl:3, t:'ثقافة تقاوم', c:['insp','emo'],
 s:'برنامج التحول الذي أطلقته قبل عام حقق أهدافه التقنية بالكامل، لكن تبنّي الموظفين للممارسات الجديدة لم يتجاوز الثلث. الأنظمة جاهزة والناس عادوا لطرقهم القديمة بهدوء.',
 l:'التحول الذي ينجح تقنيًا ويفشل سلوكيًا لم يجب عن سؤال الموظف: «ماذا يعني هذا لعملي اليومي؟». الإجابة لا تأتي من تعميم بل من قدوة ومعنى وحوافز متسقة.',
 r:[
  {t:'أبحث مع عيّنة من غير المتبنّين عن العوائق الحقيقية في عملهم اليومي، ثم أعالجها وأربط الحوافز والتقييم بالممارسة الجديدة.', k:4,
   w:'يشخّص قبل أن يعالج، ثم يغيّر ما يصنع السلوك فعلًا: العوائق والحوافز لا التعميمات.'},
  {t:'أُشرك المديرين المباشرين كقدوة أولى وأجعل التزامهم الشخصي بالممارسة شرطًا معلنًا في تقييمهم.', k:4,
   w:'الموظف يقلّد مديره لا التعميم؛ بلا التزام طبقة الإشراف لا يصمد أي تحول.'},
  {t:'أطلق حملة توعية داخلية مكثفة تشرح فوائد التحول وأهدافه.', k:2,
   w:'يعالج نقص المعرفة وهو نادرًا ما يكون السبب؛ الناس لا يقاومون لأنهم لم يفهموا بل لأن العائد لهم غير واضح.'},
  {t:'أفرض الممارسة الجديدة بإجراء إلزامي وأمنع استخدام الطرق القديمة تقنيًا.', k:3,
   w:'يرفع التبني رقميًا بسرعة، لكنه ينتج امتثالًا شكليًا وحلولًا التفافية ما لم يعالَج سبب المقاومة.'},
 ]},

/* ══════════ المستوى 4 — المعضلات والأزمات ══════════ */
{id:'ق4-01', lvl:4, t:'مخالفة من أعلى', c:['init','impr'],
 s:'خلال جولة ميدانية، تجاوز قيادي أعلى منك إجراء سلامة إلزاميًا أمام عدد من الموظفين، وقال إن الوقت لا يسمح. لم يقع ضرر، لكن الموظفين رأوا المشهد وأحدهم سألك عنه لاحقًا.',
 l:'قواعد السلامة تموت لحظة استثناء أقوى شخص في الموقع. المعالجة ليست فضح أحد بل تثبيت أن القاعدة فوق الجميع — بالإجراء لا بالمواجهة.',
 r:[
  {t:'أتحدث معه على انفراد فورًا وأوضح أثر المشهد على التزام الفريق، وأوثّق الواقعة عبر قناة السلامة المعتمدة بلا تشهير.', k:4,
   w:'يجمع المعالجة المباشرة بالتوثيق النظامي، فيحفظ القاعدة ومكانة الشخص في آن.'},
  {t:'أجيب سائلي بوضوح أن الإجراء إلزامي على الجميع بلا استثناء، وأعيد التذكير به في اجتماع السلامة القادم دون الإشارة لأحد.', k:4,
   w:'يعيد تثبيت القاعدة عند من اهتزت لديهم، وهو الضرر الحقيقي للواقعة، دون تحويلها إلى قضية شخصية.'},
  {t:'أتجاهل الواقعة لأنها لم تُحدث ضررًا ولأن صاحبها أعلى مني.', k:1,
   w:'الصمت هنا موافقة صامتة؛ يعلّم الفريق أن القواعد تسقط عند مستوى معين من السلطة.'},
  {t:'أرفع الأمر مباشرة إلى لجنة السلامة العليا دون التحدث معه.', k:2,
   w:'التصعيد قبل المحاولة المباشرة في واقعة بلا ضرر يُقرأ استهدافًا ويغلق باب المعالجة الهادئة.'},
 ]},

{id:'ق4-02', lvl:4, t:'مخالفة رئيسك', c:['impr','init'],
 s:'أثناء مراجعة روتينية، لاحظت نمطًا في اعتمادات مالية صغيرة متكررة وقّعها رئيسك المباشر لجهة واحدة، بما يوحي بتجاوز محتمل. الأدلة ظرفية وقد يكون هناك تفسير نظامي لا تعرفه.',
 l:'الاشتباه ليس اتهامًا، والصمت ليس حيادًا. المسار المهني: تحقق من فهمك أولًا، ثم استخدم القناة المخصصة — لا التحقيق الشخصي ولا التجاهل.',
 r:[
  {t:'أوثّق الملاحظة بدقة وأستفسر عن الإطار النظامي لهذا النوع من الاعتمادات عبر الجهة المختصة دون اتهام، ثم أتصرف بحسب الجواب.', k:4,
   w:'يفصل التحقق من الفهم عن الاتهام، ويستخدم قناة مؤهلة للحكم بدل أن تتحول أنت إلى محقق وخصم.'},
  {t:'أبلّغ عبر قناة الإبلاغ الداخلية المعتمدة بالوقائع المجردة وأترك التقييم لجهة الاختصاص.', k:4,
   w:'المسار المصمم لهذه الحالة بالضبط: يحمي المؤسسة، ويحمي المبلّغ، ويحمي المشتبه به من حكم متسرع.'},
  {t:'أسأله مباشرة عن هذه الاعتمادات في لقاء عادي.', k:2,
   w:'قد ينهي الالتباس بسرعة، لكنه ينبّه صاحب المخالفة إن وُجدت، ويضعك في مواجهة بلا سند.'},
  {t:'أتجاهل الأمر لأن الأدلة ظرفية ولأن التبليغ عن الرئيس المباشر مكلف مهنيًا.', k:1,
   w:'يجعل الكلفة الشخصية معيار النزاهة، ويحمّلك لاحقًا مسؤولية العلم والسكوت.'},
 ]},

{id:'ق4-03', lvl:4, t:'الظرف الصحي', c:['emo','trust'],
 s:'موظف أمضى تسع سنوات في فريقك بأداء ممتاز انهار أداؤه منذ أربعة أشهر بعد تشخيص مرضي في أسرته أخبرك به سرًّا. الفريق بدأ يتذمر من تحميل عبئه عليهم، ولا يعلمون السبب.',
 l:'حفظ سر الموظف واجب، وإنصاف الفريق واجب آخر. الحل ليس المفاضلة بينهما بل إعادة ترتيب العمل رسميًا بأداة مؤسسية تشرح العبء دون كشف السبب.',
 r:[
  {t:'أرتب معه ترتيبًا مؤقتًا موثقًا (تخفيف حمل، مرونة، إجازة مرضية) عبر الموارد البشرية، وأبلغ الفريق بوجود ترتيب استثنائي معتمد دون ذكر سببه.', k:4,
   w:'يحفظ الخصوصية ويعالج تذمر الفريق بشرعية الإجراء، ويمنح الموظف مسارًا نظاميًا لا شفقة شخصية.'},
  {t:'أتفق معه على خطة تعافٍ بمراحل ومواعيد مراجعة، وأعيد توزيع العبء رسميًا مع تقدير معلن لمن تحمّلوه.', k:4,
   w:'يمنع تحوّل الاستثناء إلى وضع دائم، ويحفظ عدالة من حملوا الفرق بالاعتراف بجهدهم.'},
  {t:'أستمر في تغطيته شخصيًا وأطلب من الفريق الصبر دون تفسير.', k:2,
   w:'نية طيبة بلا إطار؛ الغموض يولّد تفسيرًا بالمحاباة ويستنزف عدالتك أمام البقية.'},
  {t:'أُخضعه لإجراءات الأداء المعتادة كأي موظف تراجع أداؤه، التزامًا بالعدالة.', k:1,
   w:'المساواة الشكلية في ظرف استثنائي ظلم؛ تخسر موظفًا بتسع سنوات وتعلّم الفريق أن المؤسسة لا تسند أحدًا.'},
 ]},

{id:'ق4-04', lvl:4, t:'استثناء المتعامل الكبير', c:['impr','emo'],
 s:'أكبر متعامل لديكم يطلب استثناءً من سياسة معتمدة، ويلمّح إلى مراجعة علاقته بالمؤسسة إن لم يُلبَّ. الاستثناء لا يخالف القانون لكنه يخالف سياسة داخلية طُبقت على الجميع.',
 l:'الاستثناء لأكبر متعامل يُلغي السياسة عمليًا لأن الجميع سيعلم. الطريق الصحيح: عالج حاجته الحقيقية بوسيلة لا تكسر القاعدة، أو غيّر القاعدة للجميع.',
 r:[
  {t:'أبحث عن حاجته الفعلية خلف الطلب وأصمم حلًا بديلًا يحققها ضمن السياسة، وأعرضه عليه بوضوح.', k:4,
   w:'يفصل المطلب عن الحاجة؛ أغلب طلبات الاستثناء لها حل داخل القاعدة لم يبحث عنه أحد.'},
  {t:'أرفع الحالة لمراجعة السياسة نفسها إن ثبت أنها غير عملية، بحيث يُعدَّل الحكم للجميع لا لطرف واحد.', k:4,
   w:'يحوّل الضغط الفردي إلى تحسين مؤسسي، ويحفظ مبدأ المساواة أمام القاعدة.'},
  {t:'أمنحه الاستثناء بقرار موثق نظرًا لحجم أعماله وأهميته للمؤسسة.', k:1,
   w:'التوثيق لا يشرعن كسر القاعدة؛ ستصل السابقة لبقية المتعاملين وتفقد السياسة قيمتها كلها.'},
  {t:'أرفض الطلب متمسكًا بالسياسة وأوضح له أنها تُطبق على الجميع.', k:3,
   w:'موقف مبدئي سليم، لكنه يغلق الملف دون البحث عن حل ويخاطر بعلاقة كان يمكن حفظها.'},
 ]},

{id:'ق4-05', lvl:4, t:'الضرر الصامت', c:['impr','init'],
 s:'اكتشفت أن خللًا في نظام قديم تسبب خلال سنتين في احتساب رسوم زائدة على شريحة من المتعاملين بمبالغ صغيرة فرديًا وكبيرة إجماليًا. لم يشتكِ أحد ولم ينتبه أحد، والإصلاح تم.',
 l:'إصلاح الخلل لا يُسقط حق المتضرر. المؤسسة التي تردّ ما أخذته دون أن يُطالَب به تشتري ثقة لا يشتريها أي تسويق.',
 r:[
  {t:'أعرض على الإدارة خطة تصحيح كاملة: حصر المتأثرين، وردّ المبالغ، وإشعارهم بما حدث وبالإجراء المتخذ.', k:4,
   w:'يعيد الحق لأصحابه ويحوّل خطأً مؤسسيًا إلى دليل نزاهة، ويسدّ مسؤولية قانونية مؤجلة.'},
  {t:'أبلّغ الجهة التنظيمية والمراجعة الداخلية بالواقعة وأثرها وأتبع توجيهاتهما في آلية التصحيح.', k:4,
   w:'يضمن أن يكون التصحيح مطابقًا للمتطلبات، ويحمي المؤسسة من اجتهاد فردي في مسألة حقوق.'},
  {t:'أكتفي بإصلاح الخلل وأوقف تكراره دون فتح ملف الماضي.', k:1,
   w:'يوقف الضرر ويُبقي الحق مأخوذًا؛ وانكشافه لاحقًا يحوّل خطأً تقنيًا إلى اتهام بالإخفاء.'},
  {t:'أرد المبالغ لمن يطالب بها فقط إذا ظهرت شكاوى مستقبلًا.', k:1,
   w:'يجعل الحق رهنًا بانتباه صاحبه، وهو تمييز بين المتضررين لا يصمد أمام أي مراجعة.'},
 ]},

{id:'ق4-06', lvl:4, t:'ولاءان', c:['team','insp'],
 s:'نُقلت إلى قيادة إدارة كان لها قائد محبوب غادر بخلاف مع المؤسسة. فريقك منقسم: مجموعة تتعامل معك بتحفظ ولاءً له، ومجموعة تنتظر منك تغييرًا سريعًا يثبت اختلافك عنه.',
 l:'القائد الجديد لا يكسب فريقًا بإدانة سابقه ولا بتقليده. الانتصار لمصلحة الفريق في أول ملف حقيقي هو ما يوحّد المنقسمين حولك.',
 r:[
  {t:'لا أدخل في تقييم سابقي إطلاقًا، وأستمع للجميع فرديًا في أول أسبوعين، ثم أنتصر لأول حاجة حقيقية للفريق وأحققها.', k:4,
   w:'الأثر الملموس يوحّد ما لا يوحّده الكلام، وتجنّب تقييم السابق يمنع الانقسام من أن يتجدد حولك.'},
  {t:'أعلن بوضوح احترامي لما بُني سابقًا وأطرح خطة الأشهر الثلاثة المقبلة وأدعو الجميع للمساهمة فيها.', k:3,
   w:'يطمئن الطرفين ويعطي اتجاهًا، لكن الخطة قبل الاستماع تخاطر بمعالجة ما ليس مشكلة.'},
  {t:'أُجري تغييرات سريعة في الإجراءات لأثبت أن مرحلة جديدة بدأت.', k:2,
   w:'يرضي المنتظرين ويؤكد مخاوف المتحفظين، ويغيّر قبل أن يفهم ما يستحق التغيير.'},
  {t:'أوضح للفريق أسباب مغادرة القائد السابق لإزالة الغموض.', k:1,
   w:'الخوض في ملف شخصي لطرف غائب يهدم ثقتك عند الجميع: من يتحدث عن غائب اليوم يتحدث عن حاضر غدًا.'},
 ]},

{id:'ق4-07', lvl:4, t:'قرار في غياب القيادة', c:['init','idea'],
 s:'وقع تعطل تشغيلي يتصاعد أثره كل ساعة. القرار المطلوب يتجاوز صلاحيتك، والمسؤول الأعلى غير متاح على أي قناة منذ ساعتين، والانتظار حتى الصباح يضاعف الخسارة.',
 l:'تجاوز الصلاحية في الطوارئ ليس مخالفة إذا كان موثقًا، محدودًا بأقل تدخل يوقف الضرر، ومبلَّغًا عنه فور إمكانه. التردد نفسه قرار وله كلفة.',
 r:[
  {t:'أتخذ أقل قرار يوقف تصاعد الضرر ضمن أقرب صلاحية متاحة، وأوثّق المبررات والبدائل لحظيًا، وأبلغ فور توفر المسؤول.', k:4,
   w:'يحد الضرر بأقل تجاوز، والتوثيق اللحظي هو ما يفرّق بين قرار مسؤول ومخالفة صلاحية.'},
  {t:'أفعّل بروتوكول الطوارئ وأتواصل مع البديل في التسلسل الإداري أو رئيس لجنة الأزمات.', k:4,
   w:'المسار الصحيح دائمًا: الصلاحية لا تختفي بغياب شخص، والبحث عن البديل قبل التجاوز واجب.'},
  {t:'أنتظر عودته وأوثّق محاولات الاتصال لحماية نفسي من المساءلة.', k:1,
   w:'يحمي الفرد ويضحّي بالمؤسسة؛ التوثيق لا يعوّض خسارة كان يمكن منعها.'},
  {t:'أتخذ القرار الكامل الذي أراه صحيحًا وأعرضه عليه لاحقًا للاعتماد.', k:2,
   w:'قد ينجح، لكنه يتجاوز الضرورة إلى ما هو أبعد منها ويضعك في مواجهة مساءلة صلاحية حقيقية.'},
 ]},

{id:'ق4-08', lvl:4, t:'معلومة لا تُقال', c:['emo','trust'],
 s:'بحكم موقعك تعلم قرارًا سيصدر بعد شهر بإلغاء مشروع يعمل عليه فريقك بحماس، وأنت ملزم بالسرية. يواصل الفريق العمل بجهد إضافي، وأحدهم رفض للتوّ عرضًا خارجيًا ليكمل المشروع.',
 l:'لا يمكنك كشف السر، لكن يمكنك ألّا تُنفق جهد فريقك فيما تعلم أنه ذاهب. إعادة توجيه الجهد وتوسيع الخيارات قرار مشروع لا يكسر السرية.',
 r:[
  {t:'أطلب من صانع القرار إذنًا بالإفصاح المبكر أو تقديم إعلان القرار، مبيّنًا كلفة استمرار الفريق في جهد سيُهدر.', k:4,
   w:'يهاجم القيد نفسه بدل الالتفاف عليه؛ كثير من قيود السرية تُرفع حين تُعرض كلفتها على صاحبها.'},
  {t:'أعيد توجيه جهد الفريق نحو مكوّنات قابلة لإعادة الاستخدام، وأوقف أي التزام إضافي طويل الأمد دون كشف السبب.', k:4,
   w:'يحمي جهد الفريق ضمن صلاحياتك دون كسر السرية، ويقلل الخسارة حين يصدر القرار.'},
  {t:'أواصل كالمعتاد التزامًا بالسرية وأتعامل مع الأثر عند صدور القرار.', k:2,
   w:'يفي بالحرف ويخون الروح؛ ثقة الفريق تُقاس بما فعلته وأنت تعلم، لا بما قلته بعد الإعلان.'},
  {t:'ألمّح للموظف الذي رفض العرض بأن يعيد النظر في قراره.', k:1,
   w:'كسر جزئي للسرية بأسوأ صوره: يضر بك مهنيًا، ويضع الموظف في حيرة بلا معلومة تكفي لقرار.'},
 ]},

{id:'ق4-09', lvl:4, t:'تضارب مصالح', c:['impr','emo'],
 s:'تقدّمت شركة يملك أحد أقاربك حصة فيها لمنافسة تشرف عليها لجنتها. عرضها قوي فنيًا وقد يفوز باستحقاق، ولا تعلم اللجنة بالصلة، ولا يوجد نص صريح يمنع.',
 l:'تضارب المصالح يُقاس بالمظهر لا بالنية. الإفصاح والتنحي لا يعني أنك مذنب، بل يعني أن النتيجة ستصمد أمام أي مراجعة مستقبلية.',
 r:[
  {t:'أفصح عن الصلة كتابةً للجنة والجهة المختصة، وأتنحى عن أي دور في التقييم والترسية.', k:4,
   w:'الإفصاح والتنحي هما المعيار المهني؛ يحميان نزاهة النتيجة وسمعتك سواء فاز العرض أو خسر.'},
  {t:'أفصح عن الصلة وأترك للجنة أو جهة الحوكمة قرار مدى مشاركتي.', k:3,
   w:'الإفصاح صحيح، لكن ترك القرار لمن قد يحرج برفضك يبقي ظل الشبهة على النتيجة.'},
  {t:'أواصل الإشراف بحياد كامل ما دام لا يوجد نص يمنع ولا مصلحة مباشرة لي.', k:1,
   w:'الحياد الشخصي لا يُثبت لاحقًا؛ اكتشاف الصلة بعد الترسية يُبطل الثقة في المنافسة كلها.'},
  {t:'أستبعد عرض الشركة من المنافسة تجنبًا للشبهة.', k:2,
   w:'يظلم متنافسًا مستحقًا ويبقيك طرفًا في قرار كان يجب أن تتنحى عنه أصلًا.'},
 ]},

{id:'ق4-10', lvl:4, t:'الوفاء أم الكفاءة', c:['trust','impr'],
 s:'وظيفة إشرافية شاغرة، ومرشحان: موظف أمضى اثني عشر عامًا بولاء وانضباط وأداء جيد، وموظفة انضمت قبل ثلاث سنوات بأداء متميز ومؤشرات قيادية أوضح. الفريق يتوقع ترقية الأقدم.',
 l:'الأقدمية ليست استحقاقًا للقيادة ولا مانعًا منها. المعيار هو متطلبات الدور — ومن يخسر يستحق مسارًا حقيقيًا لا جملة مجاملة.',
 r:[
  {t:'أقيّم الاثنين على متطلبات الدور بأدلة موثقة، وأعلن المعيار مسبقًا، وأضع لمن لم يُختر مسارًا تطويريًا واضحًا بفرصة قادمة محددة.', k:4,
   w:'يحسم بالمعيار لا بالأقدمية ولا بالمجاملة، ويحفظ الخاسر بمسار حقيقي بدل تسكينه بكلمة طيبة.'},
  {t:'أرشّح الأكفأ وأشرح لمن لم يُختر بصراحة الفجوة المحددة وكيف يسدّها، مع تقدير علني لسنواته.', k:4,
   w:'يجمع بين قرار صحيح وتعامل إنساني؛ الصراحة المحددة أكرم من الغموض، والتقدير العلني يحفظ مكانته.'},
  {t:'أرقّي الأقدم وفاءً لسنواته وتجنبًا لإحباط بقية القدامى.', k:2,
   w:'يرسل رسالة بأن الأقدمية تكفي، فيفقد المتميزون دافعهم ويخسر الفريق قيادة أقدر.'},
  {t:'أؤجل شغل الوظيفة حتى تهدأ حساسية الفريق تجاه الموضوع.', k:1,
   w:'يترك الفريق بلا قيادة ويطيل الحساسية بدل حسمها، والتأجيل بلا سبب مهني يُقرأ عجزًا عن القرار.'},
 ]},

{id:'ق4-11', lvl:4, t:'الإعلام على الباب', c:['init','info'],
 s:'أثناء عطل تشغيلي ما زال قيد المعالجة، اتصل صحفي يطلب تصريحًا خلال ساعة وإلا نشر بما لديه. المتحدث الرسمي مسافر، والمعلومات الفنية لم تكتمل، والعطل مرئي للجمهور.',
 l:'مع الإعلام لا يوجد خيار «بلا تعليق»؛ الفراغ يُملأ بروايات أسوأ. المهني: تصريح قصير عما تعرفه يقينًا وموعد تحديث — بمن يملك الصلاحية.',
 r:[
  {t:'أنسّق فورًا مع الاتصال المؤسسي لإصدار تصريح قصير معتمد: ما نعرفه يقينًا، ما نعمل عليه، وموعد التحديث القادم.', k:4,
   w:'يملأ الفراغ بمعلومة رسمية دون تجاوز صلاحية ولا التزام بما لم يُتحقق، ويحفظ زمام الرواية.'},
  {t:'أطلب من الصحفي مهلة محددة وأعطيه موعدًا دقيقًا لتصريح رسمي ألتزم به.', k:3,
   w:'يشتري وقتًا بمهنية، لكنه يترك ساعة كاملة بلا موقف رسمي وقد لا يقبل المهلة.'},
  {t:'أصرّح بما أعرفه شخصيًا لتقديم رواية المؤسسة قبل النشر.', k:2,
   w:'نية صحيحة بصلاحية خاطئة؛ تصريح غير معتمد بمعلومات ناقصة قد يصبح هو الأزمة.'},
  {t:'أمتنع عن التعليق حتى عودة المتحدث الرسمي واكتمال المعلومات.', k:1,
   w:'الصمت أمام عطل مرئي يُقرأ إخفاءً، وتُنشر القصة بمصادر أخرى تصبح هي المرجع.'},
 ]},

{id:'ق4-12', lvl:4, t:'تجميل التقرير', c:['impr','emo'],
 s:'قبل عرض تقرير الأداء على المجلس، طلب منك مسؤول أعلى «تلطيف» عرض مؤشرين متراجعين بإبرازهما ضمن سياق أوسع يخفف وقعهما. لا تزوير في الأرقام، لكن الخلاصة ستتغير لدى القارئ.',
 l:'التضليل بالعرض تضليل وإن صحّت الأرقام. الحل المهني: اعرض السياق كاملًا ظاهرًا لا مذابًا، فتكسب دقة العرض وثقة المجلس معًا.',
 r:[
  {t:'أعرض المؤشرين بوضوح مع سياقهما وأسبابهما وخطة المعالجة في الموضع نفسه، وأوضح للمسؤول أن هذا أقوى أمام المجلس من التخفيف.', k:4,
   w:'يلبي حاجته الحقيقية (ألّا يبدو الوضع خارج السيطرة) بوسيلة مشروعة: السياق الظاهر مع خطة، لا الإخفاء.'},
  {t:'أُبقي عرض الأرقام كما هو وأوثّق طلب التعديل ومن صدر عنه.', k:3,
   w:'يحمي دقة التقرير ونفسك، لكنه يحوّل الموقف إلى مواجهة صامتة دون محاولة لحل يرضي الطرفين.'},
  {t:'أنفّذ التلطيف ما دامت الأرقام صحيحة ولم يُطلب مني تغييرها.', k:1,
   w:'الأرقام الصحيحة المعروضة لتضليل القارئ أخطر من الخطأ، لأنها مقصودة ويصعب الدفاع عنها لاحقًا.'},
  {t:'أرفض الطلب وأبلغ رئيس لجنة التدقيق بمحاولة التأثير على التقرير.', k:2,
   w:'التصعيد الفوري في طلب عرض (لا تزوير) قبل أي نقاش يُفوّت حلًا مهنيًا ويصعّد ما كان قابلًا للمعالجة.'},
 ]},

/* ══════════ إضافات المستوى 1 ══════════ */
{id:'ق1-13', lvl:1, t:'خطأ أمام العميل', c:['emo','trust'],
 s:'في اجتماع مع عميل مهم، قدّم أحد أعضاء فريقك رقمًا خاطئًا بثقة، وبنى العميل سؤاله التالي عليه. أنت تعرف الرقم الصحيح، والاجتماع ما زال قائمًا، والموظف حديث العهد نسبيًا ويبدو متوترًا.',
 l:'تصحيح الخطأ أمام العميل واجب فوري، أما محاسبة صاحبه فشأن لاحق وخاص. القائد الذي يخلط بين الأمرين إمّا يضحّي بالدقة أو بالموظف.',
 r:[
  {t:'أصحّح الرقم فورًا بصيغة جماعية هادئة ("دعني أضيف الرقم المحدّث")، وأكمل الاجتماع بشكل طبيعي، ثم أراجع الموظف على انفراد بعده مباشرة.', k:4,
   w:'يحمي دقة المعلومة أمام العميل دون إحراج الموظف، ويفصل التصحيح الفوري عن التغذية الراجعة الخاصة — وهو جوهر الحكم هنا.'},
  {t:'أترك الرقم دون تصحيح حتى لا أُحرجه، ثم أرسل للعميل تصحيحًا مكتوبًا بعد الاجتماع.', k:2,
   w:'يحفظ مشاعر الموظف لكنه يترك العميل يبني قرارًا على رقم خاطئ في الغرفة، والتصحيح اللاحق يضعف الثقة في الفريق كله.'},
  {t:'أوضّح للعميل أن الرقم غير صحيح وأن الزميل ما زال في طور التدريب على هذا الملف.', k:1,
   w:'يصحّح المعلومة بثمن باهظ: تعرية الموظف أمام طرف خارجي تُفقده الثقة وتُفقد العميل ثقته في الفريق لا في الرقم وحده.'},
  {t:'أُنهي الجزئية بسرعة وأنقل النقاش لبند آخر، ثم أعود للرقم في اجتماع المتابعة.', k:2,
   w:'التهرّب من البند لا يمحو الرقم من ذهن العميل، ويؤجّل مشكلة كان يمكن إغلاقها في ثانيتين.'},
 ]},

{id:'ق1-14', lvl:1, t:'تفضيل متوهَّم', c:['emo','team'],
 s:'بلغك أن اثنين من فريقك يتحدثان بأنك "تفضّل" زميلًا ثالثًا لأنك تسند له المهام البارزة. في الواقع أسندتها له لأنه الوحيد المؤهل تقنيًا لها، لكنك لم تشرح ذلك لأحد.',
 l:'الإنصاف المعلن ليس ترفًا: توزيع لم يُشرح يُقرأ محاباة مهما كان عادلًا. القائد مسؤول عن معيار مرئي لا عن نيّة سليمة فقط.',
 r:[
  {t:'أعلن معيار إسناد المهام البارزة للفريق كله، وأفتح مسارًا واضحًا لمن يريد التأهل له، وأبدأ بإشراك غيره في جزء من الملف التالي.', k:4,
   w:'يعالج جذر الشكوى (غياب المعيار) لا عَرَضها، ويحوّل الشكوى إلى فرصة تطوير بدل جدال حول النوايا.'},
  {t:'أجتمع بالاثنين وأشرح لهما سبب الإسناد التقني وأطلب منهما وقف الحديث خلف الظهر.', k:3,
   w:'يوضّح السبب ويوقف الضرر المباشر، لكنه يبقي المعيار سرًا بين ثلاثة ويترك الانطباع قابلًا للتكرار.'},
  {t:'أتجاهل الأمر؛ الحديث الجانبي ينطفئ وحده والنتائج ستثبت صحة اختياري.', k:2,
   w:'النتائج لا تفسّر نفسها. الصمت يمنح الرواية الخاطئة وقتًا لتصير حقيقة داخل الفريق.'},
  {t:'أُعيد توزيع المهام البارزة بالتناوب على الجميع لإنهاء الشكوى.', k:1,
   w:'يضحّي بجودة التنفيذ لشراء رضا مؤقت، ويعلّم الفريق أن الشكوى أقصر طريق لتغيير القرار.'},
 ]},

{id:'ق1-15', lvl:1, t:'اقتراح ضعيف من متحمّس', c:['idea','insp'],
 s:'موظف هادئ نادرًا ما يشارك تقدّم أمام الفريق باقتراح تحسين متحمّس. الفكرة — كما طرحها — غير قابلة للتطبيق لأسباب تعرفها أنت ولا يعرفها هو، والجميع ينظر إليك الآن.',
 l:'أول مشاركة من شخص صامت لحظة هشّة: ردّك عليها لا يحكم على الفكرة وحدها بل يحدد إن كان سيتكلم مرة أخرى.',
 r:[
  {t:'أشكره على المبادرة أمام الفريق، وأسمّي الجزء السليم في تفكيره، ثم أطرح القيد الذي يجهله كسؤال أطلب منه دراسته والعودة به.', k:4,
   w:'يفصل تقدير المبادرة عن تقييم الفكرة، ويحوّل القيد إلى مهمة تطوير بدل أن يكون حكمًا بالرفض.'},
  {t:'أقول إن الفكرة جيدة وسنأخذها بعين الاعتبار، ثم لا أعود إليها.', k:1,
   w:'المجاملة الفارغة أسوأ من الرفض: تُفقده الثقة بك حين يكتشف أنها لم تُدرس، وتعلّم الفريق أن المشاركة بلا أثر.'},
  {t:'أشرح للفريق فورًا سبب عدم قابليتها للتطبيق حتى لا يبني أحد عليها.', k:2,
   w:'دقيق معلوماتيًا لكنه يطفئ أول محاولة لموظف صامت، والكلفة أكبر من الفائدة في هذه اللحظة بالذات.'},
  {t:'أطلب منه تفصيل الفكرة مكتوبة وأُرجئ النقاش لاجتماع لاحق.', k:3,
   w:'يحفظ ماء الوجه ويمنح وقتًا للتقييم، لكنه يضيّع لحظة التشجيع العلنية ويثقل مبادرة أولى بعبء إداري.'},
 ]},

/* ══════════ إضافات المستوى 2 ══════════ */
{id:'ق2-13', lvl:2, t:'معلومة من قسم آخر', c:['info','trust'],
 s:'وصلك من زميل في قسم آخر — بشكل ودّي وغير رسمي — أن إدارته تنوي إلغاء خدمة يعتمد عليها مشروعك بالكامل. لم يصدر أي إعلان رسمي، وزميلك طلب ضمنًا ألّا تذكر مصدره.',
 l:'المعلومة غير الرسمية لا تُستخدم كقرار ولا تُهمل كإشاعة: تُستخدم كسبب مشروع للسؤال الرسمي.',
 r:[
  {t:'أستخدم المعلومة كدافع لا كدليل: أطلب رسميًا من الإدارة المعنية تأكيد خارطة الخدمة للأشهر المقبلة، وأبدأ بالتوازي دراسة بديل دون كشف المصدر.', k:4,
   w:'يحوّل معلومة لا يمكن الاستناد إليها إلى تحقّق رسمي يمكن، ويشتري وقتًا للاستعداد دون خيانة الثقة ولا المقامرة عليها.'},
  {t:'أرفع الأمر لمديري موضحًا ما سمعته ومن أي جهة، ليتصرف على مستواه.', k:2,
   w:'يحمي نفسك إداريًا لكنه يحرق مصدرًا ويبني تصعيدًا على كلام غير مؤكد قد يتبين خطؤه.'},
  {t:'أتجاهل الأمر حتى يصدر إعلان رسمي؛ التصرف بناءً على حديث جانبي غير مهني.', k:2,
   w:'الانضباط في حد ذاته سليم، لكنه هنا يختار الانتظار حيث كان السؤال الرسمي متاحًا ومجانيًا.'},
  {t:'أعيد ترتيب خطة المشروع فورًا على افتراض إلغاء الخدمة.', k:1,
   w:'قرار كبير مبني على مصدر واحد غير مؤكد؛ إن كانت المعلومة خاطئة خسرت الخطة والمصداقية معًا.'},
 ]},

{id:'ق2-14', lvl:2, t:'مشروع يتيم', c:['init','impr'],
 s:'مشروع مشترك بين ثلاث إدارات يتعثّر منذ شهرين. لا أحد يملكه رسميًا، وكل إدارة تنتظر الأخرى، والجميع يتحدث عنه بقلق في الممرات دون أن يتحرك أحد. أنت لست مالكه ولا المتضرر الأكبر منه.',
 l:'المشاريع اليتيمة لا تموت من الخلاف بل من غياب المالك. المبادرة هنا ليست تجاوزًا للصلاحية إن طُلبت الولاية بدل انتزاعها.',
 r:[
  {t:'أدعو ممثلي الإدارات الثلاث لجلسة قصيرة أعرض فيها الكلفة الحالية للتعثّر، وأقترح تسمية مالك واحد وخطة بتواريخ — وأعرض توليها إن لم يتقدّم أحد.', k:4,
   w:'يشخّص المشكلة الحقيقية (الملكية لا الفنيات)، ويبادر دون انتزاع صلاحية، ويترك القرار لأصحابه مع مخرج جاهز.'},
  {t:'أرفع مذكرة لمديري أوضح فيها تعثّر المشروع وأطلب توجيهًا بشأن الملكية.', k:3,
   w:'مسار سليم ومحفوظ، لكنه يضيف حلقة انتظار جديدة لمشكلة سببها الأصلي هو الانتظار.'},
  {t:'أبدأ بتنفيذ الجزء الخاص بإدارتي فقط وأوثّق جاهزيتي، فمسؤوليتي تنتهي عند حدودي.', k:2,
   w:'يحمي موقفك ويُظهر جدية، لكنه يترك المشروع متعثرًا ويكتفي بتوزيع اللوم لاحقًا بدل حلّه.'},
  {t:'أتولى قيادة المشروع فعليًا وأبدأ بتوجيه فرق الإدارات الأخرى مباشرة.', k:1,
   w:'يملأ الفراغ بتجاوز صريح للصلاحيات؛ يولّد مقاومة من الإدارات ويجعل فشل المشروع مسؤوليتك وحدك.'},
 ]},

{id:'ق2-15', lvl:2, t:'الاجتماع الذي لا ينتهي', c:['impr','team'],
 s:'اجتماع تنسيقي أسبوعي بين إدارتك وإدارتين أخريين يستغرق ساعتين ويخرج غالبًا دون قرار. الحضور يشكون منه سرًا، لكن مديرًا أقدم منك هو من أسّسه ويحضره بانتظام ويعتبره "قناة التواصل الأهم".',
 l:'إصلاح طقس إداري يملكه شخص أقدم يحتاج بيانات لا آراء، واقتراح تحسين لا اتهام بالفشل.',
 r:[
  {t:'أجمع بيانات جلستين (مدة، قرارات صادرة، بنود مكررة)، ثم أعرضها عليه على انفراد مع اقتراح جدول أعمال محدد ومخرجات مكتوبة — مع الإبقاء على الاجتماع الذي أسّسه.', k:4,
   w:'يفصل القيمة (وجود قناة) عن الخلل (غياب الانضباط)، ويقدّم الإصلاح بلغة الأرقام وعلى انفراد، فيحفظ مكانته ويحقق الهدف.'},
  {t:'أطرح في الاجتماع نفسه أن مدته طويلة وأن مخرجاته قليلة، فالجميع يوافقني سرًا.', k:2,
   w:'صريح لكنه يضع المؤسّس في موقع دفاعي أمام الجميع، فيتحوّل النقاش من تحسين الاجتماع إلى الدفاع عنه.'},
  {t:'أبدأ بإرسال ممثل من فريقي بدلًا مني وأستثمر وقتي في عمل أنفع.', k:2,
   w:'يحل مشكلتك الشخصية ويترك المشكلة المؤسسية قائمة، ويُقرأ انسحابًا من قناة تنسيق يحتاجها فريقك.'},
  {t:'ألتزم بالحضور كما هو؛ كلفة الوقت أقل من كلفة إغضاب مدير أقدم.', k:1,
   w:'يشرعن هدر ساعتين أسبوعيًا لثلاث إدارات تجنّبًا لمحادثة واحدة، وهي مقايضة خاسرة بكل حساب.'},
 ]},

/* ══════════ إضافات المستوى 3 ══════════ */
{id:'ق3-13', lvl:3, t:'مبادرة المدير المفضلة', c:['info','impr'],
 s:'مبادرة أطلقها رئيسك التنفيذي قبل عام ويعتزّ بها علنًا. البيانات بعد عام تُظهر أنها لم تحقق سوى ١٨٪ من هدفها وتستهلك موارد فريقين. لم يسألك أحد عنها، ولديك اجتماع مراجعة أداء معه الأسبوع المقبل.',
 l:'الولاء للمؤسسة يعني إخبار القائد بما لا يحب سماعه، لكن بطريقة تحفظ له مخرجًا كريمًا. الصدق بلا مخرج يُقرأ تحديًا فيُرفض مع الحقيقة.',
 r:[
  {t:'أُعدّ عرضًا موضوعيًا: الهدف مقابل المتحقق، كلفة الفرصة البديلة، وثلاثة مسارات (إعادة توجيه، تقليص، إيقاف) مع توصيتي — وأعرضه في المراجعة بلغة التعلّم لا الإدانة.', k:4,
   w:'يقول الحقيقة كاملة ويمنح صاحب القرار خيارات ومخرجًا مهنيًا، فيرفع احتمال القرار الصحيح بدل الاكتفاء بأن تكون على حق.'},
  {t:'أعرض الأرقام كما هي دون توصية؛ دوري أن أُبلغ والقرار قراره.', k:3,
   w:'أمين ومنضبط، لكنه يترك التفسير مفتوحًا لقائد مرتبط عاطفيًا بالمبادرة، وغالبًا ما يقرأ الأرقام لصالحها.'},
  {t:'أنتظر حتى يسأل؛ فتح الملف دون طلب قد يُقرأ تصفية حسابات.', k:1,
   w:'يؤجّل النزيف لأجل راحة شخصية، وحين يُكتشف لاحقًا سيُسأل لماذا صمت من كان يعلم.'},
  {t:'أطرح الأمر عبر رئيس التدقيق الداخلي ليصل إليه من جهة محايدة.', k:2,
   w:'يوصل المعلومة لكن عبر قناة تُفسَّر التفافًا، ويكلّفك علاقة مباشرة كنت تحتاجها في القرار التالي.'},
 ]},

{id:'ق3-14', lvl:3, t:'موهبة تغادر للمنافس', c:['emo','trust'],
 s:'أفضل كوادرك التقنية أبلغك باستقالته للانتقال إلى منافس مباشر. هو يحمل معرفة عميقة بمشاريعكم، والعقد لا يمنع الانتقال. تعرف أن ما يبحث عنه ليس المال بل مسار قيادي لم تستطع منحه إياه هذا العام.',
 l:'مغادرة المتميز اختبار لسمعتك كقائد أكثر مما هو اختبار لعرضك المالي. الطريقة التي يُودَّع بها تُروى داخل السوق سنوات.',
 r:[
  {t:'أُجري معه حوار مغادرة صادقًا عن سبب القرار، وأؤمّن نقل المعرفة بخطة مكتوبة، وأودّعه بشكل محترم مع إبقاء الباب مفتوحًا — ثم أعالج فجوة المسار القيادي التي كشفها.', k:4,
   w:'يقبل ما لا يمكن تغييره، ويحمي المؤسسة معرفيًا، ويستخلص الدرس التنظيمي — والسمعة الناتجة تجلب كوادر أخرى.'},
  {t:'أقدّم له عرضًا ماليًا محسّنًا فورًا لإبقائه، فخسارته أغلى من الزيادة.', k:2,
   w:'يعالج عرضًا لا سببًا؛ العرض المضاد غالبًا ما يؤجّل المغادرة أشهرًا ويُفسد معايير الأجور مع الباقين.'},
  {t:'أقلّص صلاحياته فورًا وأُنهي وصوله للأنظمة حماية للمعلومات حتى انتهاء إشعاره.', k:2,
   w:'الحيطة المعلوماتية مشروعة، لكن تطبيقها كعقاب فوري يمنع نقل المعرفة ويبثّ رسالة تخويف لكل باقٍ.'},
  {t:'أوضّح له أن المغادرة للمنافس تُغلق باب العودة نهائيًا وأن السوق صغير.', k:1,
   w:'تهديد يكشف ضعفًا لا قوة، ويضمن أن تُروى الحكاية عنك بأسوأ صورة لدى كل مرشح مستقبلي.'},
 ]},

{id:'ق3-15', lvl:3, t:'التوسع السريع', c:['idea','info'],
 s:'مجلس الإدارة متحمس لتوسع في ثلاث أسواق جديدة خلال عام. تحليلك يشير إلى أن قدرتكم التشغيلية تكفي سوقًا واحدة بجودة، وأن التوسع الثلاثي سيضغط على الخدمة في سوقكم الأساسي الذي يمثل ٧٠٪ من الإيراد.',
 l:'رفض الطموح ليس خيارًا للقائد التنفيذي؛ الخيار هو إعادة تسلسله زمنيًا بمعايير انتقال مُعلنة.',
 r:[
  {t:'أوافق على الوجهة الثلاثية وأقترح تسلسلًا مرحليًا: سوق أولى بمعايير عبور واضحة (جودة، هامش، جاهزية تشغيلية) تفتح تلقائيًا السوق الثانية، مع خطة بناء القدرة بالتوازي.', k:4,
   w:'يحفظ طموح المجلس ويحمي القاعدة، ويستبدل الجدال حول العدد بمعايير موضوعية تحكم التوقيت.'},
  {t:'أعرض المخاطر بوضوح وأوصي بتأجيل التوسع سنة حتى تكتمل القدرة التشغيلية.', k:3,
   w:'تحليل سليم لكنه يقدّم "لا" بلا بديل، فيُقرأ تحفّظًا ويُتجاوز غالبًا بقرار أسوأ.'},
  {t:'أنفّذ توجه المجلس كاملًا وأوثّق تحفظاتي في المحضر.', k:1,
   w:'التوثيق لا يحمي السوق الأساسي؛ تنفيذ ما تعرف أنه يضر بـ٧٠٪ من الإيراد تنازل عن جوهر دور القيادة التنفيذية.'},
  {t:'أبدأ بالأسواق الثلاث بموارد مخفّضة لكل منها لاختبارها معًا.', k:2,
   w:'يوزّع القدرة الشحيحة على ثلاث جبهات فيضعفها جميعًا، ويجعل نتائج الاختبار غير قابلة للقراءة.'},
 ]},

/* ══════════ إضافات المستوى 4 ══════════ */
{id:'ق4-13', lvl:4, t:'شهادة أمام تحقيق', c:['trust','emo'],
 s:'لجنة تحقيق داخلية تسألك عن قرار اتُّخذ في اجتماع حضرته. زميل تربطك به علاقة عمل طويلة هو المسؤول عن القرار، وأنت تعرف أنه حذّر شفهيًا من المخاطر لكنه لم يوثّق التحذير، والمحضر يُظهره داعمًا للقرار.',
 l:'الشهادة تُدلى بما رأيت وسمعت، لا بما تريد أن تكون النتيجة. تلوين الشهادة لصالح صديق يهدم نزاهتك وشهادتك معًا.',
 r:[
  {t:'أدلي بما شهدته بدقة كاملة: ما ورد في المحضر وما سمعته شفهيًا من تحذير، وأوضّح أن الثاني غير موثّق وأنه انطباعي المباشر.', k:4,
   w:'يقول الحقيقة كاملة بطرفيها، ويميّز الموثّق عن الشفهي فيُبقي وزن كل معلومة في نصابه — وهذا ما يحمي الزميل والنزاهة معًا.'},
  {t:'ألتزم بالمحضر فقط؛ ما لم يُوثّق لا أستطيع تأكيده أمام لجنة رسمية.', k:2,
   w:'حذر شكليًا لكنه إغفال متعمّد لمعلومة جوهرية طُلبت منك؛ الشهادة الناقصة تضلل اللجنة كالشهادة الخاطئة.'},
  {t:'أذكر التحذير الشفهي بقوة وأقلّل من دلالة المحضر لأنني أعرف نيّته الحقيقية.', k:2,
   w:'يقلب الشهادة إلى دفاع؛ النية لا تُشهد وترجيحها على الوثيقة يُسقط مصداقية كل ما قلته.'},
  {t:'أطلب إعفائي من الشهادة لوجود علاقة شخصية قد تؤثر على حيادي.', k:1,
   w:'الانسحاب يحرم اللجنة من الشاهد الوحيد على معلومة مبرئة جزئيًا، ويترك الزميل بلا ما يعرفه سواك.'},
 ]},

{id:'ق4-14', lvl:4, t:'تعليمات تعارض القيم', c:['trust','insp'],
 s:'صدر إليك توجيه من جهة أعلى بتطبيق إجراء يوفّر وقتًا لكنه يحرم فئة من المستفيدين من حقهم في المراجعة. الإجراء قانوني شكلًا، ويخالف صراحة ميثاق القيم المعلن للمؤسسة، وفريقك ينتظر تعليماتك اليوم.',
 l:'القانوني شكلًا ليس مرادفًا للصحيح مؤسسيًا. الاعتراض المهني يُقدَّم عبر القناة وبالوقت وبالبديل، لا بالامتناع الصامت.',
 r:[
  {t:'أوقف التطبيق مؤقتًا بما تسمح به صلاحيتي، وأرفع فورًا اعتراضًا مكتوبًا يبيّن التعارض مع الميثاق وأثره على المستفيدين، مرفقًا ببديل يحقق الوفر دون إسقاط حق المراجعة.', k:4,
   w:'يستخدم القناة الرسمية بأسرع ما يمكن، ويعترض بالبديل لا بالرفض وحده، ويمنع الضرر الجاري ريثما يُحسم الأمر.'},
  {t:'أنفّذ التوجيه وأوثّق اعتراضي كتابيًا؛ القرار ليس قراري والمسؤولية على من أصدره.', k:2,
   w:'التوثيق يحمي الملف لا المستفيدين؛ تنفيذ ما تعتقد أنه يسقط حقًا معلنًا يجعلك شريكًا في أثره مهما كتبت.'},
  {t:'أُبلّغ فريقي بتحفظي وأترك لكل منهم حرية التطبيق حسب قناعته.', k:1,
   w:'يحمّل المرؤوسين كلفة قرار فوق مستواهم، وينتج تطبيقًا متفاوتًا على المستفيدين — وهو أسوأ من الخيارين معًا.'},
  {t:'أنقل الأمر مباشرة لجهة رقابية خارجية لأن التعارض مع الميثاق واضح.', k:2,
   w:'قد يكون مشروعًا كخطوة أخيرة، لكنه سابق لأوانه قبل استنفاد القناة الداخلية، ويُغلق باب المعالجة السريعة.'},
 ]},

{id:'ق4-15', lvl:4, t:'نجاح مبني على خطأ', c:['trust','impr'],
 s:'مشروع فريقك حقق نتيجة ممتازة احتُفي بها داخليًا. أثناء الإغلاق اكتشفت أن جزءًا من النتيجة جاء من خطأ في احتساب بيانات المرحلة الأولى؛ النتيجة الحقيقية جيدة لكنها أقل بكثير من المعلنة، ولا أحد لاحظ.',
 l:'الخطأ المكتشف ذاتيًا يُعالَج كأصل لا كتهديد: من يصحّح نفسه قبل أن يُكتشف يبني رصيد ثقة لا يشتريه أي إنجاز.',
 r:[
  {t:'أصحّح الرقم وأُبلغ أصحاب القرار بالنتيجة الحقيقية وسبب الفارق وإجراء منع التكرار، قبل أن يُبنى عليها أي قرار لاحق.', k:4,
   w:'يمنع بناء قرارات على رقم خاطئ، ويحوّل الخطأ إلى ضبط نظام، ويؤسس معيار نزاهة يحمي كل تقرير قادم.'},
  {t:'أصحّح الاحتساب داخليًا للمراحل القادمة دون إعادة فتح الرقم المعلن.', k:2,
   w:'يمنع تكرار الخطأ ويترك الخطأ الأصلي قائمًا في سجلّ القرارات؛ وإن اكتُشف لاحقًا صار إخفاءً لا سهوًا.'},
  {t:'أرفع الأمر لمديري وأترك له قرار الإعلان من عدمه.', k:3,
   w:'يُخرج المعلومة من عندك ويحترم التسلسل، لكنه ينقل عبء القرار الأخلاقي كاملًا لغيرك وأنت صاحب المعرفة.'},
  {t:'أترك الأمر؛ الفارق لا يغيّر جوهر النجاح وإعادة الفتح تضرّ بمعنويات الفريق.', k:1,
   w:'يقايض النزاهة بمعنويات مؤقتة؛ النجاح المبني على رقم خاطئ ينهار بأثر مضاعف حين يكتشفه طرف آخر.'},
 ]},

/* ══════════ المستوى 1 — الدفعة الثانية ══════════ */
{id:'ق1-16', lvl:1, t:'طلب العمل عن بُعد', c:['trust','impr'],
 s:'موظفة في فريقك تطلب العمل عن بُعد بشكل دائم لظرف عائلي. أداؤها ممتاز، لكن دورها يتضمن تدريب اثنين من الجدد وحضور اجتماعات تنسيق حضورية. السياسة تسمح بالمرونة دون أن تحدد سقفًا.',
 l:'المرونة لا تُمنح ولا تُرفض جملةً — تُفكَّك إلى مكوّنات الدور: ما يمكن عن بُعد وما لا يمكن. من يرفض دون تفكيك يخسر كفاءة، ومن يوافق دون تفكيك يخسر الدور نفسه.',
 r:[
  {t:'أفكّك دورها إلى مهام قابلة للتنفيذ عن بُعد ومهام تتطلب الحضور، وأتفق معها على نمط مختلط مكتوب بمراجعة بعد ثلاثة أشهر.', k:4, a:'root',
   w:'يفصل الحاجة الشخصية عن متطلبات الدور، ويحوّل الطلب المفتوح إلى ترتيب محدد قابل للقياس والتعديل.'},
  {t:'أوافق على طلبها كاملًا وأنقل مهمة تدريب الجدد إلى زميل آخر.', k:2, a:'please',
   w:'يحلّ مشكلتها بنقل عبء لم يُتفق عليه إلى غيرها؛ الإنصاف المفقود هنا سيظهر لاحقًا في شكوى من الزميل.'},
  {t:'أرفض الطلب لأن الدور يتضمن مهامًا حضورية والسياسة لا تلزمني بالموافقة.', k:2, a:'force',
   w:'صحيح إجرائيًا لكنه يقرأ الدور ككتلة واحدة؛ الرفض الكامل لطلب قابل للتجزئة يخسر كفاءة ممتازة بلا داعٍ.'},
  {t:'أوافق مؤقتًا شهرين دون ترتيب مكتوب وأرى كيف تسير الأمور.', k:2, a:'defer',
   w:'الترتيب غير المكتوب يتحوّل إلى عرف، ثم يصبح سحبه لاحقًا أصعب من رفضه ابتداءً.'},
 ]},

{id:'ق1-17', lvl:1, t:'تبادل الاتهام', c:['info','team'],
 s:'خطأ في بيانات تقرير وصل للإدارة. الموظفان المسؤولان عن المرحلتين يتبادلان الاتهام أمامك: كلٌّ يؤكد أنه سلّم سليمًا. لا يوجد سجلّ واضح لمن استلم ماذا ومتى.',
 l:'حين ينعدم السجلّ، لا يوجد اتهام قابل للإثبات — بل ثغرة نظام. من يبحث عن مذنب في موقف بلا أثر يخسر الاثنين ولا يمنع التكرار.',
 r:[
  {t:'أوقف البحث عن المذنب وأُعلن أن الخلل في غياب سجلّ التسليم، ثم أضع آلية تسليم موثّقة وأراجع معهما الخطأ نفسه لتصحيحه.', k:4, a:'root',
   w:'الخطأ الذي لا يمكن إسناده لا يُسند بالتخمين؛ معالجة الثغرة تمنع التكرار وتُنهي الخصومة دون ظالم ولا مظلوم.'},
  {t:'أراجع رسائلهما وملفاتهما بدقة لتحديد الطرف المسؤول قبل أي إجراء.', k:3, a:'probe',
   w:'التحقّق في محلّه من حيث المبدأ، لكنه هنا يستثمر جهدًا كبيرًا في سؤال لن يمنع تكرار الخطأ.'},
  {t:'أُحمّل المرحلة الثانية المسؤولية لأن المراجعة الأخيرة واجبها.', k:2, a:'force',
   w:'قاعدة معقولة ظاهريًا لكنها حكم بلا دليل في واقعة بعينها، ويُقرأ لدى الفريق تحيّزًا لا عدلًا.'},
  {t:'أطلب منهما تسوية الأمر بينهما وأكتفي بالتشديد على الدقة مستقبلًا.', k:1, a:'avoid',
   w:'يترك خصومة مفتوحة وثغرة نظام قائمة، ويعلن للفريق أن الأخطاء تُدار بالكلام العام لا بالإجراء.'},
 ]},

{id:'ق1-18', lvl:1, t:'معلومة تسرّبت', c:['trust','emo'],
 s:'علمت أن أحد أعضاء فريقك تحدّث مع زميل في قسم آخر عن نقاش داخلي جرى في اجتماع فريقكم حول تأخر أحد المشاريع. لم تكن المعلومة سرّية رسميًا، لكن نقلها بصيغتها الداخلية أحرج الفريق.',
 l:'حدود ما يُقال خارج الغرفة نادرًا ما تكون معلنة، ولهذا تُخترق بحسن نية. القائد الذي يعاقب على حدّ لم يعلنه يُعاقب على اجتهاده هو لا على خطأ غيره.',
 r:[
  {t:'أوضّح للفريق كله — دون الإشارة لأحد — ما الذي يبقى داخل الغرفة ولماذا، ثم أتحدث معه على انفراد بصيغة توضيح لا لوم.', k:4, a:'root',
   w:'يضع القاعدة المفقودة للجميع أولًا، ثم يعالج الحالة الفردية بما يناسب خطأً في حدود غير معلنة.'},
  {t:'أستدعيه وأطلب منه شرح ما قاله بالضبط ولمن، قبل أن أقرر شيئًا.', k:3, a:'probe',
   w:'التحقّق مشروع، لكن صيغة الاستدعاء للتحقيق في أمر غير سرّي رسميًا أثقل من حجم الواقعة.'},
  {t:'أنبّهه بحزم أن ما يدور في اجتماعات الفريق لا يُنقل، وأُشعر مديره المباشر إن تكرر.', k:2, a:'force',
   w:'يفرض حدًّا لم يكن معلنًا بأثر رجعي، ويبني رهبة تُقلّل الصراحة داخل الاجتماع نفسه.'},
  {t:'أتجاهل الأمر؛ المعلومة ليست سرّية والحساسية ستزول.', k:2, a:'avoid',
   w:'يترك الحدّ غائبًا فيتكرر الاختراق بصيغة أخطر، والفريق يتعلّم أن لا شيء يُصان.'},
 ]},

{id:'ق1-19', lvl:1, t:'المتدرّب المنسي', c:['team','insp'],
 s:'متدرّب انضم لفريقك قبل ثلاثة أسابيع. لاحظت أنه يجلس وحده، ولا يُدعى لاستراحات الفريق، ولا يُسند له عمل حقيقي. لم يشتكِ، والفريق لا يقصد إقصاءه بل مشغول.',
 l:'الإقصاء غير المقصود هو الأكثر شيوعًا وأصعبه علاجًا، لأن لا أحد يشعر أنه فعل شيئًا. علاجه إجرائي لا وعظي: أسند دورًا ومسؤولًا واسمًا.',
 r:[
  {t:'أُسند له مهمة حقيقية صغيرة ضمن عمل الفريق، وأعيّن له مرافقًا مسؤولًا عن إدماجه، وأطلب منه عرض نتيجته في اجتماع الفريق بعد أسبوعين.', k:4, a:'root',
   w:'يعالج السبب (غياب دور ومسؤول) لا الشعور، ويمنحه مدخلًا مشروعًا للحضور بدل الاعتماد على لطف الآخرين.'},
  {t:'أتحدث مع الفريق عن أهمية استقبال الزملاء الجدد وإشراكهم.', k:2, a:'surface',
   w:'التذكير بالقيم لا يغيّر سلوكًا سببه الانشغال؛ سيتحسّن الوضع أيامًا ثم يعود.'},
  {t:'أسأله إن كان يشعر بالراحة وأطمئنه أن بابي مفتوح.', k:2, a:'surface',
   w:'متدرّب جديد لن يشكو من الإقصاء لمديره غالبًا؛ السؤال يريح ضميرك ولا يغيّر وضعه.'},
  {t:'أتركه يشقّ طريقه؛ الاندماج مسؤوليته وهو اختبار حقيقي لمبادرته.', k:1, a:'avoid',
   w:'يحوّل تقصيرًا تنظيميًا إلى اختبار شخصي، ويخسر متدرّبًا كان يمكن أن يكون كفاءة.'},
 ]},

{id:'ق1-20', lvl:1, t:'المتميّز المنعزل', c:['team','trust'],
 s:'أفضل أعضاء فريقك إنتاجًا يرفض بانتظام مساعدة زملائه أو مراجعة عملهم، ويقول إن ذلك يعطّل إنتاجيته. أرقامه فعلًا الأعلى، وبقية الفريق بدأ يتجنّب سؤاله.',
 l:'الإنتاجية الفردية التي تُنتج على حساب قدرة الفريق ليست ربحًا بل تأجيلًا للخسارة. والعلاج ليس إلزامه بالمساعدة، بل جعل أثره على الآخرين جزءًا من تعريف نجاحه.',
 r:[
  {t:'أُدرج مساهمته في رفع قدرة الفريق ضمن أهدافه المعلنة وتقييمه، وأصمّم له شكل مساهمة يناسبه (مراجعة أسبوعية محددة الوقت) بدل الإتاحة المفتوحة.', k:4, a:'root',
   w:'يغيّر تعريف النجاح لا الشخص، ويعالج سببه الحقيقي (تشتّت الإتاحة المفتوحة) بترتيب محدد بدل المطالبة الأخلاقية.'},
  {t:'أشرح له أن قيادة المستقبل تمرّ عبر تطوير الآخرين وأطلب منه تغيير أسلوبه.', k:2, a:'surface',
   w:'الإقناع بلا تغيير في الحوافز أو الترتيب لا يصمد أمام ضغط أرقامه الشخصية.'},
  {t:'أُلزمه بجلسة مساعدة أسبوعية لزملائه ضمن مهامه.', k:3, a:'force',
   w:'يحقق الهدف إلزامًا ويُنتج مساهمة شكلية؛ ينقصه ربطها بتقييمه وتصميمها بما لا يهدر وقته.'},
  {t:'أتركه على حاله ما دامت أرقامه الأعلى، وأوجّه الزملاء لمصادر أخرى.', k:1, a:'avoid',
   w:'يشرعن استثناءً للمتميز، فيتعلّم الفريق أن الأداء الفردي يُعفي من المعايير — وهي أسرع طريق لتفكك الفريق.'},
 ]},

{id:'ق1-21', lvl:1, t:'استقالة على الطاولة', c:['emo','info'],
 s:'موظف جيد وضع أمامك خطاب استقالة دون مقدمات. يقول إنه «تعب» ولا يعطي سببًا محددًا. لا يوجد عرض عمل آخر بيده حسب علمك، ومهلة الإشعار شهر.',
 l:'الاستقالة بلا سبب محدد وبلا بديل هي في الغالب رسالة لا قرار. من يقبلها فورًا يخسر موظفًا، ومن يساوم عليها فورًا يخسر مصداقيته.',
 r:[
  {t:'أشكره على صراحته وأطلب منه يومين قبل أن أرفعها رسميًا، وأجلس معه جلسة مفتوحة لفهم ما الذي أوصله إلى هنا.', k:4, a:'probe',
   w:'يحترم قراره ولا يستعجل تسجيله، ويفتح المساحة الوحيدة التي قد تكشف سببًا قابلًا للمعالجة — أو تؤكد أن القرار نهائي.'},
  {t:'أقبلها وأبدأ فورًا إجراءات تسليم المهام والبحث عن بديل.', k:2, a:'force',
   w:'احترافي في الشكل، لكنه يغلق الباب على سبب لم يُعرف بعد قد يكون قابلًا للحل في نصف ساعة.'},
  {t:'أعرض عليه زيادة أو تغيير مهام فورًا لأثنيه عن القرار.', k:2, a:'please',
   w:'عرض مضاد قبل معرفة السبب؛ إن كان السبب غير مالي فسيُقرأ سوء فهم، وإن نجح فسيؤجّل المغادرة أشهرًا.'},
  {t:'أطلب منه التريّث شهرًا وأؤجّل الحديث حتى يهدأ.', k:2, a:'defer',
   w:'التأجيل بلا حوار يترك السبب يتفاقم، ويحوّل قرارًا قابلًا للمراجعة إلى قرار مستقر.'},
 ]},

{id:'ق1-22', lvl:1, t:'مناوبة العيد', c:['team','impr'],
 s:'يجب أن يبقى ثلاثة من فريقك المكوّن من تسعة في مناوبة أيام العيد. الجميع يريد الإجازة، واثنان بقيا العام الماضي، وواحد لديه ظرف عائلي حقيقي هذا العام.',
 l:'القرارات التي تُوزّع الألم لا تُقاس بمن رضي، بل بوضوح القاعدة التي وُزّع بها. القاعدة المعلنة تجعل من بقي يشعر بالإنصاف لا بالظلم.',
 r:[
  {t:'أعلن قاعدة مكتوبة (من لم يناوب العام الماضي أولًا، مع استثناء موثّق للظرف الطارئ)، ثم أطبّقها أمام الجميع وأربطها بتعويض واضح.', k:4, a:'root',
   w:'القاعدة المعلنة قبل التطبيق تحوّل القرار من اختيار شخصي إلى إجراء، فتُحفظ العلاقات مهما كانت النتيجة.'},
  {t:'أطلب متطوعين أولًا، وإن لم يكتمل العدد أختار بنفسي حسب الأقدمية.', k:3, a:'probe',
   w:'التطوّع مدخل سليم، لكن المعيار الاحتياطي (الأقدمية) لا علاقة له بالإنصاف في المناوبات ويولّد شعورًا بالتمييز.'},
  {t:'أُجري قرعة أمام الجميع لضمان الحياد التام.', k:2, a:'please',
   w:'حيادي شكلًا لكنه يتجاهل من ناوب العام الماضي ومن لديه ظرف حقيقي؛ المساواة هنا ليست عدلًا.'},
  {t:'أبقى أنا وأختار اثنين من الأقرب إليّ تجنبًا للجدل.', k:1, a:'avoid',
   w:'يحلّ الجدل بتحميل المقرّبين كلفته، وهو أسرع طريق لخسارة من يثق بك.'},
 ]},

{id:'ق1-23', lvl:1, t:'عمل داخل العمل', c:['trust','impr'],
 s:'لاحظت مرتين أن موظفًا في فريقك ينشغل بعمل خاص خلال الدوام. إنتاجه ضمن المطلوب ولم يتأخر في تسليم، لكن اثنين من الفريق لاحظا الأمر وعلّقا عليه.',
 l:'حين يلاحظ الفريق ما لم تتصرف فيه، تتحوّل المسألة من انضباط فرد إلى مصداقية قائد. والمعالجة تبدأ بالفهم لا بالاتهام، لأن السبب قد يكون فراغًا في التكليف لا استهتارًا.',
 r:[
  {t:'أتحدث معه على انفراد بما لاحظته دون اتهام، وأسأله عن حمله الحالي، ثم أضع اتفاقًا واضحًا على حدود وقت العمل وأزيد تكليفه إن كان الحمل ناقصًا.', k:4, a:'root',
   w:'يجمع التحقّق من السبب مع إعادة ضبط الحدّ، ويعالج احتمالًا حقيقيًا (نقص التكليف) لا يراه من يبدأ بالعقوبة.'},
  {t:'أذكّر الفريق كله في الاجتماع بسياسة استخدام وقت العمل.', k:2, a:'surface',
   w:'التعميم يُعاقب الجميع على فعل واحد، ويعرف الفريق تمامًا من المقصود — فتخسر التعميم والمواجهة معًا.'},
  {t:'أوجّه له تنبيهًا مكتوبًا يُحفظ في ملفه ردعًا له ولغيره.', k:2, a:'force',
   w:'إجراء رسمي قبل أي حوار في مخالفة لم تُحدث ضررًا؛ يبدو قويًا ويُقرأ تعسفًا.'},
  {t:'أتجاهل الأمر ما دامت مخرجاته كاملة.', k:1, a:'avoid',
   w:'تجاهُل ما رآه الفريق يُقرأ محاباة، ويُسقط حقّك في مساءلة غيره على الأمر نفسه.'},
 ]},

{id:'ق1-24', lvl:1, t:'تقييم لا يتوقّعه', c:['emo','impr'],
 s:'موظف يعتقد جازمًا أن أداءه ممتاز، وتقييمه السنوي جاء «يحتاج تطويرًا» في كفايتين. لم تُجرِ معه حوارات تصحيحية خلال العام كما ينبغي، والجلسة بعد ساعة.',
 l:'التقييم المفاجئ يقول عن القائد أكثر مما يقول عن الموظف. والاعتراف بتقصيرك في التغذية الراجعة لا يُضعف موقفك، بل هو الشيء الوحيد الذي يجعل التقييم قابلًا للقبول.',
 r:[
  {t:'أعرض التقييم بأدلة محددة، وأعترف صراحة بأن ملاحظاتي خلال العام لم تكن كافية، وأتفق معه على مراجعات شهرية وخطة تطوير بمؤشرات.', k:4, a:'root',
   w:'يحفظ دقة التقييم ولا ينكر الثغرة التي جعلته مفاجئًا، فيتحوّل الاعتراض المتوقّع إلى اتفاق على مسار.'},
  {t:'أعرض التقييم كما هو بأدلته وأوضح أن المعايير مؤسسية ومطبّقة على الجميع.', k:2, a:'force',
   w:'دقيق إجرائيًا ويتجاهل السؤال الذي سيسأله بحق: لماذا لم يُقل لي هذا قبل اليوم؟'},
  {t:'أرفع بعض الدرجات تجنّبًا لصدمته، وأعالج الفجوات بالحوار خلال العام القادم.', k:1, a:'please',
   w:'تقييم غير صادق يُفسد المعيار للجميع، ويحرمه من المعلومة الوحيدة التي قد تغيّر مساره.'},
  {t:'أؤجل الجلسة أسبوعًا لأُعدّ أمثلة أدق قبل مواجهته.', k:3, a:'defer',
   w:'التحضير الأفضل مكسب حقيقي، لكن التأجيل بلا سبب معلن يزيد قلقه ويوحي بتردّد في موقف يحتاج وضوحًا.'},
 ]},

{id:'ق1-25', lvl:1, t:'رسالة منتصف الليل', c:['emo','team'],
 s:'في الحادية عشرة ليلًا، كتب أحد أعضاء فريقك رسالة غاضبة في مجموعة الفريق ينتقد فيها قرارًا اتخذته، بصيغة حادّة. بدأ اثنان بالتفاعل، والبقية صامتون. أنت رأيت الرسالة الآن.',
 l:'الغضب العلني يطلب ردًّا علنيًا فوريًا — وهذا بالضبط ما يجب ألّا يُعطى. الردّ الليلي يضاعف الجمهور ويثبّت المواقف؛ والصمت المؤقت المتبوع بفعل واضح هو القوة لا الضعف.',
 r:[
  {t:'لا أردّ الليلة، وأكتب صباحًا رسالة قصيرة محايدة أن الموضوع سيُناقش في اجتماع الفريق، ثم أتحدث معه على انفراد قبله.', k:4, a:'defer',
   w:'ينزع الجمهور من الموقف ويمنع تصلّب المواقف ليلًا، ثم يعالج المضمون والسلوك كلًّا في موضعه الصحيح.'},
  {t:'أردّ فورًا في المجموعة بشرح مفصّل لأسباب القرار قبل أن يتفاعل المزيد.', k:2, a:'surface',
   w:'يجرّ النقاش إلى ساحة وتوقيت لا يصلحان له، ويمنح المواجهة العلنية شرعية سيتكرر طلبها.'},
  {t:'أراسله على الخاص فورًا وأطلب منه حذف الرسالة.', k:2, a:'force',
   w:'الحذف لا يمحو ما قرأه الفريق، ويحوّل خلافًا في المضمون إلى صراع على السلطة أمام شهود صامتين.'},
  {t:'أتجاهل الرسالة تمامًا وأتصرف صباحًا كأن شيئًا لم يكن.', k:1, a:'avoid',
   w:'الصمت الكامل يُقرأ عجزًا أو موافقة، ويترك القرار نفسه بلا دفاع أمام الفريق.'},
 ]},

{id:'ق1-26', lvl:1, t:'شكوى بشرط السرّية', c:['trust','emo'],
 s:'موظفة أخبرتك بسلوك متكرر من زميل يتضمن تعليقات شخصية مسيئة، وطلبت منك بإلحاح ألّا تخبر أحدًا وألّا تتخذ أي إجراء خوفًا من التبعات.',
 l:'هناك أنواع من الشكاوى لا يملك القائد سلطة كتمانها مهما وعد، لأن كتمانها يترك خطرًا قائمًا على غيرها. الصدق الواجب هنا أن تُخبرها بحدود ما تستطيع قبل أن تعدها بشيء.',
 r:[
  {t:'أشكرها على ثقتها وأوضح بصراحة أن هذا النوع من الشكاوى ملزم بالإحالة، وأشرح لها مسار الحماية من التبعات، وأرافقها في الخطوة الأولى.', k:4, a:'escal',
   w:'لا يَعِد بما لا يملك، ويحوّل خوفها من الإجراء إلى معرفة بالمسار وحماية فيه — وهذا كل ما يمكن أن يُطمئنها حقًا.'},
  {t:'ألتزم بطلبها وأراقب سلوك الزميل بنفسي، وأتدخل إن تكرر أمامي.', k:1, a:'avoid',
   w:'وعد بكتمان لا يملكه القائد، ويترك خطرًا قد يطال موظفات أخريات لا يعلم بهنّ أحد.'},
  {t:'أتحدث مع الزميل تحذيرًا عامًا دون ذكر الشكوى ولا صاحبتها.', k:2, a:'surface',
   w:'يكشف وجود شكوى دون حمايتها، ويعالج سلوكًا خطيرًا بتلميح لا يترك أثرًا ولا سجلًّا.'},
  {t:'أطلب منها تقديم الشكوى رسميًا بنفسها وأكتفي بدعمها معنويًا.', k:2, a:'deleg',
   w:'ينقل عبء الخطوة الأصعب إلى الطرف الأضعف، ويُبقي التزامك بالإحالة معلّقًا على شجاعتها.'},
 ]},

{id:'ق1-27', lvl:1, t:'إنجاز لا يظهر', c:['impr','insp'],
 s:'فريقك أنجز خلال الربع عملًا حقيقيًا: قلّل الأخطاء ووحّد إجراءات متفرقة. لكن مؤشر الأداء المعتمد يقيس عدد المعاملات المنجزة فقط، فظهر فريقك في المرتبة قبل الأخيرة، وبدأ الإحباط يظهر.',
 l:'حين يقيس المؤشر غير ما تفعله، ليس أمامك إلا أن تُغيّر المؤشر أو تُغيّر ما تفعله. تحميس الفريق دون أحدهما وعدٌ لا يصمد ربعًا آخر.',
 r:[
  {t:'أوثّق أثر ما أنجزناه بالأرقام (انخفاض الأخطاء، الوقت الموفَّر) وأتقدّم باقتراح رسمي لإضافة مؤشر جودة، وأُطلع الفريق على الخطوة وتوقيتها.', k:4, a:'root',
   w:'يعالج سبب الإحباط (مؤشر لا يرى العمل) بمسار مؤسسي، ويحوّل شعور الفريق بالظلم إلى مشروع يملكه.'},
  {t:'أوضّح للفريق أن أثرهم حقيقي وأن المؤشر قاصر، وأُشيد بهم داخليًا.', k:2, a:'surface',
   w:'التقدير الداخلي يخفّف الإحباط أسبوعًا؛ ما دام المؤشر كما هو فسيعود الشعور أقوى في الربع القادم.'},
  {t:'أعيد توجيه الفريق للتركيز على عدد المعاملات ما دام هو المقاس.', k:2, a:'force',
   w:'يحلّ مشكلة الترتيب بالتضحية بالتحسين الذي بُني؛ منطقي قصيرًا وخاسر على أي مدى أطول.'},
  {t:'أرفع شكوى للإدارة بأن المؤشر ظالم لفريقي وأطلب إعادة النظر في الترتيب.', k:2, a:'escal',
   w:'الرفع مشروع لكن بصيغة الشكوى لا الاقتراح المدعوم بأرقام؛ يُقرأ تبريرًا للنتيجة لا تحسينًا للقياس.'},
 ]},

{id:'ق1-28', lvl:1, t:'المُجادِل الدائم', c:['emo','insp'],
 s:'عضو في فريقك يعترض على كل توجيه تقريبًا قبل تنفيذه. اعتراضاته أحيانًا في محلها وقد حسّنت قرارين، لكن تكرارها يستهلك وقت الاجتماعات وبدأ الفريق يتململ.',
 l:'الاعتراض المزعج والاعتراض النافع سلوك واحد بتوقيت مختلف. حلّ التوقيت يحفظ القيمة ويُنهي الكلفة؛ وإسكات السلوك يُنهي الاثنين معًا.',
 r:[
  {t:'أتفق معه على قناة وتوقيت للاعتراض (قبل الاجتماع كتابةً أو في بند مخصص)، وأوضح له أن اعتراضاته مقدَّرة وأن الوقت المفتوح ليس مكانها.', k:4, a:'root',
   w:'يفصل قيمة الرأي عن كلفة توقيته، فيحتفظ بالأول ويُنهي الثاني دون أن يخسر صوتًا نافعًا.'},
  {t:'أطلب منه أن يرفق مع كل اعتراض بديلًا عمليًا قابلًا للتنفيذ.', k:3, a:'root',
   w:'شرط سليم يرفع جودة الاعتراض، لكنه لا يعالج مشكلة الوقت داخل الاجتماع وقد يُقرأ تعجيزًا.'},
  {t:'أنبّهه أمام الفريق بأن كثرة الاعتراض تعطّل العمل.', k:1, a:'force',
   w:'يُسكت الصوت الوحيد الذي حسّن قرارين، ويعلّم الفريق أن مخالفة المدير مكلفة علنًا.'},
  {t:'أستمع لكل اعتراضاته كما هي؛ الحوار المفتوح أهم من الوقت.', k:2, a:'avoid',
   w:'يُحمّل الفريق كلفة عدم ضبط الإيقاع، وهي مسؤولية القائد لا الحوار.'},
 ]},

{id:'ق1-29', lvl:1, t:'فرصة انتداب', c:['trust','emo'],
 s:'عُرض على أحد أفضل أعضاء فريقك انتداب لستة أشهر في إدارة أخرى. الفرصة جيدة له مهنيًا، ومغادرته ستضغط على الفريق في ربع حرج. جاءك يسألك: ماذا تنصحني؟',
 l:'حين يكون القرار قراره وأنت مستفيد من أحد الخيارين، فدورك ليس أن تنصح بل أن تُكمل معلوماته وتُفصح عن مصلحتك. النصيحة هنا سلطة مقنّعة.',
 r:[
  {t:'أعطيه صورة كاملة وصادقة: قيمة الفرصة له، وأثر غيابه على الفريق، وأفصح بوضوح أن لي مصلحة في بقائه — ثم أترك القرار له وألتزم بدعمه أيًّا كان.', k:4, a:'deleg',
   w:'يُكمل معلومته ويكشف تحيّزه بدل إخفائه خلف «نصيحة»، وهذا أعلى ما يمكن أن يُقدَّم في قرار يخصّ غيرك.'},
  {t:'أنصحه بالذهاب لأن تطوّره أهم، وأتولّى أنا معالجة أثر غيابه.', k:3, a:'root',
   w:'سخيّ ومبدؤه سليم، لكنه يقرّر عنه بلغة النصيحة ويحجب عنه معلومة حقيقية عن حجم الأثر.'},
  {t:'أوضح له أن الربع حرج وأطلب منه تأجيل الانتداب دورة واحدة.', k:2, a:'please',
   w:'يقدّم مصلحة الفريق على فرصته باستخدام سلطة العلاقة، والفرص المؤجلة نادرًا ما تعود.'},
  {t:'أتركه يقرّر دون إبداء أي رأي حتى لا أؤثر عليه.', k:2, a:'avoid',
   w:'الحياد الكامل يحرمه من معلومة يملكها هو وحده — أثر غيابه — فيقرّر ناقص المعرفة لا حرًّا.'},
 ]},

{id:'ق1-30', lvl:1, t:'الشائعة', c:['emo','team'],
 s:'انتشر بين أفراد الفريق حديث بأن أحد الزملاء حصل على زيادة استثنائية بواسطة. الخبر غير صحيح — الزيادة كانت ضمن تسوية وظيفية عامة لا علاقة لك بها. الزميل المعني يبدو محرجًا ولم يتحدث.',
 l:'الشائعة لا تموت بالنفي العام بل بالمعلومة التي تملأ فراغها. والمعلومة التي لا يجوز كشفها تُستبدل بشرح الآلية لا بشرح الحالة.',
 r:[
  {t:'أشرح للفريق آلية التسويات الوظيفية ومعاييرها العامة دون الحديث عن أي حالة فردية، وأطمئن الزميل على انفراد بأن الأمر يُعالَج.', k:4, a:'root',
   w:'يملأ فراغ المعلومة بما يجوز كشفه (الآلية) بدل ما لا يجوز (الحالة)، فيُنهي الشائعة ويحفظ خصوصية الزميل.'},
  {t:'أنفي الشائعة أمام الفريق وأطلب وقف هذا النوع من الأحاديث.', k:2, a:'force',
   w:'النفي بلا تفسير يترك السؤال قائمًا، والمنع يدفع الحديث إلى خارج الغرفة حيث لا تصله.'},
  {t:'أبحث عن مصدر الشائعة أولًا وأتعامل معه مباشرة.', k:2, a:'probe',
   w:'مطاردة المصدر تستهلك الجهد في أقل أجزاء المشكلة أهمية، وتُنتج جوًّا من التحقيق داخل الفريق.'},
  {t:'أترك الأمر؛ الشائعات تنطفئ وحدها والتدخل يضخّمها.', k:2, a:'avoid',
   w:'قد تنطفئ، لكنها تترك أثرًا في ثقة الفريق بعدالة الأجور — وهذا الأثر لا ينطفئ.'},
 ]},

/* ══════════ المستوى 2 — الدفعة الثانية ══════════ */
{id:'ق2-16', lvl:2, t:'بيانات محجوبة', c:['info','team'],
 s:'تحتاج بيانات من قسم آخر لإكمال تحليل مطلوب منك. القسم يماطل ويقول إن البيانات «حساسة» دون أن يحدد مانعًا نظاميًا. تعلم أنهم شاركوها مع جهة ثالثة قبل شهرين.',
 l:'الحجب الذي لا يستند إلى نص هو في الغالب خوف من استخدام البيانات لا من كشفها. من يهاجم الحجب يواجه الخوف، ومن يعالج الخوف يحصل على البيانات.',
 r:[
  {t:'ألتقي بهم لأفهم قلقهم من الاستخدام، وأقترح نطاقًا أضيق أو بيانات مجهّلة تكفي تحليلي، مع تعهد مكتوب بحدود الاستخدام.', k:4, a:'root',
   w:'يعالج السبب الحقيقي (القلق من الاستخدام) لا الطلب، ويقدّم تنازلًا لا يكلّف التحليل شيئًا فيرفع احتمال الموافقة كثيرًا.'},
  {t:'أرسل طلبًا رسميًا موثّقًا يحدد السند النظامي لطلبي ومهلة للرد.', k:3, a:'paper',
   w:'يثبّت الحق ويبني سجلًّا، لكنه يبدأ بالمسار الرسمي قبل استنفاد المسار الأسهل فيصلّب الموقف.'},
  {t:'أُشير إلى أنهم شاركوها مع جهة ثالثة وأطالب بالمعاملة نفسها.', k:2, a:'force',
   w:'يكسب النقطة ويخسر العلاقة؛ إحراج الطرف بسابقة يجعله يبحث عن مبرر للرفض لا عن حلّ.'},
  {t:'أُكمل التحليل ببيانات تقديرية وأُشير في التقرير إلى تعذّر الحصول عليها.', k:2, a:'surface',
   w:'يُسلّم منتجًا ناقصًا ويحوّل مشكلة تعاون إلى ملاحظة في تقرير لن يقرأها أحد بالجدية نفسها.'},
 ]},

{id:'ق2-17', lvl:2, t:'اتفاق بلا ورق', c:['info','trust'],
 s:'اتفقت شفهيًا مع مدير قسم آخر على أن فريقه يتولى مرحلة من المشروع. اليوم ينكر الاتفاق ويقول إنه كان «نقاشًا مبدئيًا». الموعد بعد أسبوعين ولا أحد بدأ تلك المرحلة.',
 l:'الجدال حول ما قيل لا يُنتج شيئًا لأن لا أحد يملك دليلًا. والوقت المتبقي أثمن من إثبات من كان صادقًا؛ المحترف يحمي الموعد أولًا ثم يغلق الثغرة التي أنتجت الخلاف.',
 r:[
  {t:'أترك النقاش حول ما قيل، وأعرض عليه خيارين عمليين لإنجاز المرحلة خلال أسبوعين، ثم أعتمد من اليوم تثبيت أي اتفاق بمحضر مكتوب.', k:4, a:'root',
   w:'يفصل الموعد عن الخلاف فينقذ المشروع، ويغلق الثغرة التي سمحت بالخلاف أصلًا بدل الاكتفاء بكسب الجولة.'},
  {t:'أرسل له رسالة توثّق ما أذكره من الاتفاق وأطلب تأكيده أو تصحيحه كتابةً.', k:3, a:'paper',
   w:'خطوة سليمة تبني سجلًّا، لكنها وحدها لا تُنجز المرحلة ولا تضمن ردًّا خلال أسبوعين.'},
  {t:'أُصعّد الأمر لمدير مشترك ليحسم من يتحمل المرحلة.', k:2, a:'escal',
   w:'تصعيد خلاف بلا دليل يضع الاثنين في موقف ضعيف، وغالبًا سيُقسَّم العمل بقرار لا يرضي أحدًا.'},
  {t:'أتولى المرحلة بفريقي وأوثّق أنها خارج نطاقي لاستخدامها لاحقًا.', k:2, a:'paper',
   w:'ينقذ الموعد ويبني ملفًّا للمعركة القادمة؛ يعالج المرة الواحدة ويضمن تكرارها.'},
 ]},

{id:'ق2-18', lvl:2, t:'نجاح بلا شركاء', c:['team','trust'],
 s:'مشروع مشترك بين ثلاث إدارات حقق نتيجة بارزة. في العرض أمام الإدارة العليا، قدّمه مدير إحدى الإدارات بصيغة «إنجاز إدارتنا» دون ذكر الشريكين. فريقك يعلم ويتذمّر.',
 l:'الإنصاف في نسبة الإنجاز مسألة نظام لا أخلاق فقط. من يعالجها كخصومة شخصية يخسر مرتين، ومن يعالجها كثغرة في آلية العرض يكسب المرات القادمة كلها.',
 r:[
  {t:'أتحدث معه على انفراد بصيغة الأثر لا الاتهام، وأقترح أن يكون عرض المشاريع المشتركة باسم الفريق المشترك وبمن قدّم ماذا — وأعرض ذلك على الإدارة كقاعدة.', k:4, a:'root',
   w:'يحفظ العلاقة ويعالج السبب البنيوي (لا آلية لعرض المشترك)، فيحمي كل مشروع مشترك قادم لا هذا وحده.'},
  {t:'أرسل للإدارة العليا ملخصًا موثّقًا يبيّن مساهمة كل إدارة في المشروع.', k:3, a:'paper',
   w:'يصحّح السجلّ بأسلوب مهني، لكنه يُقرأ ردًّا متأخرًا على عرضٍ مضى ولا يمنع التكرار.'},
  {t:'أشرح لفريقي أن الإدارة تعرف مساهمتنا وأطلب منهم تجاوز الأمر.', k:2, a:'surface',
   w:'يطلب من الفريق تحمّل ما لم تعالجه؛ الطمأنة بلا إجراء تُضعف ثقتهم بك لا بالمدير الآخر.'},
  {t:'أذكر في أول اجتماع مشترك أمام الجميع أن العرض أغفل شريكين.', k:2, a:'force',
   w:'التصحيح العلني يضع المدير في موقف دفاعي ويحوّل مسألة إجراء إلى خصومة معلنة بين إدارتين.'},
 ]},

{id:'ق2-19', lvl:2, t:'سياسة تضرّ فريقك', c:['info','impr'],
 s:'أصدرت الموارد البشرية سياسة جديدة لاحتساب ساعات العمل تناسب معظم الإدارات، لكنها تضرّ فريقك تحديدًا لأن طبيعة عمله ميدانية بنوبات متغيرة. بدأ اثنان بالتفكير في الانتقال.',
 l:'الاعتراض على سياسة عامة لا يُقبل بصيغة «هذا لا يناسبنا»، بل بصيغة «هذه حالة لم تُدرس، وهذه بياناتها، وهذا استثناء محدد». الفرق بينهما هو الفرق بين التذمّر والحوكمة.',
 r:[
  {t:'أجمع بيانات أثر السياسة على فريقي (ساعات فعلية، أثر على الأجر، نية المغادرة)، وأتقدّم بطلب استثناء محدد ومبرّر عبر القناة الرسمية مع بديل عملي.', k:4, a:'escal',
   w:'ينقل القضية من انطباع إلى ملف قابل للقرار، ويقترح بديلًا فيجعل قبول الاستثناء أسهل من رفضه.'},
  {t:'أطبّق السياسة وأعوّض فريقي بمرونة غير رسمية في أمور أخرى.', k:2, a:'please',
   w:'يشتري الرضا بترتيبات غير موثّقة تسقط فور تغيّرك أو تغيّر الظرف، ويترك الظلم الأصلي قائمًا.'},
  {t:'أشرح للفريق أن السياسة مؤسسية ولا يملك أحد تغييرها، وأطلب الالتزام.', k:2, a:'force',
   w:'غير صحيح ابتداءً — السياسات تُراجَع — ويُفقدك ثقة فريق يرى أنك لم تحاول.'},
  {t:'أنتظر ثلاثة أشهر حتى تتضح آثار السياسة قبل أي تحرك.', k:2, a:'defer',
   w:'قد يكون الاثنان قد غادرا؛ الانتظار هنا يجمع بيانات على حساب من تحاول حمايتهم.'},
 ]},

{id:'ق2-20', lvl:2, t:'تجاوز القناة', c:['trust','team'],
 s:'مدير إدارة أخرى بدأ يتواصل مباشرة مع أعضاء فريقك ويكلّفهم بمهام صغيرة. الفريق ينفّذ إحراجًا منه، وبدأت المهام تتراكم على حساب أولوياتك، وهو يراها «تعاونًا سريعًا».',
 l:'الحدود التي لا يعرفها الفريق يخترقها غيرك بسهولة. وضع الحدّ ليس مواجهة مع المدير الآخر بل توضيح مسار لفريقك أولًا.',
 r:[
  {t:'أُوضّح لفريقي مسارًا بسيطًا لأي تكليف خارجي (يُحوَّل إليّ للموازنة مع الأولويات)، وأخبر المدير بذلك بصيغة تسهيل لا اعتراض.', k:4, a:'root',
   w:'يضع الحدّ حيث ينفع (عند الفريق) ويقدّمه للمدير الآخر كآلية لا كرفض، فيُغلق الباب دون خصومة.'},
  {t:'أتحدث معه مباشرة وأطلب منه التوقف عن التواصل مع فريقي دون علمي.', k:3, a:'force',
   w:'واضح ومباشر، لكنه يترك فريقك بلا قاعدة فيتكرر الأمر مع غيره، ويبدأ بالمواجهة قبل الترتيب.'},
  {t:'أترك الأمر ما دامت المهام صغيرة، فالتعاون بين الإدارات مطلوب.', k:2, a:'avoid',
   w:'المهام الصغيرة تتراكم، والفريق يتعلّم أن الأولويات قابلة للاختراق بمكالمة.'},
  {t:'أرفع الأمر لمدير مشترك بصفته تجاوزًا للتسلسل الإداري.', k:2, a:'escal',
   w:'تصعيد سلوك قابل للمعالجة بمحادثة واحدة؛ يكسبك القرار ويكلّفك علاقة ستحتاجها.'},
 ]},

{id:'ق2-21', lvl:2, t:'قرار في غيابك', c:['info','init'],
 s:'اتُّخذ في اجتماع لم تُدعَ إليه قرارٌ يغيّر نطاق مشروع تقوده. علمت بالأمر من زميل بعد يومين. المنظّم يقول إن الاجتماع كان «تنسيقيًا سريعًا» ولم ينتبه لضرورة حضورك.',
 l:'الغياب عن قرار يخصّك مرة واحدة حادث، وتكراره نمط. والعلاج ليس في الاعتراض على الاجتماع الماضي بل في تثبيت موقعك في القرارات القادمة.',
 r:[
  {t:'أطلب محضر الاجتماع وأثر القرار على خطتي مكتوبًا، وأتفق مع المنظّم على قاعدة: أي قرار يمسّ نطاق المشروع يمرّ بقائده قبل اعتماده.', k:4, a:'root',
   w:'يستوعب ما حدث بلا معركة ويثبّت القاعدة للمستقبل، وهو الهدف الحقيقي بدل استرجاع قرار مضى.'},
  {t:'أعترض رسميًا على القرار لأنه اتُّخذ دون صاحب الاختصاص وأطلب إعادة النظر.', k:3, a:'escal',
   w:'حقّك الإجرائي قائم، لكن البدء بالاعتراض الشكلي قبل فهم مضمون القرار قد يُبطل قرارًا كان في صالحك.'},
  {t:'أنفّذ القرار كما صدر وأوثّق أنني لم أُشارك في اتخاذه.', k:2, a:'paper',
   w:'يحمي ملفّك ولا يحمي المشروع، ويضمن أن يتكرر الغياب لأنه لم يُكلّف أحدًا شيئًا.'},
  {t:'أتجاهل الأمر وأكتفي بمتابعة أدق للاجتماعات مستقبلًا.', k:2, a:'avoid',
   w:'يحوّل ثغرة في الآلية إلى عبء يقظة شخصي عليك، وهو حلّ لا يصمد مع تعدد المشاريع.'},
 ]},

{id:'ق2-22', lvl:2, t:'مورد واحد وإدارتان', c:['init','team'],
 s:'خبير تحليل البيانات الوحيد في المؤسسة مطلوب في الوقت نفسه لمشروعك ولمشروع إدارة أخرى. الإدارتان في المستوى نفسه، ولا توجد آلية لترتيب الأولوية، والخبير نفسه محرج.',
 l:'تنازع الموارد بلا آلية ينتهي دائمًا لصالح الأعلى صوتًا. اقتراح المعيار — لا المطالبة بالحصة — هو ما يحوّل النزاع إلى قرار.',
 r:[
  {t:'أقترح على الإدارة الأخرى معيارًا مشتركًا للترتيب (أثر التأخير، الموعد النظامي، قابلية التجزئة)، وأعرض تقسيم وقته وفقه، ونرفع المعيار للاعتماد.', k:4, a:'root',
   w:'ينقل النزاع من «من يستحق» إلى «بأي معيار»، ويُنتج قاعدة تحسم هذا النزاع وما بعده.'},
  {t:'أرفع الأمر للإدارة العليا لتحديد الأولوية بين المشروعين.', k:3, a:'escal',
   w:'مسار سليم حين يتعذّر الاتفاق، لكنه سابق لأوانه قبل محاولة واحدة مع الطرف النظير.'},
  {t:'أتفق مع الخبير مباشرة على إعطاء مشروعي الأسبقية بحكم علاقتنا الجيدة.', k:1, a:'over',
   w:'يحسم نزاعًا بين إدارتين عبر الضغط على موظف لا يملك القرار، ويضعه في موقف لا يُحسد عليه.'},
  {t:'أتنازل عن الخبير هذا الربع حفاظًا على العلاقة وأبحث عن بديل خارجي.', k:2, a:'please',
   w:'يشتري السلام بكلفة على مشروعك، ويؤسّس لعرف أن من يتنازل أولًا يتنازل دائمًا.'},
 ]},

{id:'ق2-23', lvl:2, t:'خدمة خارج الإجراء', c:['trust','info'],
 s:'مدير إدارة أخرى يطلب منك — بلطف وباعتباره عاجلًا — إصدار موافقة قبل اكتمال مستند مطلوب نظامًا، ويقول إن المستند سيصل خلال يومين وإن «الجميع يفعلها».',
 l:'الطلب اللطيف العاجل هو أخطر أشكال تجاوز الإجراء، لأنه يجعل الرفض يبدو تعنّتًا. والمخرج ليس الرفض ولا القبول، بل نقل الطلب إلى الشكل الذي تُقاس به المسؤولية.',
 r:[
  {t:'أطلب منه إرسال الطلب كتابةً عبر القناة الرسمية مع تعهد بالمستند وتاريخه، وأصدر موافقة مشروطة موثّقة إن كان الإجراء يسمح بذلك.', k:4, a:'paper',
   w:'التوثيق هنا ليس حماية للذات بل هو الإجراء نفسه: يحوّل تجاوزًا شفهيًا إلى التزام قابل للمتابعة والمساءلة.'},
  {t:'أرفض الطلب وأوضح أن الإجراء لا يسمح بالموافقة قبل اكتمال المستند.', k:3, a:'force',
   w:'سليم مبدئيًا، لكنه يغلق الباب دون البحث عن صيغة مشروعة تخدم العجلة الحقيقية إن وُجدت.'},
  {t:'أُصدر الموافقة بحكم العلاقة والثقة، وأتابع وصول المستند بنفسي.', k:1, a:'please',
   w:'الثقة الشخصية ليست بديلًا عن المستند؛ إن لم يصل بقيت الموافقة باسمك وحدك في السجل.'},
  {t:'أحيل الطلب لمديري ليقرر هو الاستثناء من عدمه.', k:2, a:'deleg',
   w:'إحالة قرار داخل صلاحيتك تُقرأ تهرّبًا، وتُثقل مستوى أعلى بتفصيل كان بإمكانك ضبطه بطلب كتابي.'},
 ]},

{id:'ق2-24', lvl:2, t:'خطأ في تقرير غيرك', c:['info','impr'],
 s:'تقرير صادر عن قسم آخر ووصل للإدارة العليا يتضمن رقمًا يُظهر أداء فريقك أقل مما هو عليه فعلًا. الرقم يبدو ناتجًا عن اختلاف في طريقة الاحتساب لا عن سوء نية.',
 l:'الاندفاع لتصحيح رقم يخصّك قبل التأكد من طريقة احتسابه هو أسرع طريق لأن تكون أنت المخطئ. التحقّق أولًا ليس تردّدًا بل شرط المصداقية.',
 r:[
  {t:'أراجع طريقة احتسابهم مقابل طريقتنا أولًا، فإن ثبت الفارق منهجيًا تواصلت معهم بالأرقام لتوحيد التعريف وإصدار توضيح مشترك.', k:4, a:'probe',
   w:'يحمي مصداقيتك من تصحيح متسرّع، ويحوّل الخلاف إلى توحيد تعريف يمنع تكراره كل ربع.'},
  {t:'أرسل فورًا توضيحًا للإدارة العليا بالرقم الصحيح ومصدره.', k:2, a:'force',
   w:'يضع الإدارة أمام رقمين متناقضين دون تفسير، ويجعل القضية خلافًا بين قسمين لا معلومة أدق.'},
  {t:'أتحدث مع مدير القسم وأطلب سحب التقرير وإعادة إصداره.', k:2, a:'force',
   w:'مطلب كبير قبل التأكد من وجود خطأ أصلًا؛ إن كان احتسابهم سليمًا خسرت الموقف والعلاقة.'},
  {t:'أترك الأمر؛ الإدارة تعرف أداء فريقي ولا داعي لإثارة خلاف.', k:1, a:'avoid',
   w:'الرقم المنشور يصبح مرجعًا مع الوقت، والصمت عنه يُقرأ لاحقًا إقرارًا به.'},
 ]},

{id:'ق2-25', lvl:2, t:'زميل صار رئيسًا', c:['emo','team'],
 s:'زميلك الذي كنت تعمل معه في المستوى نفسه لسنوات رُقّي ليصبح رئيسك المباشر. كنت أنت أيضًا مرشحًا للموقع. أول اجتماع بينكما بصفته الجديدة غدًا.',
 l:'العلاقة تغيّرت سواء اعترفت أم لا، وأول من يجب أن يعترف هو من لم يُرقَّ. المرارة المكتومة تُقرأ في كل اجتماع، والصراحة المهنية تُنهيها في خمس دقائق.',
 r:[
  {t:'أبدأ الاجتماع بتهنئة صادقة وإعلان واضح بدعمي، وأطلب أن نتفق على شكل العلاقة الجديدة وتوقّعاته مني.', k:4, a:'root',
   w:'يعالج التغيّر صراحةً في أول لحظة بدل تركه يتسرّب في التفاصيل، ويضع العلاقة على أساس مهني معلن.'},
  {t:'أتعامل معه بمهنية تامة دون التطرق للموضوع إطلاقًا.', k:3, a:'avoid',
   w:'مقبول ويصمد فترة، لكنه يترك الفيل في الغرفة فيظهر عند أول خلاف مهني بصيغة شخصية.'},
  {t:'أطلب من الإدارة معرفة أسباب عدم اختياري قبل أن أستقر على موقفي منه.', k:3, a:'probe',
   w:'حقّك في معرفة الفجوة مشروع ومفيد لتطورك، لكن جعله شرطًا لموقفك منه يخلط التطوير بالعلاقة.'},
  {t:'أوضح له أنني كنت مرشحًا وأنني أستحق الموقع أكثر لكنني سألتزم.', k:1, a:'force',
   w:'يفتح العلاقة الجديدة بحكم على أهليته، ويجعل كل خلاف لاحق يُقرأ امتدادًا لهذا التصريح.'},
 ]},

{id:'ق2-26', lvl:2, t:'الجودة أم الموعد', c:['impr','info'],
 s:'إدارة العمليات تضغط لإطلاق الخدمة في موعدها المعلن. فريق الجودة لديك رصد ثلاث ملاحظات: واحدة تمسّ بيانات المستفيدين واثنتان تجميليتان. الإطلاق بعد ثلاثة أيام.',
 l:'الملاحظات ليست سلّة واحدة. من يؤجّل الإطلاق للثلاث يخسر مصداقيته أمام العمليات، ومن يُطلق بالثلاث يخاطر بما لا يُعوَّض. الفرز هو القرار.',
 r:[
  {t:'أفصل الملاحظة التي تمسّ بيانات المستفيدين عن الاثنتين، وأشترط إغلاقها قبل الإطلاق، وأُطلق في الموعد مع خطة معلنة لمعالجة الباقي.', k:4, a:'root',
   w:'يرتّب المخاطر بحسب أثرها لا بحسب عددها، فيحمي ما لا يُعوَّض ويحفظ الموعد والمصداقية معًا.'},
  {t:'أؤجّل الإطلاق حتى إغلاق الملاحظات الثلاث كاملة.', k:2, a:'force',
   w:'يعامل ملاحظة تجميلية كخطر جوهري، ويهدر مصداقية ستحتاجها في المرة التي يجب أن تؤجّل فيها فعلًا.'},
  {t:'أُطلق في الموعد وأُدرج الملاحظات الثلاث في خطة ما بعد الإطلاق.', k:1, a:'please',
   w:'ملاحظة تمسّ بيانات المستفيدين لا تُدرج في خطة لاحقة؛ هذا النوع من المخاطر لا يقبل التأجيل.'},
  {t:'أرفع الملاحظات للإدارة العليا وأطلب قرارًا بالإطلاق من عدمه.', k:3, a:'escal',
   w:'مشروع في قرار له أثر واسع، لكنه يرفع القرار كاملًا دون فرز ولا توصية — وهذا نصف عمل.'},
 ]},

{id:'ق2-27', lvl:2, t:'طريق جانبي', c:['trust','init'],
 s:'جهة خارجية تتعامل معها المؤسسة بدأت تتواصل معك مباشرة على هاتفك الشخصي لتسريع طلباتها، متجاوزة قسم العلاقات الذي يملك الملف رسميًا. الطلبات معقولة والتجاوب سريع.',
 l:'القناة التي تُتجاوَز بحسن نية تفقد قدرتها على الحماية عند أول مشكلة. وإعادة الطلبات إلى مسارها ليست بيروقراطية بل هي ما يجعل الالتزامات قابلة للتتبع.',
 r:[
  {t:'أُبلغ الجهة بلطف أن الطلبات تمرّ عبر قسم العلاقات، وأُخطر القسم بما ورد إليّ، وأقترح عليهم آلية أسرع إن كان البطء هو السبب.', k:4, a:'root',
   w:'يعيد المسار ويعالج سببه في الوقت نفسه؛ إعادة القناة دون معالجة بطئها تضمن تجاوزها من جديد.'},
  {t:'أستمر في التجاوب ما دامت الطلبات معقولة وأُطلع قسم العلاقات لاحقًا.', k:2, a:'please',
   w:'يشتري رضا الجهة بكلفة على الملكية والتتبّع، ويترك القسم مسؤولًا عن التزامات لم يشارك فيها.'},
  {t:'أتوقف عن الردّ عليهم وأحيلهم للقسم دون تفسير.', k:2, a:'avoid',
   w:'يعيد المسار بطريقة تُقرأ جفاءً من جهة خارجية، وكان يمكن تحقيق الهدف نفسه بجملة واحدة.'},
  {t:'أُبلّغ الإدارة بتجاوز الجهة للقنوات الرسمية.', k:2, a:'escal',
   w:'تصعيد أمر قابل للمعالجة بمكالمتين، ويضع الجهة الخارجية في موقف محرج بلا حاجة.'},
 ]},

{id:'ق2-28', lvl:2, t:'أولويات تغيّرت', c:['init','info'],
 s:'اكتشفت أن أولويات الربع تغيّرت قبل أسبوعين وأن مشروعك لم يعد ضمن الثلاثة الأولى. لم يُبلغك أحد، وفريقك ما زال يعمل بوتيرة عالية على افتراض الأولوية القديمة.',
 l:'العمل بأولوية قديمة أخطر من العمل بلا أولوية، لأنه يستهلك موارد بثقة. والسؤال الأول ليس «لماذا لم يبلغوني» بل «ما الذي أوقفه اليوم».',
 r:[
  {t:'أتأكد من الأولويات الجديدة رسميًا، ثم أوقف فورًا ما لم يعد مجديًا وأعيد توجيه الفريق، وأتفق على آلية إبلاغ بأي تغيير قادم.', k:4, a:'root',
   w:'يوقف النزيف أولًا ثم يغلق ثغرة الإبلاغ؛ الترتيب هنا هو الفرق بين قائد ومتظلّم.'},
  {t:'أطلب اجتماعًا للاعتراض على عدم إبلاغي بتغيير يمسّ مشروعي.', k:2, a:'escal',
   w:'يبدأ بالشكوى بينما الفريق ما زال ينفق جهدًا ضائعًا؛ صحيح في المبدأ وخاطئ في الترتيب.'},
  {t:'أواصل العمل كما هو حتى يصلني إشعار رسمي بالتغيير.', k:1, a:'defer',
   w:'التمسّك بالشكليات مع علمك بالتغيير يهدر موارد المؤسسة، وسيُسأل عنه من علم لا من لم يُبلّغ.'},
  {t:'أخفض وتيرة المشروع بهدوء دون إخبار الفريق حتى تتضح الصورة.', k:2, a:'avoid',
   w:'يترك الفريق يعمل بجهد كامل على ما تعرف أنه أقل أهمية، وحين يكتشف سيقرأ الأمر خداعًا لا حماية.'},
 ]},

{id:'ق2-29', lvl:2, t:'قيادة بلا سلطة', c:['insp','team'],
 s:'تقود مشروعًا يشارك فيه خمسة أعضاء من ثلاث إدارات، لا أحد منهم يتبعك إداريًا. اثنان يتأخران باستمرار لأن مديريهم يكلّفانهم بأعمال أخرى، ولا تملك أي أداة إلزام.',
 l:'القيادة بلا سلطة لا تُمارَس على الأفراد بل على الاتفاق الذي يحكمهم. من يطارد الأفراد يستنزف نفسه، ومن يثبّت الالتزام عند مديريهم يحصل على الوقت.',
 r:[
  {t:'أعقد اتفاقًا مكتوبًا مع مديريهم يحدد نسبة وقت كل عضو للمشروع ومخرجاته، وأرسل لهم تقرير تقدّم دوري يُظهر أثر التأخير.', k:4, a:'root',
   w:'ينقل الالتزام إلى من يملكه فعلًا، ويجعل أثر التأخير مرئيًا لمن يستطيع تغييره بدل مطاردة المنفّذين.'},
  {t:'أبني علاقة شخصية قوية مع الأعضاء وأحفّزهم على إعطاء المشروع أولوية.', k:3, a:'surface',
   w:'التأثير الشخصي مهم وقد ينفع مؤقتًا، لكنه يضع العضو بين مديره وبينك — وهو صراع سيخسره المشروع.'},
  {t:'أرفع الأمر لراعي المشروع بأن الأعضاء غير ملتزمين.', k:2, a:'escal',
   w:'صياغة الشكوى ضد الأفراد قبل تثبيت اتفاق واضح تحمّلهم مسؤولية قرار ليس لهم.'},
  {t:'أعيد توزيع المهام لأُبقي الأجزاء الحرجة على الأعضاء الملتزمين.', k:2, a:'surface',
   w:'يُنقذ التسليم ويُثقل الملتزمين، فيدفعهم للتأخر بدورهم ويُخفي المشكلة عن الإدارة.'},
 ]},

{id:'ق2-30', lvl:2, t:'تقليص العدد', c:['emo','impr'],
 s:'طُلب منك تقليص عدد فريقك بواحد خلال شهر ضمن إعادة توزيع مؤسسية. فريقك ستة، وأضعفهم أداءً هو الأقدم والأكثر ارتباطًا بالفريق، وأحدثهم أداؤه ممتاز لكنه في فترة تجربة.',
 l:'قرار التقليص يُقاس بمعياره لا بنتيجته. المعيار الذي لا يُعلن ولا يُوثَّق يتحوّل إلى قصة داخل الفريق تبقى سنوات.',
 r:[
  {t:'أضع معيارًا موثّقًا (متطلبات المرحلة القادمة، الأداء، قابلية التطوير)، وأُطبّقه، وأطلب للمتأثر أفضل ترتيب انتقالي ممكن، وأشرح للفريق المعيار لا الحالة.', k:4, a:'root',
   w:'يجعل القرار قابلًا للدفاع عنه أمام الفريق وأمام نفسك، ويفصل الحسم عن قسوة التنفيذ.'},
  {t:'أعرض على الإدارة بدائل أولًا: خفض تكاليف أخرى، أو نقل داخلي بدل الاستغناء.', k:4, a:'escal',
   w:'استنفاد البدائل قبل قرار لا رجعة فيه واجب مهني، ويُظهر أنك تحمي فريقك قبل أن تنفّذ القرار.'},
  {t:'أستغني عن الأحدث لأنه في فترة تجربة والإجراء أسهل وأقل إيلامًا للفريق.', k:1, a:'avoid',
   w:'يختار الأسهل إجرائيًا لا الأصحّ مؤسسيًا، ويُضحّي بالأداء الأفضل — ويفهم الفريق الرسالة تمامًا.'},
  {t:'أطلب من الفريق التطوّع بمن يرغب في الانتقال لإدارة أخرى.', k:2, a:'deleg',
   w:'يبدو منصفًا لكنه يحوّل قرارًا إداريًا إلى ضغط جماعي، وغالبًا سيتطوّع أفضلهم لأن لديه بدائل.'},
 ]},

/* ══════════ المستوى 3 — الدفعة الثانية ══════════ */
{id:'ق3-16', lvl:3, t:'عرض استحواذ', c:['idea','info'],
 s:'وصلكم عرض لشراء منافس أصغر بسعر مغرٍ. منتجه يكمّل منتجكم، لكن ثقافته الإدارية مختلفة جذريًا وفريقه القيادي مرتبط بمؤسّسه الذي سيغادر بعد الصفقة. المهلة ستة أسابيع.',
 l:'معظم عمليات الاستحواذ لا تفشل في السعر بل في الدمج. والسؤال الذي يُغفل عادةً ليس «كم يساوي؟» بل «من سيبقى بعد سنة؟».',
 r:[
  {t:'أُجري فحصًا نافذًا يشمل الثقافة والاحتفاظ بالكفاءات لا المالية وحدها، وأشترط في الصفقة ترتيبات احتفاظ للقيادات وخطة دمج بمراحل ومحطات قرار.', k:4, a:'probe',
   w:'يفحص المتغيّر الذي يقرّر مصير الصفقة فعلًا (البشر والثقافة)، ويحوّل المخاطرة إلى بنود تعاقدية قابلة للإدارة.'},
  {t:'أمضي في الصفقة لأن التكامل في المنتج والسعر المغري فرصة لا تتكرر.', k:1, a:'blind',
   w:'يقرّر على المتغيّر الأسهل قياسًا ويتجاهل الأصعب؛ وهذا بالضبط نمط الفشل الأكثر شيوعًا في الاستحواذات.'},
  {t:'أعتذر عن العرض لأن اختلاف الثقافة يجعل الدمج عالي المخاطرة.', k:2, a:'avoid',
   w:'يرفض فرصة حقيقية بناءً على مخاطرة قابلة للتخفيف بالتعاقد، ويُفوّت التكامل بلا محاولة.'},
  {t:'أقترح شراكة تشغيلية أو حصة أقلية أولًا بدل الاستحواذ الكامل.', k:3, a:'root',
   w:'تدرّج ذكي يقلّل المخاطرة، لكنه قد لا يكون متاحًا في عرض بمهلة محددة وقد يخسر الصفقة لمنافس.'},
 ]},

{id:'ق3-17', lvl:3, t:'مؤشر يكذب', c:['info','impr'],
 s:'مؤشر رضا المتعاملين لديكم ارتفع أربعة أرباع متتالية. في الوقت نفسه ارتفعت شكاوى وسائل التواصل وانخفض التجديد ٩٪. فريق التجربة يؤكد أن المنهجية سليمة ولم تتغيّر.',
 l:'حين يتعارض المؤشر مع الواقع، الخطأ في المؤشر حتى يثبت العكس — لا العكس. والمؤسسات تتعطّل حين تدافع عن أرقامها بدل أن تدافع عن فهمها.',
 r:[
  {t:'أُكلّف مراجعة مستقلة لمنهجية القياس (من يُسأل، ومتى، ومن يُستبعد)، وأضع إلى جانبها مؤشرًا سلوكيًا لا رأيًا مثل التجديد وتكرار الشكوى.', k:4, a:'probe',
   w:'يشك في أداة القياس لا في الواقع، ويضيف مؤشرًا لا يمكن تجميله — وهذا ما يكشف التناقض فعلًا.'},
  {t:'أعتمد على المؤشر الرسمي وأتعامل مع الشكاوى كحالات فردية صاخبة.', k:1, a:'blind',
   w:'يفسّر إشارة حقيقية (انخفاض التجديد ٩٪) على أنها ضجيج، وهذا قرار يُدفع ثمنه بعد ربعين.'},
  {t:'أُطلق حملة لتحسين التواصل مع المتعاملين على وسائل التواصل.', k:2, a:'surface',
   w:'يعالج ظهور المشكلة لا المشكلة، ويترك المؤشر المعطوب يقود قرارات أخرى في المؤسسة.'},
  {t:'أوقف الاعتماد على المؤشر فورًا وأبني نظام قياس جديدًا من الصفر.', k:2, a:'force',
   w:'ردّ فعل أوسع من اللازم قبل معرفة موضع الخلل، ويُفقدك سلسلة زمنية قد تكون جزءًا منها سليمًا.'},
 ]},

{id:'ق3-18', lvl:3, t:'خلاف أمام المجلس', c:['emo','insp'],
 s:'في اجتماع المجلس، خالفك مدير تنفيذي زميل علنًا في توصية قدّمتها، بأسلوب حادّ وبمعلومة جزئية صحيحة. أعضاء المجلس ينتظرون ردّك الآن.',
 l:'المجلس لا يقيس من كان محقًا في اللحظة بل من يستطيع إدارة الخلاف دون أن يتحوّل إلى صراع. والاعتراف بالجزء الصحيح من الخصم هو أقوى ما يمكن أن تفعله في تلك الثانية.',
 r:[
  {t:'أقرّ بالجزء الصحيح في ملاحظته أمام المجلس، وأوضح البيانات التي تكمل الصورة، وأقترح أن نعرض تقييمًا مشتركًا في الجلسة القادمة.', k:4, a:'root',
   w:'ينزع حدّة المواجهة بالاعتراف، ويحمي التوصية بالبيانات، ويحوّل الخصومة إلى عمل مشترك أمام المجلس.'},
  {t:'أردّ بالتفصيل على كل نقطة أثارها لأثبت أن توصيتي هي الأصح.', k:2, a:'force',
   w:'يحوّل جلسة قرار إلى مبارزة؛ حتى لو كسبتها فإن المجلس يسجّل أن الفريق التنفيذي منقسم.'},
  {t:'أسحب التوصية وأطلب مهلة لمراجعتها في ضوء ملاحظته.', k:2, a:'avoid',
   w:'سحب توصية أمام المجلس بسبب ملاحظة جزئية يُقرأ ضعفًا في الإعداد، ويُغري بتكرار الأسلوب.'},
  {t:'أُنهي النقاش بهدوء وأعالج الأمر معه على انفراد بعد الجلسة.', k:3, a:'defer',
   w:'إدارة العلاقة لاحقًا صحيحة، لكن ترك المعلومة الجزئية دون استكمال أمام المجلس يترك انطباعًا لا يُصحَّح خارج الغرفة.'},
 ]},

{id:'ق3-19', lvl:3, t:'فرع لا يربح', c:['impr','emo'],
 s:'فرع يخسر منذ ثلاث سنوات، وأرقامه لا تُبشّر. فيه أربعون موظفًا، وهو الوحيد في منطقته، وله قيمة رمزية لدى المجتمع المحلي وقد افتُتح في حضور رسمي.',
 l:'القرار المؤلم الذي يُؤجَّل يصبح أغلى فقط. وما يُميّز القائد ليس الجرأة على الإغلاق بل جودة ما يُقدَّم لمن يتأثر به.',
 r:[
  {t:'أختبر خيارًا واحدًا محددًا لتحويل نموذج التشغيل (تصغير، شراكة، تحويل لخدمة رقمية مدعومة) بمهلة ومعايير عبور معلنة، فإن لم تتحقق أغلقت بخطة انتقال كاملة للموظفين.', k:4, a:'root',
   w:'يمنح فرصة أخيرة محكومة بمعيار وزمن بدل تأجيل مفتوح، ويجهّز قرار الإغلاق وكلفته الإنسانية مسبقًا.'},
  {t:'أُغلق الفرع فورًا وأعلن أن القرار مالي بحت وأن المؤسسة تحترم أثره.', k:2, a:'force',
   w:'حاسم لكنه يتجاهل بدائل لم تُختبر وأثرًا مجتمعيًا يمكن إدارته، ويُقرأ تخلّيًا لا انضباطًا.'},
  {t:'أُبقيه مفتوحًا لقيمته الرمزية وأُغطّي خسارته من أرباح الفروع الأخرى.', k:2, a:'please',
   w:'قرار مشروع لو أُعلن كقرار أثر مجتمعي بميزانية محددة؛ أما تغطيته صامتًا فهو نزيف بلا مساءلة.'},
  {t:'أؤجل القرار سنة إضافية حتى تتضح أوضاع السوق في المنطقة.', k:1, a:'defer',
   w:'ثلاث سنوات خسارة كافية للحكم؛ السنة الرابعة تضيف كلفة ولا تضيف معلومة.'},
 ]},

{id:'ق3-20', lvl:3, t:'ثلاثة أسابيع سيولة', c:['init','info'],
 s:'أبلغك المدير المالي صباحًا أن السيولة تكفي ثلاثة أسابيع فقط بسبب تأخر تحصيل دفعتين كبيرتين. الرواتب بعد أسبوعين. المجلس يجتمع بعد عشرة أيام.',
 l:'أزمة السيولة لا تحتمل الترتيب المعتاد للقرارات. هنا تحديدًا يكون الحسم الفوري هو الصواب، والانتظار حتى الاجتماع القادم هو الخطأ.',
 r:[
  {t:'أُفعّل خطة طوارئ فورًا اليوم: تجميد الالتزامات غير الحرجة، تسريع التحصيل بتواصل تنفيذي مباشر، وترتيب تسهيل ائتماني احتياطي — وأُبلغ رئيس المجلس فورًا لا بعد عشرة أيام.', k:4, a:'force',
   w:'الحسم الفوري هنا ليس تسرّعًا بل هو الإجراء الصحيح؛ وإبلاغ رئيس المجلس فورًا واجب حوكمة لا خيارًا.'},
  {t:'أطلب من المالية سيناريوهات مفصّلة وأعرض الأمر كاملًا في اجتماع المجلس بعد عشرة أيام.', k:1, a:'defer',
   w:'ينفق ثلث المدة المتبقية في الإعداد؛ في أزمة السيولة الأيام هي المورد، والتحليل المتأخر بلا قيمة.'},
  {t:'أوجّه بتسريع التحصيل فقط وأنتظر أثره قبل أي إجراء آخر.', k:2, a:'surface',
   w:'يراهن على متغيّر واحد خارج سيطرتك؛ وإن تأخر التحصيل أسبوعًا فقدت كل خيارات التصرف.'},
  {t:'أؤجّل مدفوعات الموردين شهرًا دون إشعارهم لحماية الرواتب.', k:1, a:'blind',
   w:'يحلّ أسبوعين ويشعل أزمة ثقة مع الموردين وربما مطالبات تعاقدية؛ التأجيل يُتفاوض عليه ولا يُفرض صمتًا.'},
 ]},

{id:'ق3-21', lvl:3, t:'أربعون بالمئة', c:['info','impr'],
 s:'متعامل واحد يمثل ٤٠٪ من إيرادكم يطلب تخفيضًا ١٥٪ وشروط دفع أطول، ويُلمّح إلى عروض منافسة. هامشكم معه ضعيف أصلًا، وفقدانه يهدّد ثلث الوظائف.',
 l:'الاعتماد على متعامل واحد ليس مشكلة تفاوض بل مشكلة بنية. وأي تنازل اليوم دون خطة لتنويع الإيراد يشتري سنةً بثمن السنة التي تليها.',
 r:[
  {t:'أتفاوض على حزمة تربط أي تخفيض بالتزام حجم ومدة أطول، وأُطلق بالتوازي خطة معتمدة لخفض اعتمادنا عليه إلى حدّ آمن خلال ثمانية عشر شهرًا.', k:4, a:'root',
   w:'يعالج التفاوض والبنية معًا؛ التفاوض وحده يؤجّل الخطر، وخطة التنويع وحدها لا تنقذ هذا العام.'},
  {t:'أقبل الشروط كاملة حفاظًا على العلاقة والوظائف، وأعوّض بخفض التكاليف الداخلية.', k:2, a:'please',
   w:'يحمي هذا العام ويعمّق الاعتماد؛ ومن قبِل التخفيض تحت التلميح سيُطلب منه المزيد في الدورة القادمة.'},
  {t:'أرفض التخفيض وأوضح أن هامشنا لا يحتمله، مستندًا إلى جودة خدمتنا.', k:2, a:'force',
   w:'موقف مبدئي سليم لكنه يخاطر بثلث الوظائف دون بديل جاهز ودون اختبار مرونة الطرف الآخر.'},
  {t:'أطلب مهلة وأبدأ فورًا البحث عن متعاملين بدلاء قبل الردّ عليه.', k:3, a:'probe',
   w:'تحسين موقفك التفاوضي صحيح، لكن بناء بدائل يستغرق أشهرًا ولن يجهز قبل انتهاء مهلة قصيرة.'},
 ]},

{id:'ق3-22', lvl:3, t:'توصية لا تقتنع بها', c:['info','idea'],
 s:'استشاري خارجي ذو سمعة قوية قدّم توصية بإعادة هيكلة قطاع كامل. منهجيته سليمة ظاهريًا، لكن خبرتك في السوق تقول إن فرضية أساسية في التحليل لا تنطبق على بيئتكم.',
 l:'الحدس التنفيذي معلومة حقيقية لكنه ليس دليلًا. من يرفض التوصية بحدسه يبدو مقاومًا للتغيير، ومن ينفّذها ضد حدسه يتخلّى عن أثمن ما يملك. المخرج اختبار الفرضية لا الحكم عليها.',
 r:[
  {t:'أُحدّد الفرضية المشكوك فيها بدقة وأطلب اختبارها ببيانات واقعية قبل الاعتماد، وأُشرك الاستشاري في تصميم الاختبار لا في الدفاع عن نتيجته.', k:4, a:'probe',
   w:'يحوّل الخلاف من رأي مقابل رأي إلى سؤال قابل للحسم بالبيانات، ويحفظ قيمة الاستشارة والحدس معًا.'},
  {t:'أعتمد التوصية لأن المنهجية سليمة والاستشاري أوسع خبرة في هذا النوع من الملفات.', k:2, a:'blind',
   w:'يسلّم القرار لسمعة لا لدليل؛ والفرضية الخاطئة تُفسد أسلم منهجية مهما كانت دقيقة.'},
  {t:'أرفض التوصية وأوضح للمجلس أنها لا تناسب خصوصية سوقنا.', k:2, a:'force',
   w:'رفض بلا اختبار يضعك في موقف «القائد الذي يرفض ما لا يعجبه»، وهو موقف لا يُدافع عنه أمام مجلس.'},
  {t:'أنفّذ التوصية جزئيًا في قطاع صغير أولًا وأراقب النتائج.', k:3, a:'root',
   w:'تدرّج سليم يقلّل المخاطرة، لكنه قد يختبر التنفيذ لا الفرضية، فيعطي نتيجة لا تجيب عن سؤالك.'},
 ]},

{id:'ق3-23', lvl:3, t:'الأتمتة والخوف', c:['insp','emo'],
 s:'تبنّي نظام أتمتة سيرفع الكفاءة ٣٠٪ ويُلغي الحاجة إلى نحو عشرين وظيفة روتينية خلال عامين. انتشر الخبر قبل أن تُعلن أي خطة، والقلق بدأ يؤثر على الإنتاجية.',
 l:'حين يسبق الخبر الخطة، يملأ الناس الفراغ بأسوأ الاحتمالات. والصدق المتأخر لا يُصدَّق؛ الوعد الوحيد الذي يصمد هو وعد بمسار لا وعد بنتيجة.',
 r:[
  {t:'أُعلن خلال أيام خطة واضحة: ما سيتغيّر، وبرنامج إعادة تأهيل ممول بمسارات محددة، وتعهد بأن يُعرض على كل متأثر مسار بديل قبل أي إنهاء.', k:4, a:'root',
   w:'يستبدل فراغ المعلومة بمسار ملموس، ويلتزم بما يستطيع الوفاء به (فرصة بديلة) لا بما لا يستطيع (ضمان الوظيفة).'},
  {t:'أطمئن الموظفين بأن لا أحد سيفقد وظيفته بسبب الأتمتة.', k:1, a:'please',
   w:'وعد يعرف الجميع أنه لن يصمد عامين؛ وحين يسقط، تسقط معه ثقتهم بكل ما تقوله بعده.'},
  {t:'أؤجّل الحديث حتى اكتمال دراسة الأثر الوظيفي بعد أربعة أشهر.', k:2, a:'defer',
   w:'أربعة أشهر من الغموض تكلّف إنتاجية ومغادرة كفاءات أكثر مما تكلّف خطة أولية غير مكتملة.'},
  {t:'أُبطئ مشروع الأتمتة حتى يهدأ القلق الداخلي.', k:2, a:'avoid',
   w:'يؤجّل مكسبًا تشغيليًا حقيقيًا لمعالجة مشكلة تواصل، ويطيل فترة القلق بدل إنهائها.'},
 ]},

{id:'ق3-24', lvl:3, t:'تقرير الاستدامة', c:['trust','info'],
 s:'تقرير الاستدامة السنوي جاهز. أحد المؤشرات البيئية تراجع بوضوح هذا العام لسبب تشغيلي مفهوم وقابل للمعالجة. فريق الاتصال يقترح إبرازه أقل وتقديم الإنجازات الأخرى.',
 l:'تقارير الاستدامة تُقرأ من جهات تعرف كيف تبحث عمّا لم يُقل. والمؤشر المتراجع المشروح بخطة أقوى أمام القارئ المحترف من مؤشر مختفٍ.',
 r:[
  {t:'أعرض المؤشر المتراجع بوضوح مع سببه وخطة المعالجة وتاريخها، في الموضع نفسه الذي تُعرض فيه الإنجازات.', k:4, a:'root',
   w:'الشفافية المصحوبة بخطة هي أعلى ما يبني الثقة، وإخفاء مؤشر متاح لجهات أخرى مخاطرة غير محسوبة.'},
  {t:'أعرضه ضمن الملاحق التفصيلية دون إبرازه في الملخص التنفيذي.', k:2, a:'surface',
   w:'تقنيًا لم تُخفِ شيئًا، لكن ترتيب العرض هنا قصدُه التضليل — وهذا ما سيُكتب عنه إن اكتُشف.'},
  {t:'أؤجّل نشر التقرير حتى تُعالَج المشكلة ويتحسّن المؤشر.', k:2, a:'defer',
   w:'تأخير تقرير دوري لأسباب تجميلية يثير أسئلة أكثر مما يمنع، وقد يخالف التزامات إفصاح.'},
  {t:'أعتمد اقتراح فريق الاتصال؛ التقرير أداة تواصل والإنجازات هي الرسالة.', k:1, a:'please',
   w:'يخلط التقرير بالتسويق؛ ومن يفعل ذلك مرة يفقد قدرة تقاريره على الإقناع حتى حين تكون صادقة.'},
 ]},

{id:'ق3-25', lvl:3, t:'فريق يتفق دائمًا', c:['idea','emo'],
 s:'فريقك التنفيذي متجانس ومنسجم، والاجتماعات تنتهي بالإجماع غالبًا. لاحظت أن آخر ثلاثة قرارات كبيرة مرّت دون اعتراض جوهري واحد، واثنان منها تبيّن لاحقًا ضعفهما.',
 l:'الإجماع المتكرر ليس علامة انسجام بل غياب آلية للاعتراض. ولا يُعالَج بطلب «الصراحة» — يُعالَج بجعل المعارضة دورًا مكلّفًا به لا شجاعة فردية.',
 r:[
  {t:'أُنشئ دورًا دوريًا للمُعارض المكلّف في كل قرار كبير، وأطلب في كل توصية عرض أقوى حجّة ضدها وسيناريو فشلها قبل التصويت.', k:4, a:'root',
   w:'يحوّل الاعتراض من مخاطرة شخصية إلى واجب منظّم، وهذا الفرق هو ما يجعل المعارضة تظهر فعلًا.'},
  {t:'أطلب من الفريق صراحةً أن يعترضوا أكثر وأؤكد أنني أرحّب بالخلاف.', k:2, a:'surface',
   w:'الدعوة للصراحة من صاحب السلطة نادرًا ما تُصدَّق أو تُستخدم؛ الحافز الحقيقي ما زال في صفّ الصمت.'},
  {t:'أُدخل عضوًا خارجيًا أو مستشارًا مستقلًا في مناقشة القرارات الكبيرة.', k:3, a:'root',
   w:'يجلب زاوية مختلفة فعلًا، لكنه يعالج القرار الواحد ولا يغيّر ثقافة الفريق الدائمة.'},
  {t:'أبدأ بإبداء رأيي أخيرًا في الاجتماعات لأترك مساحة للآخرين.', k:3, a:'root',
   w:'تعديل سلوكي صحيح ومؤثر، لكنه وحده لا يكفي حين يكون غياب الخلاف نمطًا مستقرًا.'},
 ]},

{id:'ق3-26', lvl:3, t:'نجاح أكبر من القدرة', c:['impr','init'],
 s:'حملة إطلاق حققت طلبًا يفوق توقعاتكم بثلاثة أضعاف. سلسلة التوريد ومراكز الخدمة لا تحتمل هذا الحجم، وبدأت مدد التسليم تتضاعف والشكاوى ترتفع بسرعة.',
 l:'النجاح الذي يتجاوز القدرة يتحوّل إلى أزمة سمعة خلال أسابيع. والقرار الصحيح هنا مؤلم: كبح الطلب عمدًا لحماية من اشترى بالفعل.',
 r:[
  {t:'أُبطئ اكتساب الطلب الجديد عمدًا (إيقاف الحملة، قائمة انتظار معلنة) لحماية تجربة من طلبوا بالفعل، وأُعلن مدد تسليم صادقة، وأوسّع القدرة بخطة معلنة.', k:4, a:'root',
   w:'يختار حماية من لديك على حساب من قد يأتي — وهو القرار الذي يحمي السمعة ويمنع الانهيار في الخدمة.'},
  {t:'أواصل الحملة وأضاعف الجهد التشغيلي بساعات إضافية وتوظيف مؤقت.', k:2, a:'force',
   w:'يراهن على أن الجهد يعوّض فجوة بنيوية ثلاثة أضعاف؛ النتيجة إنهاك الفريق واستمرار التأخير.'},
  {t:'أُبقي الحملة وأُدير التوقعات بإعلان تأخير عام واعتذار للمتعاملين.', k:3, a:'surface',
   w:'الصدق في التوقعات مكسب، لكنه بلا كبح الطلب يعني تأخيرًا يتسع كل أسبوع ويستهلك الاعتذار نفسه.'},
  {t:'أرفع الأسعار مؤقتًا لتقليل الطلب إلى مستوى القدرة.', k:2, a:'blind',
   w:'يخفّض الطلب فعلًا ويُقرأ استغلالًا لنجاح لحظي، وكلفته على الثقة أعلى من كلفة قائمة انتظار معلنة.'},
 ]},

{id:'ق3-27', lvl:3, t:'وتيرة لا تناسب', c:['insp','impr'],
 s:'المجلس يريد تنفيذ خطة التحول خلال ثمانية عشر شهرًا. تقديرك أن المؤسسة تحتمل ثلاثين شهرًا دون كسر الخدمة، وأن الضغط سيُفقدك قيادات صف ثانٍ. المجلس يرى تقديرك متحفظًا.',
 l:'الخلاف على الوتيرة لا يُحسم بالتقديرات المتقابلة بل بمعيار واقعي يتفق عليه الطرفان مسبقًا. من يجادل بالشهور يخسر، ومن يقترح مؤشر جاهزية يكسب الطرفين.',
 r:[
  {t:'أقبل هدف الثمانية عشر شهرًا كطموح، وأقترح مسارًا بمحطات جاهزية معلنة (استقرار الخدمة، جاهزية الكوادر) تُسرّع أو تُبطئ الوتيرة تلقائيًا بقرار موثّق.', k:4, a:'root',
   w:'يستبدل جدال التقديرات بآلية تقرّر بالواقع، فيحفظ طموح المجلس ويمنع كسر الخدمة دون أن يبدو تحفّظًا.'},
  {t:'أُنفّذ وفق تقدير المجلس وأوثّق تحذيري من أثر الوتيرة.', k:1, a:'paper',
   w:'التوثيق لا يمنع كسر الخدمة ولا يعيد القيادات التي ستغادر؛ وهو تنازل عن جوهر الدور التنفيذي.'},
  {t:'أتمسّك بتقديري وأطلب من المجلس اعتماد الثلاثين شهرًا استنادًا لخبرتي التشغيلية.', k:2, a:'force',
   w:'يضع خبرتك مقابل طموحهم بلا معيار ثالث؛ وأغلب هذه المواجهات تنتهي بقرار المجلس وبخسارتك رصيدًا.'},
  {t:'أبدأ بالوتيرة السريعة وأطلب مراجعة بعد ستة أشهر في ضوء النتائج.', k:3, a:'probe',
   w:'يشتري بيانات حقيقية، لكن ستة أشهر بوتيرة عالية قد تُحدث ضررًا في الخدمة والكوادر يصعب تداركه.'},
 ]},

{id:'ق3-28', lvl:3, t:'اجتماعات بلا قرار', c:['impr','init'],
 s:'مسح داخلي أظهر أن القيادات تقضي ٤٠٪ من وقتها في اجتماعات، وأن ثلثها ينتهي دون قرار. الجميع يشتكي، وكل محاولة سابقة لتقليصها انتهت بعودة الوضع خلال شهرين.',
 l:'الاجتماعات لا تتكاثر بسبب سوء التنظيم بل لأنها الطريقة الوحيدة الآمنة لاتخاذ قرار مشترك. من لا يعالج الخوف من القرار الفردي سيرى الاجتماعات تعود مهما قلّصها.',
 r:[
  {t:'أعالج السبب: أوضّح من يملك قرار ماذا بصلاحيات مكتوبة، وأُلزم كل اجتماع بمالك ومخرج مكتوب، وأمنح صاحب القرار غطاءً معلنًا حين يقرر منفردًا.', k:4, a:'root',
   w:'يفكّ الارتباط بين الاجتماع والأمان؛ من يملك صلاحية معلنة وغطاءً لا يحتاج جمع الجميع ليقرر.'},
  {t:'أفرض قواعد صارمة: لا اجتماع بلا جدول، ومدة قصوى، ويوم أسبوعي بلا اجتماعات.', k:3, a:'force',
   w:'قواعد نافعة وستُحدث تحسّنًا فوريًا، لكنها عولجت سابقًا وعادت — لأن السبب لم يكن التنظيم.'},
