  {t:'أطلب من كل قيادي مراجعة اجتماعاته وإلغاء ما لا يحتاجه.', k:2, a:'deleg',
   w:'يوزّع مسؤولية معالجة مشكلة نظامية على أفراد، وكل واحد سيبقي اجتماعاته ويلغي اجتماعات غيره.'},
  {t:'أُطلق نظامًا رقميًا لإدارة الاجتماعات ومحاضرها ومتابعة قراراتها.', k:2, a:'surface',
   w:'أداة جيدة فوق مشكلة سلوكية؛ ستُنتج محاضر أفضل للاجتماعات نفسها دون أن تقلّلها.'},
 ]},

{id:'ق3-29', lvl:3, t:'سؤال عن الأجور', c:['trust','insp'],
 s:'في لقاء مفتوح مع الموظفين، سأل أحدهم علنًا: «لماذا الفجوة بين أعلى راتب وأدناه في المؤسسة بهذا الحجم؟». القاعة صامتة تنتظر، والرقم المتداول قريب من الصحيح.',
 l:'السؤال الصعب في لقاء مفتوح هو اختبار علني لصدقك. الإجابة المراوغة تُفهم فورًا، والإجابة الصادقة — حتى لو لم تُرضِ — تشتري رصيدًا يبقى سنوات.',
 r:[
  {t:'أجيب بصراحة عن منهجية الأجور وما تستند إليه، وأقرّ بأن الفجوة موضوع مشروع للنقاش، وأعلن مراجعة لسياسة الأجور بنطاق وموعد محددين أفي بهما.', k:4, a:'root',
   w:'يحترم السؤال ولا يَعِد بنتيجة لا يملكها، ويلتزم بمسار قابل للمحاسبة — وهذا أقصى ما يُطلب في تلك اللحظة.'},
  {t:'أوضح أن الأجور تتبع دراسات السوق وأن المؤسسة ملتزمة بالإنصاف.', k:2, a:'surface',
   w:'إجابة صحيحة شكلًا وفارغة مضمونًا؛ القاعة تعرف أنها لم تُجب، والكلفة أعلى من الصمت.'},
  {t:'أعتذر عن مناقشة تفاصيل الأجور في لقاء عام وأعرض مناقشتها فرديًا.', k:2, a:'avoid',
   w:'السؤال عن المنهجية لا عن راتب أحد؛ رفض المنهجية في لقاء مفتوح يُقرأ تهرّبًا.'},
  {t:'أطلب من الموارد البشرية إعداد ردّ مكتوب يُعمَّم على الجميع لاحقًا.', k:3, a:'deleg',
   w:'الردّ المكتوب مفيد كمتابعة، لكن تأجيل الإجابة كاملةً في لحظة يتطلب فيها الحضور موقفًا يُضعف أثر اللقاء.'},
 ]},

{id:'ق3-30', lvl:3, t:'ثلاث مغادرات', c:['emo','info'],
 s:'خلال ربع واحد، غادر ثلاثة من قيادات الصف الثاني إلى جهات مختلفة. المقابلات الختامية كانت مهذّبة وعامة. المجلس سألك عن السبب، وفريقك يراقب ردّ فعلك.',
 l:'ثلاث مغادرات في ربع ليست صدفة، ومقابلات المغادرة المهذّبة لا تقول شيئًا. من يفسّر النمط بأسباب فردية يضمن الرابعة والخامسة.',
 r:[
  {t:'أُكلّف جهة محايدة بمقابلات مغادرة معمّقة وبقياس نبض للباقين في المستوى نفسه، وأعرض على المجلس النمط وأسبابه وخطة احتفاظ محددة.', k:4, a:'probe',
   w:'يعامل الثلاث كنمط يحتاج تشخيصًا لا كحالات، ويبحث عند الباقين — وهم المصدر الوحيد للمعلومة القابلة للاستخدام.'},
  {t:'أُجري بنفسي جلسات مع الصف الثاني المتبقي لأسمع منهم مباشرة.', k:3, a:'probe',
   w:'مبادرة صحيحة ومقدَّرة، لكن حضورك بنفسك قد يمنع أصدق الإجابات إن كان جزء من السبب متصلًا بالقيادة.'},
  {t:'أُسرّع تعيين بدلاء أكفاء وأطمئن المجلس أن الأدوار ستُغطّى.', k:2, a:'surface',
   w:'يعالج الفراغ ولا يعالج السبب؛ البدلاء سيغادرون للسبب نفسه بعد أربعة أرباع.'},
  {t:'أوضح للمجلس أن المغادرات أسباب شخصية مختلفة وأن السوق تنافسي.', k:1, a:'avoid',
   w:'تفسير مريح بلا دليل؛ وإن تبيّن نمط مؤسسي لاحقًا فقدت مصداقيتك أمام المجلس في أخطر ملف تملكه.'},
 ]},

/* ══════════ المستوى 4 — الدفعة الثانية ══════════ */
{id:'ق4-16', lvl:4, t:'ثمن الإبلاغ', c:['trust','emo'],
 s:'موظف أبلغ قبل شهرين عن مخالفة في إدارته، وثبتت صحة بلاغه. منذ ذلك الحين استُبعد من اجتماعين مهمين ونُقل ملف رئيسي منه إلى زميل. مديره يقول إن ذلك «إعادة توزيع اعتيادية».',
 l:'الانتقام من المبلّغ نادرًا ما يكون صريحًا؛ يأتي بصيغة قرارات إدارية عادية كلٌّ منها مبرَّر وحده. ومن لا يحمي أول مبلّغ يضمن ألّا يكون هناك ثانٍ.',
 r:[
  {t:'أوثّق التسلسل الزمني للقرارات مقارنةً بتاريخ البلاغ، وأُحيله لجهة الحماية المختصة بصفته احتمال انتقام، وأطلب مراجعة القرارات إداريًا.', k:4, a:'escal',
   w:'التسلسل الزمني هو الدليل الوحيد المتاح في هذا النوع من الوقائع، والإحالة هنا واجب لا خيار لأن الحماية خارج صلاحيتك.'},
  {t:'أتحدث مع مديره وأطلب منه إعادة الموظف إلى الملف تجنّبًا لشبهة الانتقام.', k:3, a:'root',
   w:'قد يُعالج الحالة سريعًا، لكنه يعتمد على استجابة من قد يكون هو الطرف، ولا يبني حماية للمبلّغين بعده.'},
  {t:'أدعم الموظف معنويًا وأتابع وضعه دون تدخل رسمي حتى تتضح النية.', k:2, a:'avoid',
   w:'انتظار ثبوت النية في وقائع لا تُصرَّح فيها النية أبدًا؛ وكل شهر تأخير يجعل التراجع أصعب.'},
  {t:'أنصحه بالتقدّم بتظلّم رسمي بنفسه وأعرض شهادتي إن طُلبت.', k:2, a:'deleg',
   w:'ينقل عبء المواجهة إلى الطرف الأضعف مرة ثانية، بينما المعلومة والصلاحية عندك لا عنده.'},
 ]},

{id:'ق4-17', lvl:4, t:'خطؤك ودفعه غيرك', c:['trust','emo'],
 s:'تأخير في مشروع سببه قرار اتخذته أنت. في مراجعة الأداء، أُشير إلى أن سبب التأخير ضعف تنفيذ الفريق، وسُجّلت ملاحظة على مديره الذي لم يكن طرفًا في القرار. لم يعترض أحد.',
 l:'اللحظة التي تُنسب فيها كلفة قرارك إلى غيرك هي أوضح اختبار للنزاهة في حياة القائد، لأن الصمت فيها مجاني تمامًا — ولا يعلم به أحد سواك.',
 r:[
  {t:'أصحّح النسبة في المحضر صراحةً وأعلن أن القرار قراري وأطلب رفع الملاحظة عن المدير، مع عرض ما تعلمته لمنع التكرار.', k:4, a:'root',
   w:'يعيد الحق لصاحبه ويحمي سجلًّا وظيفيًا لبريء، وكلفته عليك أقل بكثير مما يبنيه من ثقة لا تُشترى.'},
  {t:'أتحدث مع المدير على انفراد وأعتذر له وأوضح أن القرار كان قراري.', k:2, a:'avoid',
   w:'اعتذار خاص عن ضرر عام؛ الملاحظة تبقى في ملفه وسيقرؤها من لم يسمع اعتذارك.'},
  {t:'أطلب لاحقًا وبهدوء تعديل الملاحظة دون فتح موضوع مسؤوليتي.', k:2, a:'paper',
   w:'يُصلح نصف الضرر ويحتفظ بالنصف المريح لك؛ ومن يفعل ذلك مرة يجد نفسه يفعله دائمًا.'},
  {t:'ألتزم الصمت الآن وأعوّض المدير بدعمه في الفرصة القادمة.', k:1, a:'avoid',
   w:'مقايضة النزاهة بوعد مؤجّل؛ والملاحظة الموثّقة تبقى بينما الوعد لا يلزم أحدًا.'},
 ]},

{id:'ق4-18', lvl:4, t:'توصية من جهة نافذة', c:['trust','info'],
 s:'وصلتك توصية غير رسمية من جهة نافذة بتعيين مرشح بعينه في وظيفة شاغرة. المرشح مستوفٍ للحد الأدنى لكنه ليس الأفضل بين المتقدمين. لم يُطلب منك شيء صراحةً، والرسالة واضحة.',
 l:'التوصيات التي لا تُكتب هي التي يجب أن تُعامَل كأنها كُتبت. والحماية الوحيدة أمامها ليست الرفض الشجاع بل الإجراء المكتمل الذي لا يترك مساحة للتقدير الشخصي.',
 r:[
  {t:'أُبقي المفاضلة في مسارها المؤسسي كاملًا بلجنة ومعايير موثّقة ودرجات، وأُعلن النتيجة بناءً عليها، وأوثّق أي تواصل خارج القنوات لدى الجهة المختصة.', k:4, a:'root',
   w:'الإجراء المكتمل هو الردّ الوحيد الذي لا يُخاصم أحدًا ولا يُخالف شيئًا، ويجعل النتيجة غير قابلة للطعن.'},
  {t:'أُعيّن المرشح ما دام مستوفيًا للشروط وأتجنّب خصومة لا لزوم لها.', k:1, a:'please',
   w:'استيفاء الحد الأدنى ليس معيار اختيار؛ ومن قبِل التوصية الأولى سيُطلب منه ما هو أكبر لاحقًا.'},
  {t:'أتواصل مع الجهة وأوضح أن الاختيار يتم بمعايير ولا يمكن التدخل فيه.', k:3, a:'force',
   w:'موقف سليم، لكن الردّ على رسالة لم تُقل صراحةً يفتح مواجهة كان الإجراء وحده كافيًا لتجنبها.'},
  {t:'أستبعد المرشح من المنافسة تمامًا لإزالة أي شبهة.', k:2, a:'avoid',
   w:'يظلم مرشحًا لا ذنب له بتوصية لم يطلبها، ويستبدل شبهة المحاباة بظلم مؤكد.'},
 ]},

{id:'ق4-19', lvl:4, t:'كاد أن يقع', c:['trust','impr'],
 s:'علمت مصادفةً أن حادث سلامة كاد أن يقع الأسبوع الماضي — سقوط أداة من ارتفاع بجوار عامل — ولم يُبلَّغ عنه لأن «لا أحد تضرر». المشرف يرى أن البلاغ سيجلب تحقيقًا لا داعي له.',
 l:'الحوادث الوشيكة هي المعلومة الأثمن في أي نظام سلامة، لأنها تصف الحادث القادم مجانًا. والثقافة التي تعاقب المبلّغ تشتري صمتًا ثمنه إصابة.',
 r:[
  {t:'أُبلّغ عن الواقعة فورًا عبر نظام السلامة وأعالج سببها الفني، وأُعلن أن البلاغ عن الحوادث الوشيكة لا يُقابَل بمساءلة بل يُعدّ أداءً إيجابيًا.', k:4, a:'root',
   w:'يجمع بين الإجراء الواجب وإصلاح السبب الذي منع البلاغ أصلًا — وبدون الثاني لن تعلم بالواقعة القادمة.'},
  {t:'أُبلّغ عن الواقعة رسميًا وأوجّه ملاحظة للمشرف لعدم إبلاغه في حينه.', k:3, a:'force',
   w:'الإبلاغ صحيح، لكن معاقبة المشرف في أول واقعة تؤكد مخاوفه وتضمن أن يُخفي التالية بعناية أكبر.'},
  {t:'أعالج السبب الفني وأُشدّد على السلامة دون فتح ملف الواقعة الماضية.', k:2, a:'surface',
   w:'يمنع تكرارًا واحدًا ويحرم النظام من بيانات يُبنى عليها التحليل، ويُبقي عُرف عدم الإبلاغ قائمًا.'},
  {t:'أترك الأمر للمشرف فهو الأدرى بظروف الموقع ولم يقع ضرر.', k:1, a:'avoid',
   w:'يفوّض قرارًا يخصّ سلامة الأرواح لمن له مصلحة في عدم الإبلاغ، وهو تنازل لا يُبرَّر بأي ظرف.'},
 ]},

{id:'ق4-20', lvl:4, t:'صديق يسأل', c:['trust','emo'],
 s:'صديق قديم يعمل الآن لدى منافس، وأنتما على عشاء عائلي، يسألك بشكل عابر عن توقيت إطلاق خدمتكم الجديدة. السؤال قد يكون فضولًا، والمعلومة غير معلنة، والعلاقة تعود لعشرين سنة.',
 l:'المعلومة التي تُقال في سياق ودّي تبقى معلومة تنافسية. والعلاقة التي لا تحتمل جملة «هذا ما لا أستطيع الحديث فيه» ليست علاقة تستحق المخاطرة بها.',
 r:[
  {t:'أقول له بوضوح وودّ إن هذا مما لا أستطيع الحديث فيه، وأُكمل الحديث بشكل طبيعي دون توتر أو اعتذار مطوّل.', k:4, a:'root',
   w:'الوضوح المبكر والبسيط يحمي المعلومة والعلاقة معًا؛ والتلعثم أو التهرّب هو ما يُفسد الأمرين.'},
  {t:'أعطيه إجابة عامة غامضة لا تكشف شيئًا محددًا.', k:2, a:'surface',
   w:'حتى الإجابة العامة تحمل إشارة (قريب / بعيد) قد تكفي للمنافس، وتفتح الباب لسؤال أدقّ بعدها.'},
  {t:'أُغيّر الموضوع بلباقة دون التعليق على السؤال.', k:3, a:'avoid',
   w:'ينجح عمليًا ويترك الأمر معلّقًا؛ والصراحة هنا أقل كلفة على العلاقة من التهرّب المتكرر.'},
  {t:'أجيبه بصدق؛ هو صديق عشرين سنة ولن يستخدمها ضدنا.', k:1, a:'blind',
   w:'يراهن بمعلومة المؤسسة على تقدير شخصي للنوايا، وهو تقدير لا تملك حق المخاطرة به أصلًا.'},
 ]},

{id:'ق4-21', lvl:4, t:'ضرر غير مقصود', c:['info','trust'],
 s:'تحليل داخلي كشف أن شرطًا في سياسة الخدمة يستبعد فعليًا فئة من المستفيدين لأسباب لا علاقة لها بالأهلية (طبيعة سكنهم). لم يُقصد ذلك، والعدد نحو ٦٠٠ شخص منذ عامين.',
 l:'الضرر غير المقصود يظلّ ضررًا، والفارق الوحيد أنه قابل للإصلاح بلا خصومة. والمؤسسة التي تصحّح ما لم يُكتشف بعد تبني ثقة لا تشتريها أي حملة.',
 r:[
  {t:'أُعدّل الشرط فورًا، وأحصر المتأثرين وأُعيد فتح حقهم بأثر رجعي مع إشعارهم، وأراجع بقية السياسات بحثًا عن أثر مشابه.', k:4, a:'root',
   w:'يعالج الشرط والضرر الواقع والاحتمال في سياسات أخرى — وهذا ما يفصل التصحيح الحقيقي عن التصحيح الشكلي.'},
  {t:'أُعدّل الشرط من الآن فصاعدًا دون فتح ملف الحالات السابقة.', k:2, a:'surface',
   w:'يمنع التكرار ويترك ٦٠٠ متضرر بلا إنصاف؛ وحين يُكتشف الأمر لاحقًا سيكون السؤال عمّن علم وسكت.'},
  {t:'أرفع الأمر للجهة التنظيمية وأتبع ما تقرره في آلية التصحيح.', k:4, a:'escal',
   w:'الإبلاغ عن أثر بهذا الحجم واجب في أغلب الأطر، ويضمن أن يكون التصحيح معتمدًا لا اجتهادًا داخليًا.'},
  {t:'أعرض الأمر على الإدارة مع توصية بتأجيل التصحيح الرجعي لكلفته العالية.', k:1, a:'please',
   w:'يحوّل مسألة إنصاف إلى بند تكلفة؛ وكلفة اكتشاف الأمر من خارج المؤسسة أضعاف كلفة تصحيحه اليوم.'},
 ]},

{id:'ق4-22', lvl:4, t:'أغلقوا التحقيق', c:['trust','init'],
 s:'تترأس لجنة تحقيق داخلي. وصلك من مسؤول أعلى أن «الموضوع أخذ أكثر من حجمه» وأن من المناسب إنهاء التقرير هذا الأسبوع. لديك خيطان لم يُستكملا وقد يغيّران الخلاصة.',
 l:'التحقيق الذي يُغلق قبل اكتماله يصبح غطاءً لا كشفًا، ويحمّل من وقّعه مسؤولية ما لم يفعله. والاستقلال هنا ليس بطولة بل شرط صحة العمل نفسه.',
 r:[
  {t:'أُبلغه كتابةً أن إغلاق التحقيق قبل استكمال الخيطين يُفقده صحته، وأحدد مهلة قصيرة محددة لاستكمالهما، وأُشعر الجهة التي شكّلت اللجنة بالطلب وبموقفي.', k:4, a:'escal',
   w:'يحمي استقلال اللجنة عبر القناة التي شكّلتها لا عبر مواجهة شخصية، ويقدّم حلًّا زمنيًا يجعل الرفض صعبًا.'},
  {t:'أُنهي التقرير في موعده وأُدرج في ملاحظاته أن خيطين لم يُستكملا.', k:2, a:'paper',
   w:'الملاحظة في الحاشية لا تُنقذ خلاصة قد تكون خاطئة، والتقرير سيُقرأ بخلاصته لا بتحفظاته.'},
  {t:'أستكمل الخيطين دون إخباره وأُسلّم التقرير متأخرًا أسبوعين.', k:2, a:'over',
   w:'يحقق الصواب الموضوعي بطريقة تجعل الخلاف شخصيًا وتُضعف موقفك حين تُناقَش نتائجك.'},
  {t:'أعتذر عن رئاسة اللجنة تجنبًا للضغط وأترك المهمة لغيري.', k:1, a:'avoid',
   w:'الانسحاب يسلّم اللجنة لمن قد لا يقاوم الضغط نفسه، ويترك الخيطين معلّقين بلا أحد.'},
 ]},

{id:'ق4-23', lvl:4, t:'حالة ترفض المساعدة', c:['emo','trust'],
 s:'موظف في موقع حسّاس تتدهور حالته النفسية بوضوح: نسيان متكرر، وانفعال، وغياب. عرضتَ عليه برنامج الدعم فرفض بشدة واعتبره إهانة. وظيفته تتضمن مسؤولية تمسّ سلامة الآخرين.',
 l:'الحق في رفض المساعدة حق شخصي، لكنه لا يمتدّ إلى الحق في موقع يمسّ سلامة الآخرين. والتفريق بين الأمرين هو كل الحلّ: لا إجبار على العلاج، ولا تهاون في الموقع.',
 r:[
  {t:'أنقله مؤقتًا إلى مهام لا تمسّ السلامة بقرار مبرَّر بالأداء الملحوظ لا بالحالة، وأُبقي باب الدعم مفتوحًا وأستشير الموارد البشرية والصحة المهنية في الإطار النظامي.', k:4, a:'root',
   w:'يحمي الآخرين دون انتهاك خصوصيته ولا إجباره، ويستند إلى ما تراه (الأداء) لا إلى تشخيص لست أهلًا له.'},
  {t:'أحترم رفضه وأُبقيه في موقعه مع متابعة لصيقة منّي شخصيًا.', k:1, a:'avoid',
   w:'المتابعة الشخصية ليست ضمانة سلامة؛ واحترام الرفض هنا يُمارَس على حساب أطراف لم يُستشاروا.'},
  {t:'أُحيله إلزاميًا للصحة المهنية وأُعلمه أن استمراره مشروط بذلك.', k:3, a:'force',
   w:'يحمي السلامة فعلًا، لكنه يربط استمراره بإجراء طبي قد يتجاوز صلاحيتك ويستحق استشارة قبل فرضه.'},
  {t:'أُشعر فريقه بضرورة الانتباه ومراجعة عمله دون إخبارهم بالسبب.', k:1, a:'surface',
   w:'ينشر الأمر بين زملائه بلا حماية له ولا حلّ للخطر، ويجمع بين انتهاك الخصوصية وعدم الفاعلية.'},
 ]},

{id:'ق4-24', lvl:4, t:'أنت من يُبلّغ', c:['emo','insp'],
 s:'اتُّخذ قرار بالاستغناء عن اثني عشر موظفًا في قطاعك. لم تكن طرفًا في القرار ولا تتفق معه كاملًا، وأنت من سيُبلّغهم غدًا. بعضهم يعمل معك منذ سنوات.',
 l:'الموظف الذي يُبلَّغ بإنهاء خدمته يتذكّر طريقة الإبلاغ أكثر من سببه. ومن يُخفي موقفه خلف «القرار ليس قراري» يخذل الطرفين: لا يحمي المؤسسة ولا يحترم الموظف.',
 r:[
  {t:'أُبلّغ كل واحد فرديًا ووجهًا لوجه بوضوح واحترام، وأشرح السبب المؤسسي دون تبرئة نفسي ولا تبرير مفتعل، وأحضر معي تفاصيل المستحقات والدعم الانتقالي كاملة.', k:4, a:'root',
   w:'يمنح الخبر أقصى ما يمكن من كرامة ومعلومة عملية، ويتحمّل دور المبلّغ بدل الاختباء خلف من قرّر.'},
  {t:'أُبلّغهم في اجتماع جماعي لتوحيد الرسالة واختصار الألم.', k:1, a:'avoid',
   w:'يختصر ألمك أنت لا ألمهم؛ الإبلاغ الجماعي بإنهاء الخدمة يُقرأ تجريدًا للأشخاص وسيُروى عن المؤسسة سنوات.'},
  {t:'أوضح لهم أن القرار من الإدارة العليا وأنني عارضته قدر استطاعتي.', k:2, a:'avoid',
   w:'يشتري تعاطفهم بثمن مصداقية المؤسسة، ولا يقدّم لهم شيئًا عمليًا في اللحظة التي يحتاجون فيها معلومة.'},
  {t:'أطلب من الموارد البشرية تولّي الإبلاغ بصفته إجراءً إداريًا.', k:1, a:'deleg',
   w:'التفويض هنا تخلٍّ عن أصعب واجبات القيادة، وسيُفهم لدى الباقين على حقيقته تمامًا.'},
 ]},

{id:'ق4-25', lvl:4, t:'ما أخفاه سلفك', c:['info','trust'],
 s:'بعد شهرين من تسلّمك الموقع، اكتشفت أن سلفك كان يعلم بخلل جوهري في نظام حسّاس ولم يُبلّغ عنه، وأن الخلل ما زال قائمًا. سلفك الآن في موقع أعلى داخل المؤسسة نفسها.',
 l:'الخلل القائم والمسؤولية عن إخفائه ملفّان منفصلان. من يخلطهما يتحوّل من معالج إلى خصم، ومن يعالج الأول ويُحيل الثاني يفعل ما يجب دون أن يخسر موقعه.',
 r:[
  {t:'أعالج الخلل فورًا وأُبلغ عنه في مساره الفني، وأُحيل مسألة عدم الإبلاغ السابق إلى المراجعة الداخلية بوقائع مجردة دون اتهام.', k:4, a:'root',
   w:'يفصل السلامة الفنية عن المساءلة، فيُنجز الأعجل بيدك ويترك الأصعب لجهة الاختصاص بلا خصومة شخصية.'},
  {t:'أعالج الخلل وأطوي صفحة الماضي؛ الأهم أن يُصلَح لا أن يُحاسَب أحد.', k:2, a:'avoid',
   w:'يُصلح النظام ويُبقي النمط؛ ومن أخفى مرة في موقع أدنى قد يخفي في موقع أعلى وأوسع أثرًا.'},
  {t:'أتحدث مع سلفي أولًا وأطلب منه أن يُبلّغ بنفسه عمّا حدث.', k:3, a:'root',
   w:'يمنحه مخرجًا كريمًا وقد ينجح، لكنه يعلّق الإبلاغ على قرار من له مصلحة في عدمه ويؤخّر معالجة الخلل.'},
  {t:'أرفع الأمر كاملًا للإدارة العليا بصفته إخفاءً متعمّدًا من مسؤول حالي.', k:2, a:'escal',
   w:'يصوغ الواقعة كاتهام قبل التحقق من ظروفها، ويجعل الملف صراعًا شخصيًا بدل معالجة منضبطة.'},
 ]},

{id:'ق4-26', lvl:4, t:'مكافأة بالخطأ', c:['trust','impr'],
 s:'وصلتك مكافأة سنوية أعلى بكثير مما يقتضيه تقييمك، ويبدو أنها خطأ في الاحتساب. لا أحد لاحظ، والمبلغ ليس صغيرًا، والنظام لا يُعيد فتح الاحتسابات عادةً بعد الصرف.',
 l:'النزاهة تُقاس فيما لا يراه أحد ولا يطالبك به أحد. والفارق بين من يُبلّغ ومن يصمت لا يظهر اليوم، لكنه يظهر في كل قرار يواجهه أحدهما لاحقًا.',
 r:[
  {t:'أُبلّغ الموارد البشرية فورًا بالفارق وأطلب المراجعة والتسوية، مهما كانت النتيجة.', k:4, a:'root',
   w:'الفعل الوحيد المتّسق مع ما ستطلبه أنت من فريقك في موقف مشابه؛ وقيمته في أنه اختياري تمامًا.'},
  {t:'أستفسر عن طريقة الاحتساب بصيغة سؤال عام دون الإشارة إلى الفارق.', k:2, a:'surface',
   w:'يمنحك غطاءً شكليًا («لقد سألت») دون أن يكشف الخطأ فعلًا؛ وهو تهرّب مغلّف بالاستفسار.'},
  {t:'أحتفظ بالمبلغ دون صرفه لفترة، فإن طُولبت به أعدته.', k:1, a:'paper',
   w:'يجعل الردّ مشروطًا باكتشاف غيرك، وهو تعريف دقيق لما لا يُسمّى نزاهة.'},
  {t:'أستلمها؛ الخطأ ليس خطئي والنظام مسؤول عن دقته.', k:1, a:'avoid',
   w:'صحيح أن الخطأ ليس خطأك، لكن الاحتفاظ به بعد العلم به يصبح قرارك أنت لا خطأ النظام.'},
 ]},

{id:'ق4-27', lvl:4, t:'توقيع على ما لا تعرف', c:['info','trust'],
 s:'طُلب منك التوقيع على محضر استلام لأعمال نُفّذت قبل تسلّمك الموقع بأسبوع. الموقّعون الآخرون وقّعوا، والمقاول ينتظر صرف مستحقاته، ولا تملك أي وسيلة للتحقق من مطابقة الأعمال.',
 l:'التوقيع شهادة لا إجراء. ومن يوقّع على ما لم يعاينه يتحمّل مسؤوليته كاملة مهما كان عدد من وقّعوا قبله أو ضغط الموعد.',
 r:[
  {t:'أوقّع بتحفّظ مكتوب يحدد أنني لم أعاين الأعمال وأن توقيعي بناءً على محضر الفريق الفني، أو أطلب معاينة سريعة قبل التوقيع — ولا أوقّع مطلقًا شهادةً على ما لم أره.', k:4, a:'paper',
   w:'التوثيق هنا ليس تحصينًا شخصيًا بل تصحيح لمعنى التوقيع، ويحفظ حق المقاول دون أن تشهد بما لا تعلم.'},
  {t:'أوقّع اعتمادًا على توقيع الزملاء والفريق الفني الذي عاين الأعمال.', k:2, a:'blind',
   w:'مسؤولية التوقيع فردية ولا تتوزّع بعدد الموقّعين؛ وإن ظهر خلل فسيُسأل كل موقّع عن شهادته هو.'},
  {t:'أرفض التوقيع نهائيًا وأطلب أن يوقّع من كان مسؤولًا وقت التنفيذ.', k:3, a:'force',
   w:'موقف سليم مبدئيًا لكنه يعطّل مستحقات مقاول قد يكون منفّذًا سليمًا، دون البحث عن صيغة وسط مشروعة.'},
  {t:'أوقّع وأطلب من الفريق الفني مراجعة لاحقة للأعمال بعد الصرف.', k:1, a:'surface',
   w:'المراجعة بعد الصرف تفقد أثرها العملي، والتوقيع يكون قد استُهلك في إجراء لا رجعة فيه.'},
 ]},

{id:'ق4-28', lvl:4, t:'سرّية وسلامة', c:['trust','emo'],

const $  = (s,r)=>(r||document).querySelector(s);

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t}return a}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function med(a){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function sd(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))}
function mmss(s){s=Math.max(0,Math.round(s));return (s/60|0)+':'+('0'+(s%60)).slice(-2)}
const DAY=864e5;
function ymd(t){const d=new Date(t==null?Date.now():t);const p=n=>('0'+n).slice(-2);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/DAY)}
const pct=(a,b)=>b?Math.round(a/b*100):0;

const KEY='miyar.v1';
function blankProfile(n){return {name:n||'المتدرّب', intro:false, created:Date.now(),
  cases:{}, runs:[], notes:{}, marks:{}, streak:{last:'',n:0,best:0}, plan:null,
  gcat:{items:{},runs:[],skills:{},tags:{},level:{a:'متوسط',n:'متوسط',v:'متوسط'}},
  pq:{runs:[]}, dbx:{runs:[]}, sim:{active:null,runs:[]}}}
function readJSON(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
let DB=readJSON(KEY)||{v:1,profiles:{p1:blankProfile()},active:'p1',theme:null,fs:'m'};
if(!DB.profiles||!Object.keys(DB.profiles).length){DB.profiles={p1:blankProfile()};DB.active='p1'}
if(!DB.profiles[DB.active])DB.active=Object.keys(DB.profiles)[0];
function healProfile(p){ const b=blankProfile(p.name); Object.keys(b).forEach(k=>{ if(p[k]==null)p[k]=b[k]; });
  ['gcat','pq','dbx','sim'].forEach(k=>{ Object.keys(b[k]).forEach(kk=>{ if(p[k][kk]==null)p[k][kk]=b[k][kk] }) }); return p }
Object.keys(DB.profiles).forEach(k=>healProfile(DB.profiles[k]));
function P(){return DB.profiles[DB.active]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
save();
function bumpStreak(){ const s=P().streak, today=ymd(); if(s.last!==today){ s.n=(s.last&&daysBetween(s.last,today)===1)?s.n+1:1; s.last=today; s.best=Math.max(s.best||0,s.n) } }

function gauge(p,label){
  const r=76,C=2*Math.PI*r,on=C*clamp(p,0,1);
  return '<div class="gauge-wrap"><svg class="gauge" viewBox="0 0 186 186" role="img" aria-label="'+Math.round(p*100)+'٪">'+
   '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--gold-2)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs>'+
   '<circle class="bg" cx="93" cy="93" r="'+r+'"/><circle class="fg" cx="93" cy="93" r="'+r+'" stroke-dasharray="'+on.toFixed(1)+' '+(C-on).toFixed(1)+'" transform="rotate(-90 93 93)"/>'+
   '<text class="nv" x="93" y="98" text-anchor="middle">'+Math.round(p*100)+'</text><text class="nu" x="93" y="120" text-anchor="middle">'+E(label||'من ١٠٠')+'</text></svg></div>';
}
function radar(items){
  const n=items.length,cx=170,cy=158,R=104;
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  let g='';[.25,.5,.75,1].forEach(f=>{g+='<polygon class="gr" points="'+items.map((_,i)=>pt(i,f).map(v=>v.toFixed(1)).join(',')).join(' ')+'"/>'});
  items.forEach((_,i)=>{const p=pt(i,1);g+='<line class="ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'});
  g+='<polygon class="ar" points="'+items.map((it,i)=>pt(i,Math.max(.04,it.v)).map(v=>v.toFixed(1)).join(',')).join(' ')+'"/>';
  items.forEach((it,i)=>{const p=pt(i,Math.max(.04,it.v));g+='<circle class="pt'+(it.has===false?' hl':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>'});
  items.forEach((it,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*(R+24),y=cy+Math.sin(a)*(R+24)+3;const an=Math.abs(Math.cos(a))<.25?'middle':(Math.cos(a)>0?'start':'end');
    g+='<text class="lb'+(it.has===false?' dim':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+an+'">'+E(it.lb)+'</text>'});
  return '<div class="radar-box"><svg class="rdr" viewBox="0 0 340 316" role="img">'+g+'</svg></div>';
}
function spark(vals){
  if(vals.length<2)return '';const w=320,h=46,p=5,n=vals.length;const X=i=>p+(w-2*p)*(i/(n-1)),Y=v=>h-p-(h-2*p)*clamp(v,0,1);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);const d='M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path class="fl" d="'+d+' L'+X(n-1).toFixed(1)+' '+(h-p)+' L'+X(0).toFixed(1)+' '+(h-p)+' Z"/><path class="ln2" vector-effect="non-scaling-stroke" d="'+d+'"/></svg>';
}
function scaleline(pos,leftCap,rightCap,zf,zt){const p=clamp(pos,0,1)*100;
  return '<div class="scaleline"><div class="rail"></div>'+(zf!=null?'<div class="zone" style="right:'+(zf*100).toFixed(1)+'%;width:'+((zt-zf)*100).toFixed(1)+'%"></div>':'')+
   '<div class="mk" style="right:calc('+p.toFixed(1)+'% - 1.5px)"></div><div class="cap" style="right:0">'+E(rightCap)+'</div><div class="cap" style="left:0">'+E(leftCap)+'</div></div>'}
function lines(rows){return '<div class="lines">'+rows.map(r=>'<div class="ln"><div class="a">'+E(r.a)+'</div><div class="t"><div class="f" style="width:'+Math.round(clamp(r.v,0,1)*100)+'%'+(r.c?';background:'+r.c:'')+'"></div></div><div class="n">'+(r.txt!=null?E(r.txt):Math.round(r.v*100)+'٪')+'</div></div>').join('')+'</div>'}
function tiles(list){return '<div class="tiles">'+list.map(t=>'<div class="tile"><div class="v">'+t.v+'</div><div class="k">'+E(t.k)+'</div></div>').join('')+'</div>'}

const GDOM={v:{n:'الاستدلال اللفظي',s:'لفظي'},n:{n:'الاستدلال العددي',s:'عددي'},a:{n:'الاستدلال التجريدي',s:'تجريدي'}};
const GDOMS=['v','n','a'], G_OFFICIAL=42, G_PER=14, G_REF_MIN=20;
const G_LETTERS=['أ','ب','ج','د','هـ','و'];
const FIX_SKILL={v:'أسئلة النمط الرسمي — لفظي',n:'أسئلة النمط الرسمي — عددي',a:'أسئلة النمط الرسمي — تجريدي'};
let GR=null, GT=null, GLAST=null;

/* مرجع السؤال قابل للحفظ: مولّد (بذرة) أو ثابت (فهرس) */
function gRef(it){ return it.f!=null?{f:it.f}:{g:1,dom:it.dom,seed:it.seed,level:it.level} }
function gMat(ref){
  if(ref.f!=null){ const b=GCAT_BANK[ref.f]; if(!b)return null;
    return Object.assign({id:'F-'+ref.f,f:ref.f,kind:'fixed',skill:FIX_SKILL[b.dom],level:'متوسط',tags:b.o.map((_,i)=>i===b.a?null:'fixed_wrong')},b) }
  return GEN.item(ref.dom,ref.seed,{level:ref.level});
}
function gSkillKey(it){ return it.dom+':'+(it.kind==='abstract'?(it.template==='matrix'?'مصفوفات':it.template==='odd'?'الشاذ بصريًا':'متتابعات بصرية'):it.skill) }
function gFixedIdx(dom){ return GCAT_BANK.map((b,i)=>b.dom===dom?i:-1).filter(i=>i>=0) }

/* بناء مجموعة أسئلة */
function gPool(dom,n,level,opts){
  opts=opts||{}; const doms=dom==='mix'?GDOMS:[dom]; const per=Math.ceil(n/doms.length); let out=[];
  doms.forEach(d=>{ const lv=level==='auto'?P().gcat.level[d]:level;
    if(opts.fixed){ out=out.concat(shuf(gFixedIdx(d)).slice(0,per).map(i=>({f:i}))) }
    else out=out.concat(GEN.set(d,per,{level:lv},(Date.now()+d.charCodeAt(0)*7919)>>>0).map(gRef)) });
  return shuf(out).slice(0,n);
}
/* الاختبار بالتركيب الرسمي: ١٤ لكل مجال — ٤ من النمط الرسمي و١٠ مولّدة بصعوبة متدرّجة */
function gOfficialPool(){
  let out=[];
  GDOMS.forEach(d=>{ const fx=shuf(gFixedIdx(d)).slice(0,4).map(i=>({f:i})); const base=(Date.now()+d.charCodeAt(0)*104729)>>>0;
    const gen=[].concat(GEN.set(d,3,{level:'سهل'},base+1),GEN.set(d,4,{level:'متوسط'},base+2),GEN.set(d,3,{level:'صعب'},base+3)).map(gRef);
    out=out.concat(shuf(fx.concat(gen))) });
  return out;
}
function gDueList(){ const n=Date.now(),it=P().gcat.items; return Object.keys(it).filter(k=>it[k].due&&it[k].due<=n&&it[k].ref).map(k=>it[k].ref) }
function gWeakList(){ const it=P().gcat.items; return Object.keys(it).filter(k=>it[k].ref&&it[k].tries&&it[k].ok/it[k].tries<0.5).map(k=>it[k].ref) }

function gStart(mode,refs,o){
  o=o||{}; if(!refs.length){alert('لا توجد أسئلة مطابقة الآن.');return}
  GR={mode:mode,label:o.label||'',refs:refs,cache:{},i:o.i||0,ans:o.ans||refs.map(()=>-1),spent:o.spent||refs.map(()=>0),shown:refs.map((_,k)=>o.ans&&o.ans[k]>=0),t0:o.t0||Date.now(),mark:0,dom:o.dom||'mix',sim:!!o.sim};
  go('gcat-run');
}
function gItem(i){ if(!GR.cache[i])GR.cache[i]=gMat(GR.refs[i]); return GR.cache[i] }
function gStop(){ if(GT){clearInterval(GT);GT=null} if(GR&&GR.mark){GR.spent[GR.i]+=(Date.now()-GR.mark)/1000;GR.mark=0} }

    return '<button class="'+cls+'" data-gopt="'+k+'"'+(ro?' disabled':'')+'>'+(tiles?op+'<span class="lt">'+G_LETTERS[k]+'</span>':'<span class="lt">'+G_LETTERS[k]+'</span><span>'+E(op)+'</span>')+'</button>' }).join('')+'</div>';

    body+='<div class="gfeed '+(okp?'ok':'bad')+'">'+(okp?'✓ إجابة صحيحة':(ans<0?'— لم تُجب':'✕ إجابة خاطئة — الصحيح: '+G_LETTERS[it.a]))+'</div>';
    body+='<div class="why"><div class="t">لماذا؟</div>'+E(it.ex||'')+(it.rule?'<div style="margin-top:6px;color:var(--muted)">القاعدة: '+E(it.rule)+'</div>':'')+

  }
  return '<div class="qcard"><div class="hd">'+chips+'</div><div class="bd">'+body+'</div></div>';
}

/* ── الحساب والحفظ ── */
function gRunStats(run){
  run=run||GR; const per={v:{n:0,ok:0,sec:0},n:{n:0,ok:0,sec:0},a:{n:0,ok:0,sec:0}}, skills={}, tags={}, wrong=[];
  run.refs.forEach((ref,i)=>{ const it=run.cache[i]||(run.cache[i]=gMat(ref)); if(!it)return; const a=run.ans[i], ok=a===it.a; const d=per[it.dom]; d.n++; if(ok)d.ok++; d.sec+=run.spent[i]||0;
    const sk=gSkillKey(it); skills[sk]=skills[sk]||{n:0,ok:0}; skills[sk].n++; if(ok)skills[sk].ok++;
    if(!ok){ wrong.push(i); const t=a>=0?it.tags[a]:'no_answer'; if(t&&t!=='fixed_wrong'){tags[t]=(tags[t]||0)+1} } });
  const n=run.refs.length, ok=Object.values(per).reduce((s,d)=>s+d.ok,0), secs=run.spent.reduce((s,x)=>s+x,0);
  return {n:n,ok:ok,pct:n?ok/n:0,per:per,skills:skills,tags:tags,wrong:wrong,secs:secs,answered:run.ans.filter(a=>a>=0).length};
}
function gFinish(){
  gStop(); const st=gRunStats(), g=P().gcat, now=Date.now();
  GR.refs.forEach((ref,i)=>{ const it=GR.cache[i]; if(!it)return; const ok=GR.ans[i]===it.a; const id=it.id;
    const r=g.items[id]||{ref:ref,dom:it.dom,skill:gSkillKey(it),tries:0,ok:0,box:0}; r.tries++; if(ok)r.ok++; r.last=ok; r.ts=now; r.sec=Math.round(GR.spent[i]);
    r.box=ok?Math.min(5,(r.box||0)+1):0; r.due=now+[1,3,7,14,30,60][r.box]*DAY; if(ok&&r.box>=3)r.due=0; /* أُتقن: لا مراجعة مستحقة بعد ثلاث إصابات */
    if(!ok&&GR.ans[i]>=0){const t=it.tags[GR.ans[i]]; if(t&&t!=='fixed_wrong'){r.tag=t}} g.items[id]=r; });
  Object.keys(st.skills).forEach(k=>{ g.skills[k]=g.skills[k]||{n:0,ok:0}; g.skills[k].n+=st.skills[k].n; g.skills[k].ok+=st.skills[k].ok });
  Object.keys(st.tags).forEach(k=>{ g.tags[k]=(g.tags[k]||0)+st.tags[k] });
  /* الصعوبة التكيّفية: ≥ ٨٥٪ ترفع المستوى، < ٥٠٪ تخفضه — لكل مجال على حدة */
  GDOMS.forEach(d=>{ const p=st.per[d]; if(p.n<5)return; const L=GEN.LEVELS, i=L.indexOf(g.level[d]); const pc=p.ok/p.n; if(pc>=.85&&i<2)g.level[d]=L[i+1]; else if(pc<.5&&i>0)g.level[d]=L[i-1] });
  const keep=Object.keys(g.items); if(keep.length>600){ keep.sort((a,b)=>(g.items[a].ts||0)-(g.items[b].ts||0)).slice(0,keep.length-600).forEach(k=>delete g.items[k]) }
  g.runs.push({ts:now,mode:GR.mode,dom:GR.dom,n:st.n,ok:st.ok,pct:st.pct,secs:Math.round(st.secs),per:{v:[st.per.v.ok,st.per.v.n],n:[st.per.n.ok,st.per.n.n],a:[st.per.a.ok,st.per.a.n]},sim:GR.sim});
  if(g.runs.length>80)g.runs=g.runs.slice(-80);
  bumpStreak(); save(); GLAST=GR; GR=null;
  if(GLAST.sim){ SIM.gcatDone(st,GLAST); return }
  go('gcat-result');
}

    st.wrong.forEach(i=>{ const it=GLAST.cache[i]; h+='<details><summary><span class="chip gd">'+E(GDOM[it.dom].s)+'</span> سؤال '+AI(i+1)+' — '+E(it.kind==='fixed'?'النمط الرسمي':gSkillKey(it).split(':')[1])+'</summary><div class="in">'+gItemHTML(it,i,{ans:GLAST.ans[i],reveal:true,ro:true})+'</div></details>' }); h+='</div>' }
  h+='<div class="brow"><button class="b g" data-gagain="1">إعادة الأسئلة نفسها</button><button class="b o" data-gnew="1">مجموعة جديدة بالإعدادات نفسها</button>'+(st.wrong.length?'<button class="b o" data-gmist="1">تدريب على الأخطاء فقط</button>':'')+'<button class="b q" data-go="gcat">← القدرات</button></div>';
  return h+FOOT;

function lkStart(cfg){
  const items=cfg.items; if(!items.length)return;
  LK={key:cfg.key,label:cfg.label||'',items:items,order:cfg.order||shuf(items.map((_,i)=>i)),ans:cfg.ans||{},spent:cfg.spent||{},i:cfg.i||0,t0:cfg.t0||Date.now(),mark:0,sim:!!cfg.sim,extra:cfg.extra||{}};
  go(cfg.key+'-run');
}
function lkStop(){ if(LKT){clearInterval(LKT);LKT=null} if(LK&&LK.mark){const k=LK.order[LK.i];LK.spent[k]=(LK.spent[k]||0)+(Date.now()-LK.mark)/1000;LK.mark=0} }

/* مؤشرات أسلوب الاستجابة المشتركة */
function lkStyle(items,ans,spent){
  const ks=Object.keys(ans); const raw=ks.map(k=>ans[k]); const n=raw.length||1;
  const ext=raw.filter(v=>v===1||v===5).length/n, mid=raw.filter(v=>v===3).length/n, agree=raw.filter(v=>v>=4).length/n;
  let rr=[],rn=[]; ks.forEach(k=>{ const it=items[k]; if(it.d==='sd'||it.d==='chk')return; (it.r?rr:rn).push(ans[k]) });
  const acq=rr.length&&rn.length?(mean(rr)+mean(rn)-6):0;   /* > ٠ يعني الموافقة على البند وعكسه معًا */
  const secs=ks.map(k=>spent[k]||0).filter(x=>x>0); const medSec=med(secs);
  return {ext:ext,mid:mid,agree:agree,acq:acq,medSec:medSec,n:raw.length};
}
function lkFlags(s,total){
  const f=[]; const cov=s.n/total;
  if(cov<1)f.push({lvl:'warn',t:'لم تُجب عن '+AI(total-s.n)+' بندًا'});
  f.push(s.ext>0.7?{lvl:'bad',t:'تطرّف في الإجابات: '+AI(Math.round(s.ext*100))+'٪ في الطرفين'}:s.ext>0.5?{lvl:'warn',t:'ميل إلى الطرفين: '+AI(Math.round(s.ext*100))+'٪'}:{lvl:'ok',t:'توزيع طبيعي: '+AI(Math.round(s.ext*100))+'٪ في الطرفين'});
  f.push(s.mid>0.45?{lvl:'bad',t:'تحفّظ مفرط: '+AI(Math.round(s.mid*100))+'٪ «محايد»'}:s.mid>0.3?{lvl:'warn',t:'محايد كثيرًا: '+AI(Math.round(s.mid*100))+'٪'}:{lvl:'ok',t:'محايد: '+AI(Math.round(s.mid*100))+'٪'});
  f.push(s.acq>0.8?{lvl:'bad',t:'إذعان: توافق على البند وعكسه (+'+s.acq.toFixed(1)+')'}:s.acq>0.4?{lvl:'warn',t:'ميل إلى الموافقة الآلية (+'+s.acq.toFixed(1)+')'}:{lvl:'ok',t:'البنود المعكوسة متسقة'});
  if(s.medSec&&s.medSec<1.6)f.push({lvl:'bad',t:'سرعة مفرطة: وسيط '+s.medSec.toFixed(1)+' ث للبند'}); else if(s.medSec)f.push({lvl:'ok',t:'وسيط الزمن '+s.medSec.toFixed(1)+' ث للبند'});
  return f;
}
function vflags(fl){ return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+fl.map(f=>'<span class="vflag '+f.lvl+'">'+({ok:'✓',warn:'!',bad:'✕'})[f.lvl]+' '+E(f.t)+'</span>').join('')+'</div>' }
function bandLabel(p){ return p>=0.65?'مرتفع':p>=0.4?'متوسط':'منخفض' }

const PQ_GROUPS=[]; Object.keys(PQ_DIMS).forEach(k=>{ const g=PQ_DIMS[k].group; if(PQ_GROUPS.indexOf(g)<0)PQ_GROUPS.push(g) });
function pqItems(withSD){ let out=[]; Object.keys(PQ_BANK).forEach(d=>PQ_BANK[d].forEach(x=>out.push({t:x.t,d:d,r:x.r?1:0,cid:x.cid||null}))); PQ_CHECKS.forEach(c=>out.push({t:c.t,d:'chk',chk:c.chk})); if(withSD)SD_ITEMS.forEach(s=>out.push({t:s.t,d:'sd'})); return out }
function pqScore(items,ans,spent){
  const dims={}; Object.keys(PQ_DIMS).forEach(d=>dims[d]=[]);
  const sdv=[], chk={}, cidv={};
  items.forEach((it,k)=>{ const a=ans[k]; if(a==null)return; if(it.d==='sd'){sdv.push(a);return} if(it.d==='chk'){chk[it.chk]=a;return} dims[it.d].push(it.r?6-a:a); if(it.cid)cidv[it.cid]=a });
  const out={dims:{},groups:{},val:{},flags:[]};
  Object.keys(dims).forEach(d=>{ const m=dims[d].length?mean(dims[d]):3; out.dims[d]={mean:m,pct:(m-1)/4,n:dims[d].length} });
  PQ_GROUPS.forEach(g=>{ const ks=Object.keys(PQ_DIMS).filter(k=>PQ_DIMS[k].group===g); out.groups[g]=mean(ks.map(k=>out.dims[k].pct)) });
  const st=lkStyle(items,ans,spent||{}); out.val=st;
  let cons=0,consN=0; Object.keys(chk).forEach(k=>{ if(cidv[k]!=null){consN++; if(Math.abs(cidv[k]-chk[k])<=1)cons++} }); out.val.cons=cons; out.val.consN=consN;
  out.val.sd=sdv.length?mean(sdv):null;

/* ══════════════ الحكم على المواقف — محرّك Leadership Test Ability ══════════════ */
function BOXD(b){return [1,3,7,14,30,60][clamp(b|0,0,5)]}
const PTS = (u,k)=>Math.max(0,3-Math.abs(u-k));
const MAXC = 12;

const BYID={}; CASES.forEach(c=>BYID[c.id]=c);
const BYLVL={1:[],2:[],3:[],4:[]}; CASES.forEach(c=>BYLVL[c.lvl].push(c));

/* ══════════════ الأوضاع ══════════════ */
const MODE_CFG={
  /* التوقيت مفتوح في كل الأوضاع: الزمن يُقاس ولا يُلزم، ولا انتقال إجباري.
     الرجوع مفتوح كذلك — كان مقيّدًا فقط لمنع إعادة ضبط المؤقّت، ولم يعد له سبب. */
  study:{n:'التدريب الموجَّه', g:'◈', reveal:true,  back:true},
  sim  :{n:'محاكاة الاختبار',  g:'◷', reveal:false, back:true},
  drill:{n:'الجولة السريعة',   g:'⚡', reveal:false, back:true},
  exam :{n:'الاختبار الشامل',  g:'❖', reveal:false, back:true},
  weak :{n:'جولة نقاط الضعف',  g:'◉', reveal:true,  back:true},
  due  :{n:'المراجعة المستحقة',g:'◴', reveal:true,  back:true},
  fix  :{n:'جولة علاجية',      g:'✚', reveal:true,  back:true},
};
const MODEN=k=>(MODE_CFG[k]||{n:k}).n;
const MODES=['study','sim','drill'].map(id=>({id:id,n:MODE_CFG[id].n,g:MODE_CFG[id].g,d:{
  study:'يُكشف تقدير لجنة الخبراء بعد كل موقف مباشرة، مع مسوّغ كل ردّ ودرس الموقف. بلا مؤقّت — هذا وضع البناء.',
  sim  :'مواقف المستوى كاملة بوقت مفتوح، بلا كشف حتى النهاية. خُذ ما تحتاجه من وقت ثم اقرأ التقرير كاملًا.',
  drill:'ثمانية مواقف تُختار عشوائيًا من المستوى، بوقت مفتوح. للمراجعة المكثّفة في جلسة قصيرة.',
}[id]}));
const EXAM_N=16, DRILL_N=8;

/* ══════════════ اختيار المواقف ══════════════ */
function rec(id){return P().cases[id]}
function dueList(){const n=Date.now();return CASES.filter(c=>{const r=rec(c.id);return r&&r.due&&r.due<=n})}
function weakList(){return CASES.filter(c=>{const r=rec(c.id);return r&&((r.best||0)<0.7||r.missBest)})}
function freshList(){return CASES.filter(c=>!rec(c.id))}
function compWeak(){
  const acc={}; CK.forEach(k=>acc[k]={g:0,m:0});
  CASES.forEach(c=>{const r=rec(c.id); if(!r)return; c.c.forEach(k=>{acc[k].g+=(r.best||0);acc[k].m+=1})});
  return CK.filter(k=>acc[k].m>=2).map(k=>({k:k,v:acc[k].g/acc[k].m,n:acc[k].m})).sort((a,b)=>a.v-b.v);
}
function casesForComp(k,limit){
  return CASES.filter(c=>c.c.indexOf(k)>=0)
    .sort((a,b)=>((rec(a.id)||{}).best||0)-((rec(b.id)||{}).best||0)).slice(0,limit||8);
}

/* ══════════════ حالة العرض والجولة ══════════════ */
let R=null, TICK=null;

/* ══════════════ الجولة ══════════════ */
function startRun(mode,opts){
  opts=opts||{};
  const cfg=MODE_CFG[mode]||MODE_CFG.study;
  let pool=opts.list;
  if(!pool){
    if(mode==='exam'){ pool=[]; [1,2,3,4].forEach(l=>{pool=pool.concat(shuf(BYLVL[l]).slice(0,EXAM_N/4))}); pool=shuf(pool); }
    else if(mode==='drill') pool=shuf(BYLVL[opts.lvl]).slice(0,DRILL_N);
    else if(mode==='weak')  pool=shuf(weakList()).slice(0,10);
    else if(mode==='due')   pool=shuf(dueList()).slice(0,12);
    else pool=shuf(BYLVL[opts.lvl]);
  } else pool=shuf(pool);
  if(!pool.length){ alert('لا توجد مواقف مطابقة لهذه الجولة الآن.'); return; }
  R={ mode:mode, lvl:opts.lvl||0, label:opts.label||'', list:pool, i:0,
      ord:pool.map(c=>shuf(c.r.map((_,k)=>k))),
      ans:pool.map(()=>({})), conf:pool.map(()=>0), shown:pool.map(()=>false),
      spent:pool.map(()=>0),
      act:0, t0:Date.now(), mark:0,
      planDay: opts.planDay||0, sim:!!opts.sim };
  if(opts.resume){ Object.assign(R,opts.resume); R.list=R.ids.map(id=>BYID[id]); }
  go('jud-run');
}
function stopTick(){
  if(TICK){clearInterval(TICK);TICK=null}
  if(R&&R.mark){ R.spent[R.i]+=(Date.now()-R.mark)/1000; R.mark=0; }
}
/* عدّاد تصاعدي فقط: يقيس زمنك لتحليل الإيقاع ولا يفرض عليك حدًّا */
function startClock(){
  if(!R||V.v!=='jud-run')return; if(TICK)clearInterval(TICK);
  R.mark=Date.now();
  TICK=setInterval(function(){ if(!R){clearInterval(TICK);TICK=null;return}
    const now=Date.now(); R.spent[R.i]+=(now-R.mark)/1000; R.mark=now;
    paintClock();
  },500);
  paintClock();
}
function paintClock(){
  const el=$('#elapsed'); if(el) el.textContent=mmss(R.spent[R.i]);
}
function advance(){
  if(R.i===R.list.length-1){ finish(); return; }
  R.i++; R.act=0; if(R.sim)SIM.saveJud(R); redraw();
}

/* ══════════════ الحساب ══════════════ */
function caseScore(ci){
  const c=R.list[ci], a=R.ans[ci];
  let got=0,n=0;
  c.r.forEach((rr,k)=>{ if(a[k]){got+=PTS(a[k],rr.k);n++} });
  return {got:got,max:n*3,n:n,pct:n?got/(n*3):0};
}
function bestPicked(ci){
  const c=R.list[ci], a=R.ans[ci];
  if(Object.keys(a).length<4) return null;
  const bi=c.r.reduce((b,rr,k)=>rr.k>c.r[b].k?k:b,0);
  return a[bi]===Math.max.apply(null,c.r.map((_,k)=>a[k]));
}
function worstSpotted(ci){
  const c=R.list[ci], a=R.ans[ci];
  if(Object.keys(a).length<4) return null;
  const wi=c.r.reduce((b,rr,k)=>rr.k<c.r[b].k?k:b,0);
  return a[wi]<=2;
}
function runStats(){
  const per=[],us=[],ks=[];
  let conc=0,pairs=0,topHit=0,topN=0,lowHit=0,lowN=0;
  R.list.forEach((c,ci)=>{
    const a=R.ans[ci]; per.push(caseScore(ci));
    c.r.forEach((rr,k)=>{ if(a[k]){ us.push(a[k]);ks.push(rr.k);
      if(rr.k===4){topN++;if(a[k]===4)topHit++}
      if(rr.k===1){lowN++;if(a[k]<=2)lowHit++} }});
    for(let x=0;x<4;x++)for(let y=x+1;y<4;y++){
      if(!a[x]||!a[y])continue;
      const dk=c.r[x].k-c.r[y].k; if(!dk)continue;
      const du=a[x]-a[y]; pairs++;
      if(du===0)conc+=0.5; else if((du>0)===(dk>0))conc+=1;
    }
  });
  const got=per.reduce((s,p)=>s+p.got,0), max=per.reduce((s,p)=>s+p.max,0);
  const bs=R.list.map((c,i)=>bestPicked(i)).filter(v=>v!==null);
  const ws=R.list.map((c,i)=>worstSpotted(i)).filter(v=>v!==null);
  return {per:per, answered:per.filter(p=>p.n>0).length, total:R.list.length,
    got:got, max:max, pct:max?got/max:0,
    lean:mean(us)-mean(ks), spread: sd(ks)>0? sd(us)/sd(ks):1,
    rank: pairs?conc/pairs:0, top: topN?topHit/topN:0, low: lowN?lowHit/lowN:0,
    best: bs.length? bs.filter(Boolean).length/bs.length:0,
    worst: ws.length? ws.filter(Boolean).length/ws.length:0,
    secs: Math.round(R.spent.reduce((s,x)=>s+x,0))};
}
function compScores(){
  const acc={}; CK.forEach(k=>acc[k]={g:0,m:0});
  R.list.forEach((c,ci)=>{const s=caseScore(ci); if(!s.n)return;
    c.c.forEach(k=>{if(acc[k]){acc[k].g+=s.got;acc[k].m+=s.max}})});
  return acc;
}
/* تحليل أنماط الردّ: الفارق بين تقديرك وتقدير اللجنة لكل نمط */
function archStats(){
  const acc={}; AK.forEach(k=>acc[k]={u:[],e:[]});
  R.list.forEach((c,ci)=>{const a=R.ans[ci];
    c.r.forEach((rr,k)=>{ if(a[k]&&acc[rr.a]){acc[rr.a].u.push(a[k]);acc[rr.a].e.push(rr.k)} })});
  return AK.map(k=>({k:k,n:acc[k].u.length,gap: acc[k].u.length? mean(acc[k].u)-mean(acc[k].e):0,
    you: mean(acc[k].u), exp: mean(acc[k].e)})).filter(x=>x.n>=3);
}
/* الإيقاع: الزمن مقابل الدقة، ومنحنى الإرهاق */
function pacing(){
  const per=R.list.map((c,i)=>({sec:R.spent[i],pct:caseScore(i).pct,n:caseScore(i).n,t:c.t,i:i}))
                  .filter(x=>x.n>0);
  if(!per.length) return null;
  const m=med(per.map(x=>x.sec));
  const rushed=per.filter(x=>x.sec < m*0.5 && x.pct < 0.75);
  const slow  =per.filter(x=>x.sec > m*2   && x.pct < 0.85);
  const h=Math.ceil(per.length/2);
  return {per:per, med:m, rushed:rushed, slow:slow,
    first: mean(per.slice(0,h).map(x=>x.pct)), second: mean(per.slice(h).map(x=>x.pct))};
}
/* المعايرة: الدقة عند كل مستوى ثقة */
function calib(){
  const g={1:[],2:[],3:[]};
  R.list.forEach((c,i)=>{const cf=R.conf[i], s=caseScore(i); if(cf&&s.n)g[cf].push(s.pct)});
  const tot=g[1].length+g[2].length+g[3].length;
  if(tot<3) return null;
  const over = g[3].length? g[3].filter(p=>p<0.6).length/g[3].length : 0;
  const under= g[1].length? g[1].filter(p=>p>=0.85).length/g[1].length : 0;
  return {g:g, n:tot, over:over, under:under,
    a1:mean(g[1]), a2:mean(g[2]), a3:mean(g[3])};
}

 {min:.80,n:'حكم متقدّم',s:'قراءتك للمواقف ناضجة ومستقرة. الفجوة المتبقية في الفروق الدقيقة: التمييز بين «فعّال» و«فعّال جدًا» حيث يفصل بينهما تفصيل واحد.'},

];
const bandOf=p=>BANDS.find(b=>p>=b.min);

/* ══════════════ إنهاء الجولة وجدولة المراجعة ══════════════ */
function finish(){
  stopTick();
  const st=runStats(), p=P(), today=ymd();
  R.list.forEach((c,i)=>{
    const s=caseScore(i); if(!s.n)return;
    const r=p.cases[c.id]||{box:0,tries:0,best:0};
    r.tries=(r.tries||0)+1; r.last=s.pct; r.best=Math.max(r.best||0,s.pct);
    r.sec=Math.round(R.spent[i]); r.conf=R.conf[i]||0; r.ts=Date.now();
    r.missBest = bestPicked(i)===false;
    r.box = s.pct>=0.85 ? Math.min(5,(r.box||0)+1) : (s.pct>=0.6 ? (r.box||0) : 0);
    r.due = Date.now()+BOXD(r.box)*DAY;
    p.cases[c.id]=r;
  });
  p.runs.push({ts:Date.now(),mode:R.mode,lvl:R.lvl,pct:st.pct,n:st.answered,secs:st.secs});
  if(p.runs.length>80) p.runs=p.runs.slice(-80);
  /* السلسلة */
  const s0=p.streak;
  if(s0.last!==today){
    s0.n = (s0.last && daysBetween(s0.last,today)===1) ? s0.n+1 : 1;
    s0.last=today; s0.best=Math.max(s0.best||0,s0.n);
  }
  /* خطة التدريب */
  if(R.planDay && p.plan && p.plan.days[R.planDay-1]) p.plan.days[R.planDay-1].done=true;
  save();
  const st2=runStats(); const RR=R;
  if(R.sim){ SIM.judDone(st2,RR); return }
  go('jud-result');
}

function scatter(pts,medSec){
  const w=460,h=250,L=34,Rr=12,T=14,B=30;
  const maxS=Math.max(Math.max.apply(null,pts.map(p=>p.sec))*1.12, medSec*1.6, 5);
  const X=s=>w-Rr-(w-L-Rr)*clamp(s/maxS,0,1);            /* من اليمين لليسار */
  const Y=v=>T+(h-T-B)*(1-clamp(v,0,1));
  let g='<rect class="fr" x="'+Rr+'" y="'+T+'" width="'+(w-L-Rr)+'" height="'+(h-T-B)+'"/>';
  g+='<line class="md" x1="'+X(medSec).toFixed(1)+'" y1="'+T+'" x2="'+X(medSec).toFixed(1)+'" y2="'+(h-B)+'"/>';
  g+='<text class="lb2" x="'+X(medSec).toFixed(1)+'" y="'+(h-B+13)+'" text-anchor="middle">الوسيط '+mmss(medSec)+'</text>';
  [0,.5,1].forEach(v=>{g+='<text class="lb2" x="'+(w-L/2)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="middle">'+Math.round(v*100)+'٪</text>'});
  g+='<text class="lb2" x="'+(Rr+18)+'" y="'+(h-B+13)+'" text-anchor="middle">أبطأ</text>';
  pts.forEach(p=>{g+='<circle class="pt2'+(p.pct<0.6?' bad':'')+'" cx="'+X(p.sec).toFixed(1)+'" cy="'+Y(p.pct).toFixed(1)+'" r="4"><title>'+E(p.t)+' — '+mmss(p.sec)+' · '+Math.round(p.pct*100)+'٪</title></circle>'});
  return '<svg class="scat" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="الزمن مقابل الدقة">'+g+'</svg>';
}

/* ══════════════ إحصاءات محفوظة ══════════════ */
function lvlProgress(l){
  const ids=BYLVL[l].map(c=>c.id), done=ids.filter(id=>rec(id));
  return {done:done.length, all:ids.length, pct: done.length? mean(done.map(id=>rec(id).best||0)) : 0};
}
function overall(){
  const ids=Object.keys(P().cases);
  return {seen:ids.length, all:CASES.length, pct: ids.length? mean(ids.map(id=>P().cases[id].best||0)) : 0};
}

function makePlan(){ P().plan={start:ymd(), days:PLAN_T.map(d=>Object.assign({done:false},d))}; save(); }
function planToday(){
  const pl=P().plan; if(!pl)return null;
  const idx=Math.min(PLAN_T.length-1, Math.max(0, daysBetween(pl.start, ymd())));
  const first=pl.days.findIndex(d=>!d.done);
  const i = first<0 ? -1 : Math.min(first, idx);
  return i<0? null : {i:i, day:pl.days[i]};
}
function startPlanDay(i){
  const d=P().plan.days[i], cfg={lvl:d.lvl, planDay:i+1};
  let mode=d.mode;
  if(mode==='due'  && !dueList().length)  mode = weakList().length? 'weak' : 'study';
  if(mode==='weak' && !weakList().length) mode = dueList().length ? 'due'  : 'study';
  if(mode==='study'){
    if(!cfg.lvl) cfg.lvl = (freshList()[0]||CASES[0]).lvl;
    cfg.list = shuf(freshList().filter(c=>c.lvl===cfg.lvl).concat(BYLVL[cfg.lvl])).slice(0,d.n||10);
  }
  startRun(mode,cfg);
}

    h+='<div class="card" style="margin-top:14px"><div class="eb">تحليل الإيقاع</div>'+
      '<h3 style="margin-top:7px">الزمن مقابل الدقة</h3>'+
      '<p class="hint">كل نقطة موقف. الأيمن أسرع والأيسر أبطأ؛ الأحمر دقّته دون ٦٠٪. الخط المتقطع وسيط زمنك.</p>'+
      (pc.per.length>=3? scatter(pc.per, pc.med) : '')+
      '<div class="tiles" style="margin-top:16px">'+
       '<div class="tile"><div class="v">'+mmss(pc.med)+'</div><div class="k">وسيط الزمن للموقف</div></div>'+
       '<div class="tile"><div class="v">'+pc.rushed.length+'</div><div class="k">مواقف استعجلتها فأخطأت</div></div>'+
       '<div class="tile"><div class="v">'+pc.slow.length+'</div><div class="k">مواقف استنزفت وقتك</div></div>'+
       '<div class="tile"><div class="v">'+(drop>0?'−':'+')+Math.abs(Math.round(drop*100))+'٪</div><div class="k">فرق النصف الثاني</div></div>'+
      '</div>';
    let say;
    if(pc.rushed.length>=2) say='استعجلت '+pc.rushed.length+' مواقف ودفعت ثمنها دقةً. الوقت هنا مفتوح ولا شيء يستعجلك — والقراءة الثانية للموقف هي التي تلتقط القيد المخفي غالبًا.';
    else if(pc.slow.length>=2) say='استنزفت وقتًا كبيرًا في '+pc.slow.length+' مواقف دون مردود في الدقة. حين تتجاوز ضعف وسيط زمنك، غالبًا لن يغيّر التفكير الإضافي تقديرك — احسم وانتقل.';
    else if(drop>0.12) say='دقّتك في النصف الثاني أقل بـ'+Math.round(drop*100)+'٪. هذا إرهاق لا نقص قدرة، وعلاجه التدريب على جولات بطول الاختبار الفعلي لا على مواقف متفرقة.';
    else say='إيقاعك متّزن: لا استعجال مكلف ولا استنزاف بلا مردود، ودقّتك لا تنهار في النصف الثاني. هذا نصف نجاح الاختبار.';
    h+='<p style="color:var(--ink-2);line-height:1.95;margin:16px 0 0">'+E(say)+'</p></div>';
  }

  /* ── نمط الحكم ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">تحليل نمط الحكم</div>'+
   '<h3 style="margin-top:7px">كيف تحكم، لا كم أصبت فقط</h3>'+
   '<p class="hint">أربعة مؤشرات تصف أسلوبك في التقدير مقارنةً بلجنة الخبراء.</p>';
  const leanPos=clamp((st.lean+1.5)/3,0,1);
  const leanName= st.lean>.35?'ميل إلى التساهل': st.lean<-.35?'ميل إلى التشدّد':'تقدير متوازن';
  const leanSay = st.lean>.35
    ? 'تمنح الردود تقديرات أعلى من لجنة الخبراء بمقدار '+Math.abs(st.lean).toFixed(2)+' درجة وسطيًا. الخطر أنك تقبل ردودًا «معقولة الشكل» فيها خلل جوهري — راجع الردود التي قدّرها الخبراء ١ وقدّرتها أنت ٣.'
    : st.lean<-.35
    ? 'تمنح الردود تقديرات أقل من لجنة الخبراء بمقدار '+Math.abs(st.lean).toFixed(2)+' درجة وسطيًا. الخطر أنك ترفض ردودًا فعّالة لأنها ليست مثالية، فتضيع منك الفروق بين الجيد والأفضل.'
    : 'مستوى تقديرك العام يطابق لجنة الخبراء تقريبًا — لا تتساهل ولا تتشدّد. هذا أصعب المؤشرات ضبطًا وأثمنها.';
  h+='<div class="bias"><div class="bh"><div class="bt">مستوى التقدير</div><span class="chip gd">'+E(leanName)+'</span></div>'+
     '<div class="bs">'+E(leanSay)+'</div>'+scaleline(leanPos,'متساهل','متشدّد',.383,.617)+'</div>';
  const spPos=clamp((st.spread-.4)/1.2,0,1);
  const spName= st.spread<.75?'تقدير مركزي': st.spread>1.3?'تقدير حادّ':'تمييز متّزن';
  const spSay = st.spread<.75
    ? 'تقديراتك متقاربة ومتكدّسة في الوسط. المقيّم يريد منك أن تفصل بوضوح بين الردّ الممتاز والردّ الضار؛ التردد في استخدام طرفي السلّم يكلّف نقاطًا في كل موقف.'
    : st.spread>1.3
    ? 'تستخدم طرفي السلّم أكثر من لجنة الخبراء. الحسم ميزة، لكن بعض الردود «فعّالة جزئيًا» فعلًا — وإعطاؤها ١ أو ٤ يفقدك دقة الفروق الوسطى.'
    : 'توزّع تقديراتك على السلّم بالقدر نفسه الذي توزّعه اللجنة: تحسم في الواضح وتتدرّج في المتقارب.';
  h+='<div class="bias"><div class="bh"><div class="bt">مدى التمييز</div><span class="chip gd">'+E(spName)+'</span></div>'+
     '<div class="bs">'+E(spSay)+'</div>'+scaleline(spPos,'حادّ','مركزي',.25,.55)+'</div>';
  const rkName= st.rank>=.85?'ترتيب ممتاز': st.rank>=.7?'ترتيب سليم':'ترتيب مضطرب';
  h+='<div class="bias"><div class="bh"><div class="bt">اتساق الترتيب</div><span class="chip gd">'+E(rkName)+' · '+Math.round(st.rank*100)+'٪</span></div>'+
     '<div class="bs">من كل زوج من الردود داخل الموقف الواحد، هذه نسبة الأزواج التي رتّبتها بالاتجاه نفسه الذي رتّبته به اللجنة. يقيس قدرتك على المفاضلة بغضّ النظر عن مستوى تقديرك العام.</div>'+
     lines([{a:'أزواج متوافقة',v:st.rank}])+'</div>';
  h+='<div class="bias"><div class="bh"><div class="bt">طرفا السلّم</div><span class="chip gd">'+Math.round((st.top+st.low)/2*100)+'٪</span></div>'+
     '<div class="bs">الطرفان هما ما يفصل المرشّحين: التقاط الردّ الفعّال جدًا، وكشف الردّ الضار قبل أن يبدو معقولًا.</div>'+
     lines([{a:'التقاط الردّ الأفضل',v:st.top,c:'linear-gradient(90deg,var(--e4),var(--e3))'},
            {a:'كشف الردّ الضار',v:st.low,c:'linear-gradient(90deg,var(--e1),var(--e2))'}])+'</div></div>';

  /* ── أنماط الردّ ── */
  if(ar.length>=4){
    const sorted=ar.slice().sort((a,b)=>b.gap-a.gap);
    const traps=sorted.filter(x=>x.gap>0.25).slice(0,3);
    h+='<div class="card" style="margin-top:14px"><div class="eb">أنماط الردّ</div>'+
      '<h3 style="margin-top:7px">أيّ نوع من الحلول يغريك</h3>'+
      '<p class="hint">كل ردّ في البنك مصنّف إلى نمط سلوكي. هذا يقارن تقديرك لكل نمط بتقدير اللجنة له.</p>';
    if(traps.length){
      h+='<div class="acts">';
      traps.forEach((t,i)=>{h+='<div class="act" style="cursor:default"><div class="no2">'+AI(i+1)+'</div>'+
        '<div><div class="at">'+E(ARCHS[t.k].n)+' <span class="chip gd">+'+t.gap.toFixed(2)+'</span></div>'+
        '<div class="as">'+E(ARCHS[t.k].hi!=='—'?ARCHS[t.k].hi:ARCHS[t.k].d)+'</div></div></div>'});
      h+='</div>';
    } else {
      h+='<p style="color:var(--ink-2);line-height:1.95;margin:12px 0 0">لا يوجد نمط تُفرط في تقديره في هذه الجولة — تقييمك لكل نوع من الحلول قريب من تقييم اللجنة. هذه نتيجة نادرة ومطلوبة.</p>';
    }
    h+='<div class="tbw" style="margin-top:16px"><table class="tb"><thead><tr><th>النمط</th><th>ردود</th><th>تقديرك</th><th>الخبراء</th><th>الفارق</th></tr></thead><tbody>';
    sorted.forEach(x=>{h+='<tr><td class="s">'+E(ARCHS[x.k].n)+'</td><td>'+x.n+'</td><td>'+x.you.toFixed(2)+'</td><td>'+x.exp.toFixed(2)+'</td>'+
      '<td style="color:'+(Math.abs(x.gap)<.25?'var(--ink-2)':(x.gap>0?'var(--e2)':'var(--e3)'))+'">'+(x.gap>0?'+':'')+x.gap.toFixed(2)+'</td></tr>'});
    h+='</tbody></table></div></div>';
  }

  /* ── المعايرة ── */
  if(cal){
    const nm = cal.over>=.34?'ثقة زائدة': cal.under>=.5?'تقليل من شأن نفسك':'معايرة سليمة';
    const sy = cal.over>=.34
      ? 'في '+Math.round(cal.over*100)+'٪ من المواقف التي قلت إن ثقتك فيها عالية، جاءت دقّتك دون ٦٠٪. الثقة الزائدة أخطر من الجهل لأنها تُغلق باب المراجعة — وهي أخطر نمط في القيادة الفعلية لا في الاختبار وحده.'
      : cal.under>=.5
      ? 'في '+Math.round(cal.under*100)+'٪ من المواقف التي قلت إن ثقتك فيها منخفضة، كانت دقّتك ممتازة. حكمك أفضل مما تظن، والتردّد يكلّفك وقتًا في الاختبار لا درجات.'
      : 'ثقتك تتبع دقّتك: تثق حيث تصيب وتتردّد حيث تخطئ. هذه المعايرة هي ما يجعل القائد يعرف متى يسأل ومتى يحسم.';
    h+='<div class="card" style="margin-top:14px"><div class="eb">معايرة الثقة</div>'+
      '<h3 style="margin-top:7px">هل تعرف متى تكون مخطئًا؟</h3>'+
      '<p class="hint">مبنية على '+cal.n+' موقفًا قدّرت ثقتك فيها.</p>'+
      '<div class="bias"><div class="bh"><div class="bt">'+E(nm)+'</div></div><div class="bs">'+E(sy)+'</div>'+
      lines([{a:'ثقة عالية',v:cal.a3||0,txt:cal.g[3].length?Math.round((cal.a3||0)*100)+'٪':'—'},
             {a:'ثقة متوسطة',v:cal.a2||0,txt:cal.g[2].length?Math.round((cal.a2||0)*100)+'٪':'—'},
             {a:'ثقة منخفضة',v:cal.a1||0,txt:cal.g[1].length?Math.round((cal.a1||0)*100)+'٪':'—'}])+
      '</div></div>';
  }

  /* ── الكفايات ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">خريطة الكفايات</div>'+
   '<h3 style="margin-top:7px">الكفايات الثماني</h3>'+
   '<p class="hint">النقاط المجوّفة والأسماء الباهتة تعني كفايات لم تُقَس في هذه الجولة — لا ضعفًا فيها.</p>'+
   radar(items)+
   (missing.length?'<p class="hint" style="margin:8px 0 14px">لم تُقَس في هذه الجولة: '+E(missing.join('، '))+'.</p>':'<div style="height:10px"></div>')+
   lines(items.filter(i=>i.has).sort((a,b)=>b.v-a.v).map(i=>({a:i.lb,v:i.v})))+'</div>';

  /* ── جدول المواقف ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">تفصيل المواقف</div><h3 style="margin-top:7px">موقفًا بموقف</h3>'+
   '<div class="tbw" style="margin-top:12px"><table class="tb"><thead><tr><th>#</th><th>الموقف</th><th>النقاط</th><th>الزمن</th><th>الأفضل</th><th>الأسوأ</th></tr></thead><tbody>';
  R.list.forEach((c,i)=>{const s=st.per[i];
    h+='<tr><td>'+(i+1)+'</td><td class="s">'+E(c.t)+'</td><td>'+s.got+'/'+MAXC+'</td><td>'+mmss(R.spent[i])+'</td>'+
      '<td>'+(bestPicked(i)===null?'—':(bestPicked(i)?'✓':'✕'))+'</td>'+
      '<td>'+(worstSpotted(i)===null?'—':(worstSpotted(i)?'✓':'✕'))+'</td></tr>'});
  h+='</tbody></table></div></div>';

  /* ── المراجعة ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">المراجعة</div><h3 style="margin-top:7px">تقدير الخبراء لكل ردّ</h3>'+
   '<p class="hint">المسوّغات هي المادة التعليمية الحقيقية — اقرأ مسوّغ الردّ الذي أخطأت فيه قبل أي شيء آخر.</p>';
  R.list.forEach((c,i)=>{
    const a=R.ans[i], s=st.per[i], mk=P().marks[c.id];
    h+='<div class="entry"><div class="eh"><div class="et">'+(i+1)+'. '+E(c.t)+'</div>'+
      '<div style="display:flex;gap:7px;align-items:center"><span class="chip gd">'+s.got+'/'+MAXC+'</span>'+
      '<button class="star'+(mk?' on':'')+'" data-mark="'+E(c.id)+'" title="حفظ الموقف">★</button></div></div>'+
      '<div class="ec">'+E(c.s)+'</div><details><summary>تقدير الخبراء والمسوّغات</summary>';
    c.r.forEach((rr,k)=>{
      const u=a[k]||0, d=u?Math.abs(u-rr.k):null;
      h+='<div class="mini"><div>'+E(rr.t)+'</div><div class="mt">'+
        '<span class="seal s'+rr.k+'">الخبراء: '+E(RATE[rr.k].s)+'</span>'+
        '<span class="chip">'+E(ARCHS[rr.a].n)+'</span>'+
        (u?'<span class="delta '+(d===0?'ok':d===1?'nr':'no')+'">أنت: '+E(RATE[u].s)+' · '+PTS(u,rr.k)+'/3</span>':'<span class="delta no">لم تُقدَّر</span>')+
        '</div><div class="rsn" style="margin-top:6px">'+E(rr.w)+'</div></div>';
    });
    h+='<div class="axiom" style="margin-top:12px"><div class="t">الدرس</div>'+E(c.l)+'</div>'+
       '<div class="nlab">ملاحظتك:</div><textarea class="note" data-cid="'+E(c.id)+'" placeholder="اكتب الدرس بكلماتك.">'+E(P().notes[c.id]||'')+'</textarea>'+
       '</details></div>';
  });
  h+='</div>';

  h+='<div class="brow noprint">'+
   '<button class="b g" data-again="1">أعد الجولة بترتيب جديد</button>'+
   '<button class="b o" data-go="jud">الرئيسية</button>'+
   '<button class="b o" data-go="jud-record">سجلّ التقدّم</button>'+
   '<button class="b q" data-share="1">حفظ بطاقة النتيجة</button>'+
   '<button class="b q" data-print="1">طباعة التقرير</button></div>';
  return h+FOOT;
}

/* بطاقة نتيجة قابلة للحفظ والمشاركة */
function shareCard(){
  const st=runStats(), b=bandOf(st.pct);
  const cv=document.createElement('canvas'); cv.width=1200; cv.height=630;
  const x=cv.getContext('2d');
  const dark=document.documentElement.getAttribute('data-theme')!=='light';
  const bg=dark?'#08090d':'#f2f1ed', ink=dark?'#eff2f7':'#15171c', sub=dark?'#a9b1bf':'#4c525d', gold='#c9a86a';
  x.fillStyle=bg; x.fillRect(0,0,1200,630);
  const gr=x.createRadialGradient(980,40,0,980,40,520);
  gr.addColorStop(0,'rgba(201,168,106,.16)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr; x.fillRect(0,0,1200,630);
  x.direction='rtl'; x.textAlign='right';
  x.fillStyle=gold; x.font='600 22px "IBM Plex Sans Arabic",sans-serif';
  x.fillText('Leadership Test Ability',1130,86);
  x.fillStyle=sub; x.font='500 18px "IBM Plex Sans Arabic",sans-serif';
  x.fillText('منصّة الحكم على المواقف القيادية',1130,120);
  x.strokeStyle=gold; x.globalAlpha=.35; x.beginPath(); x.moveTo(1130,146); x.lineTo(700,146); x.stroke(); x.globalAlpha=1;
  /* المؤشر */
  const cx=280,cy=330,r=120;
  x.lineWidth=18; x.strokeStyle=dark?'#181c25':'#e2ded6';
  x.beginPath(); x.arc(cx,cy,r,0,2*Math.PI); x.stroke();
  x.strokeStyle=gold; x.lineCap='round';
  x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+2*Math.PI*clamp(st.pct,0,1)); x.stroke();
  x.textAlign='center'; x.fillStyle=ink; x.font='700 82px "IBM Plex Sans Arabic",sans-serif';
  x.fillText(Math.round(st.pct*100)+'',cx,cy+22);
  x.fillStyle=sub; x.font='500 20px "IBM Plex Sans Arabic",sans-serif'; x.fillText('من ١٠٠',cx,cy+58);
  /* النص */
  x.textAlign='right'; x.fillStyle=ink; x.font='700 46px "IBM Plex Sans Arabic",sans-serif';
  x.fillText(b.n,1130,260);
  x.fillStyle=sub; x.font='500 22px "IBM Plex Sans Arabic",sans-serif';
  x.fillText(MODEN(R.mode)+(R.lvl?' · '+LEVELS.find(l=>l.id===R.lvl).n:''),1130,305);
  const rows=[['مواقف',st.answered+' / '+st.total],['التقاط الردّ الأفضل',Math.round(st.best*100)+'٪'],
              ['اتساق الترتيب',Math.round(st.rank*100)+'٪'],['الزمن',mmss(st.secs)]];
  rows.forEach((rw,i)=>{const y=370+i*46;
    x.fillStyle=sub; x.font='500 22px "IBM Plex Sans Arabic",sans-serif'; x.fillText(rw[0],1130,y);
    x.fillStyle=gold; x.font='700 24px "IBM Plex Sans Arabic",sans-serif'; x.fillText(rw[1],830,y);});
  x.fillStyle=sub; x.globalAlpha=.75; x.font='500 17px "IBM Plex Sans Arabic",sans-serif';
  x.textAlign='center'; x.fillText('© ALFALASI26481',600,596);
  try{
    const a=document.createElement('a');
    a.download='LTA-'+Math.round(st.pct*100)+'.png'; a.href=cv.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('تعذّر حفظ البطاقة على هذا المتصفح.'); }
}

/* ══════════════ المكتبة ══════════════ */
function vLibrary(){
  const f=V.f||0, q=(V.q||'').trim(), only=V.only||'';
  let list = f? BYLVL[f].slice() : CASES.slice();
  if(only==='mark') list=list.filter(c=>P().marks[c.id]);
  if(only==='note') list=list.filter(c=>P().notes[c.id]);
  if(q) list=list.filter(c=>(c.t+' '+c.s+' '+c.l).indexOf(q)>=0);

  let h='<div class="eb">مرجع مفتوح</div>'+
   '<h1 style="font-family:var(--d);font-size:clamp(24px,6.2vw,32px);margin-top:8px">مكتبة المواقف</h1>'+
   '<p style="color:var(--ink-2);max-width:60ch;margin:10px 0 20px;line-height:1.95">المئة والعشرون موقفًا كاملةً مع تقدير لجنة الخبراء لكل ردّ ومسوّغه ونمطه ودرس الموقف. لا قفل ولا شرط — اقرأ ما شئت متى شئت.</p>';

  h+='<div class="filter"><button class="'+(!f&&!only?'act':'')+'" data-f="0">الكل · '+CASES.length+'</button>';
  LEVELS.forEach(l=>h+='<button class="'+(f===l.id?'act':'')+'" data-f="'+l.id+'">'+E(l.n)+' · '+BYLVL[l.id].length+'</button>');
  const nm=CASES.filter(c=>P().marks[c.id]).length, nn=CASES.filter(c=>P().notes[c.id]).length;
  if(nm) h+='<button class="'+(only==='mark'?'act':'')+'" data-only="mark">★ المحفوظة · '+nm+'</button>';
  if(nn) h+='<button class="'+(only==='note'?'act':'')+'" data-only="note">ملاحظاتي · '+nn+'</button>';
  h+='</div>';
  h+='<div style="margin-bottom:16px"><input id="q" value="'+E(q)+'" placeholder="ابحث في المواقف…" '+
     'style="width:100%;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--b);font-size:14px"></div>';

  if(!list.length) h+='<div class="blank"><div class="g">❖</div><p>لا نتائج مطابقة.</p></div>';
  list.forEach(c=>{
    const r=rec(c.id), mk=P().marks[c.id];
    h+='<div class="entry"><div class="eh"><div class="et">'+E(c.t)+'</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
      '<span class="chip">'+E(c.id)+'</span>'+
      (r?'<span class="chip gd">أفضل: '+Math.round((r.best||0)*100)+'٪</span>':'')+
      c.c.map(k=>'<span class="chip sh">'+E(COMPS[k].n)+'</span>').join('')+
      '<button class="star'+(mk?' on':'')+'" data-mark="'+E(c.id)+'" title="حفظ الموقف">★</button></div></div>'+
      '<div class="ec">'+E(c.s)+'</div><details><summary>الردود الأربعة وتقدير الخبراء</summary>';
    c.r.slice().sort((x,y)=>y.k-x.k).forEach(rr=>{
      h+='<div class="mini"><div>'+E(rr.t)+'</div><div class="mt"><span class="seal s'+rr.k+'">'+E(RATE[rr.k].n)+'</span>'+
        '<span class="chip">'+E(ARCHS[rr.a].n)+'</span></div>'+
        '<div class="rsn" style="margin-top:6px">'+E(rr.w)+'</div></div>'});

       '<div class="nlab">ملاحظتك:</div><textarea class="note" data-cid="'+E(c.id)+'" placeholder="اكتب الدرس بكلماتك.">'+E(P().notes[c.id]||'')+'</textarea>'+
       '</details></div>';
  });
  h+='<div class="brow"><button class="b o" data-go="jud">← الرئيسية</button></div>';

  const due=dueList(), soon=CASES.filter(c=>{const r=rec(c.id);return r&&r.due&&r.due>Date.now()&&r.due<Date.now()+7*DAY});
  h+='<div class="card" style="margin-top:14px"><div class="eb">التكرار المتباعد</div>'+
   '<h3 style="margin-top:7px">جدول المراجعة</h3>'+
   '<p class="hint">كل موقف تتقنه يبتعد موعد إعادته (١ ← ٣ ← ٧ ← ١٤ ← ٣٠ ← ٦٠ يومًا)، وكل موقف تتعثّر فيه يعود غدًا.</p>'+
   '<div class="tiles" style="margin-top:14px">'+
    '<div class="tile"><div class="v">'+due.length+'</div><div class="k">مستحق الآن</div></div>'+

    '<div class="tile"><div class="v">'+freshList().length+'</div><div class="k">لم تُخَض بعد</div></div>'+
   '</div>';
  if(due.length) h+='<div class="brow"><button class="b g" data-run="due">ابدأ المراجعة المستحقة ('+due.length+')</button></div>';
  h+='</div>';

  /* الكفايات التراكمية */
  const acc={}; CK.forEach(k=>acc[k]={g:0,m:0});
  CASES.forEach(c=>{const r=rec(c.id); if(!r)return; c.c.forEach(k=>{acc[k].g+=(r.best||0);acc[k].m+=1})});
  const items=CK.map(k=>({lb:COMPS[k].n,v:acc[k].m?acc[k].g/acc[k].m:0,has:acc[k].m>0}));

    h+='</tbody></table></div></div>';
  } else h+='<div class="blank"><div class="g">◴</div><p>لم تُسجَّل جولات بعد. ابدأ من أي مستوى — جميعها مفتوحة.</p></div>';

  h+='<div class="brow"><button class="b o" data-go="jud">← الرئيسية</button>'+
     '<button class="b o" data-go="settings">الملف والنسخ الاحتياطي</button></div>';
  return h+FOOT;

BINDS.push(function(){
  if(V.v.indexOf('jud')!==0)return;
  $$('[data-lvl]').forEach(b=>b.onclick=()=>go('jud-level',{lvl:+b.dataset.lvl}));
  $$('[data-mode]').forEach(b=>b.onclick=()=>startRun(b.dataset.mode,{lvl:V.lvl}));
  $$('[data-run]').forEach(b=>b.onclick=()=>startRun(b.dataset.run,{}));
  $$('[data-planday]').forEach(b=>b.onclick=()=>startPlanDay(+b.dataset.planday));
  $$('[data-newplan]').forEach(b=>b.onclick=()=>{
    if(P().plan && !confirm('ستبدأ خطة جديدة ويُمسح تتبّع الخطة الحالية. متابعة؟')) return;
    makePlan(); go('jud-plan');
  });
  $$('[data-f]').forEach(b=>b.onclick=()=>go('jud-library',{f:+b.dataset.f,q:V.q||''}));
  $$('[data-only]').forEach(b=>b.onclick=()=>go('jud-library',{only:b.dataset.only,q:V.q||''}));
  $$('[data-print]').forEach(b=>b.onclick=()=>window.print());
  $$('[data-share]').forEach(b=>b.onclick=()=>shareCard());
  $$('[data-again]').forEach(b=>b.onclick=()=>startRun(R.mode,{lvl:R.lvl,list:R.list}));
  $$('[data-fixcomp]').forEach(b=>b.onclick=()=>startRun('fix',
    {list:casesForComp(b.dataset.fixcomp,8), label:'جولة علاجية · '+COMPS[b.dataset.fixcomp].n}));
  $$('[data-fixworst]').forEach(b=>b.onclick=()=>{
    const w=R.list.map((c,i)=>({c:c,s:caseScore(i)})).filter(x=>x.s.n).sort((a,b2)=>a.s.pct-b2.s.pct).slice(0,3).map(x=>x.c);
    startRun('fix',{list:w,label:'إعادة المواقف الأضعف'});
  });
  $$('[data-mark]').forEach(b=>b.onclick=function(){
    const id=b.dataset.mark, m=P().marks;
    if(m[id]) delete m[id]; else m[id]=1;
    b.classList.toggle('on',!!m[id]); save();
  });
  $$('textarea.note').forEach(t=>{
    let z=null;
    t.oninput=()=>{clearTimeout(z);z=setTimeout(()=>{
      const id=t.dataset.cid, v=t.value.trim();
      if(v) P().notes[id]=v; else delete P().notes[id];
      save();

  const db=p.dbx.runs.slice(-1)[0]; if(db){const w=DB_KEYS.slice().sort((x,y)=>db.traits[y]-db.traits[x])[0]; r.dbx={ri:p.dbx.runs.length-1,safety:db.safety,readable:db.readable,worst:w,worstV:db.traits[w]}}
  const jr=p.runs.filter(x=>x.mode==='exam').slice(-1)[0]; const ov=JUD.overall();
  if(ov.seen){ const cases=Object.keys(p.cases); const cs={}; CK.forEach(k=>cs[k]={g:0,m:0}); cases.forEach(id=>{const c=JUD.BYID[id]; if(!c)return; c.c.forEach(k=>{if(cs[k]){cs[k].g+=p.cases[id].best||0;cs[k].m+=1}})}); const weak=CK.filter(k=>cs[k].m).sort((x,y)=>cs[x].g/cs[x].m-cs[y].g/cs[y].m)[0];
    const miss=cases.filter(id=>p.cases[id].missBest).length; r.jud={pct:jr?jr.pct:ov.pct,n:jr?jr.n:ov.seen,secs:jr?jr.secs:0,weak:weak||null,low:cases.length?1-miss/cases.length:0,exam:!!jr} }
  return r;
}
VIEWS.report=function(){
  const p=P(), r=reportResults(), rd=readiness(r), b=readyBand(rd.v), any=Object.keys(r).length;
  let h=h1('تقرير المرشّح','صورتك الموحّدة من الأدوات الأربع','يُبنى من آخر نتيجة في كل أداة. للتقرير الأدقّ أجرِ المحاكاة الشاملة.');
  h+=art('report',1);
  if(!any) return h+'<div class="blank" style="margin-top:18px"><div class="g">—</div><p>لا نتائج بعد. أكمل أداة واحدة على الأقل، أو ابدأ المحاكاة الشاملة.</p></div><div class="brow"><button class="b g" data-go="sim">المحاكاة الشاملة</button><button class="b o" data-go="home">← الرئيسية</button></div>'+FOOT;
  h+='<div class="card" style="margin-top:18px"><div class="eb">مؤشر الجاهزية'+(rd.cov<1?' · جزئي ('+AI(Math.round(rd.cov*100))+'٪ من الأدوات)':'')+'</div><div class="ready"><div class="rn" style="color:'+b[1]+'">'+AI(Math.round(rd.v*100))+'</div><div class="rt"><b style="color:'+b[1]+'">'+E(b[0])+'</b><br>'+(rd.cov<1?'أدوات لم تُقَس بعد: '+SIM_STEPS.filter(s=>!r[s[0]]).map(s=>s[1]).join('، ')+'.':'الأدوات الأربع مقيسة.')+' سلسلة التدريب: '+AI(p.streak.n||0)+' يومًا.</div></div></div>';
  h+='<div class="card" style="margin-top:14px">'+tiles([{v:r.gcat?AI(Math.round(r.gcat.pct*100))+'٪':'—',k:'القدرات'},{v:r.pq?(r.pq.readable?'✓':'✕'):'—',k:'الشخصية'},{v:r.dbx?AI(Math.round(r.dbx.safety*100)):'—',k:'سلامة السلوكيات'},{v:r.jud?AI(Math.round(r.jud.pct*100))+'٪':'—',k:'الحكم'}])+'</div>';
  h+=card('أهم ثلاث خطوات','ما الذي تفعله الآن',null,fixesHTML(fixesFrom(r)));
  if(r.gcat)h+=card('القدرات',r.gcat.mode==='test'?'آخر اختبار رسمي':'آخر تدريب',null,lines(GDOMS.map(d=>({a:GDOM[d].s,v:r.gcat.per[d][1]?r.gcat.per[d][0]/r.gcat.per[d][1]:0,txt:AI(r.gcat.per[d][0])+' / '+AI(r.gcat.per[d][1])})))+'<div class="brow"><button class="b o" data-go="gcat-record">السجل</button></div>');
  if(r.pq)h+=card('الشخصية',r.pq.readable?'بروفايل قابل للقراءة':'بروفايل مشكوك فيه',null,lines(PQ_GROUPS.map(g=>({a:g,v:r.pq.groups[g]})))+'<div class="brow"><button class="b o" data-go="pq-result">البروفايل</button></div>');
  if(r.dbx)h+=card('السلوكيات المعطّلة','مؤشر السلامة '+AI(Math.round(r.dbx.safety*100)),null,'<p style="color:var(--ink-2)">أعلى سمة: <b>'+E(DB_TRAITS[r.dbx.worst].name)+'</b> ('+dbxBand(r.dbx.worstV)+')</p><div class="brow"><button class="b o" data-go="dbx-result">التقرير</button></div>');
  if(r.jud)h+=card('الحكم على المواقف',r.jud.exam?'آخر اختبار شامل':'الإتقان التراكمي',null,lines([{a:'الدرجة',v:r.jud.pct},{a:'مواقف بلا خطأ في الأفضل',v:r.jud.low}])+(r.jud.weak?'<p class="hint" style="margin-top:8px">أضعف كفاية: '+E(COMPS[r.jud.weak].n)+'</p>':'')+'<div class="brow"><button class="b o" data-go="jud-record">السجل</button></div>');
  h+='<div class="brow"><button class="b g" data-go="sim">المحاكاة الشاملة</button><button class="b o" data-print="1">طباعة</button><button class="b q" data-go="home">← الرئيسية</button></div>';
  return h+FOOT;
};

VIEWS.guide=function(){

  h+=card('١ · القدرات — GCAT','٤٢ سؤالًا في ٢٠ دقيقة',null,'<p style="line-height:2;color:var(--ink-2)">ثلاثة مجالات بأربعة عشر سؤالًا لكل منها: <b>لفظي</b> (تناظر، الكلمة الشاذة، استنتاج من مقدمات، إكمال)، <b>عددي</b> (متتابعات، نسب، تناسب، متوسطات، سرعة، جداول، معادلات)، <b>تجريدي</b> (متتابعات بصرية، مصفوفات ٣×٣، الشكل الشاذ). الدرجة عدد الإجابات الصحيحة؛ لا خصم على الخطأ فلا تترك سؤالًا. في الذهبي كل خيار خاطئ موسوم بنوع الخطأ الذي يمثّله، والصعوبة تكيّفية لكل مجال.</p>');
  h+=card('٢ · الشخصية — PQ10','١٤٤ بندًا · ١٠ أبعاد · ٥ مجموعات',null,'<p style="line-height:2;color:var(--ink-2)">لا إجابة صحيحة. المقيّم يقارن البروفايل بمتطلبات الدور، لكنه يفحص أولًا صدق الاستجابة: <b>الاتساق</b> بين الأزواج المتشابهة، <b>التطرّف</b> (نسبة الطرفين)، <b>التحفّظ</b> (نسبة «محايد»)، <b>الإذعان</b> (الموافقة على البند وعكسه — ٤٩ بندًا معكوسًا)، و<b>الرغبة الاجتماعية</b> (صورة مثالية لا يصدّقها أحد). بروفايل متقلّب بين مرّتين يُقرأ أسوأ من بروفايل منخفض في سمة.</p>');
  h+=card('٣ · السلوكيات المعطّلة','٦٠ بندًا · ٦ سمات',null,'<p style="line-height:2;color:var(--ink-2)">تقيس ما يظهر تحت الضغط ويعطّل الأداء: التحفظ، الانفعالية، العدائية، الاندفاعية، الصرامة، اللامألوفية. كل سمة احتمال: آمن دون ٣٨٪، انتبه حتى ٦٢٪، خطر فوق ذلك. الإنكار الكامل يُقرأ تجميلًا لا سلامة. النسخة الموسّعة في الذهبي تضيف بنودًا معكوسة تكشف الموافقة الآلية.</p>');
  h+=card('٤ · الحكم على المواقف','١٦ موقفًا · ٤ ردود · مقياس رباعي',null,'<p style="line-height:2;color:var(--ink-2)">لكل موقف أربعة ردود تقدّر كلًّا منها على مقياس <b>رباعي</b> من «غير فعّال» إلى «فعّال جدًا». الدرجة قرب تقديرك من تقدير لجنة الخبراء لكل ردّ: ٣ نقاط للتطابق، وتنقص نقطة لكل درجة بُعد. ثمان كفايات واثنا عشر نمط حكم. الزمن مفتوح ويُقاس لتحليل الإيقاع فقط.</p><div class="brow"><button class="b o" data-go="jud-guide">دليل الحكم المفصّل</button></div>');
  h+=card('مؤشر الجاهزية','كيف يُحسب',null,'<p style="line-height:2;color:var(--ink-2)">قدرات ٣٥٪ (مع خصم إن تجاوز الزمن المرجع بربع) · حكم ٣٥٪ · صدق بروفايل الشخصية ١٥٪ (قابل للقراءة = كامل، بتحذير = ٨٠٪، مشكوك فيه = ٣٠٪) · سلامة السلوكيات ١٥٪. جاهز من ٨٠، قريب من ٦٥.</p>');
  h+='<div class="brow"><button class="b g" data-go="home">← الرئيسية</button></div>';
  return h+FOOT;
};
