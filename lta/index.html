  d:'مواقف المستوى كاملة، ٩٠ ثانية للموقف الواحد، بلا كشف حتى النهاية. الأقرب إلى ظرف الاختبار الفعلي.'},
 {id:'drill',n:'الجولة السريعة',g:'⚡',
  d:'ستة مواقف تُختار عشوائيًا من المستوى، ٦٠ ثانية لكل موقف. للمراجعة المكثّفة في وقت قصير.'},
];
const MODEN={study:'التدريب الموجَّه',sim:'محاكاة الاختبار',drill:'الجولة السريعة',exam:'الاختبار الشامل'};
const EXAM_N=16, EXAM_SEC=24*60, SIM_SEC=90, DRILL_SEC=60;

/* ══════════════ حالة العرض والجولة ══════════════ */
let V={v:'home'};
let R=null;            /* الجولة النشطة */
let TICK=null;

function go(v,o,fromHist){
  V=Object.assign({v:v},o||{});
  if(!fromHist){try{history.pushState({v:v,o:o||{}},'','')}catch(e){}}
  render();
  window.scrollTo({top:0,behavior:'instant' in document.documentElement.style?'instant':'auto'});
}
window.addEventListener('popstate',function(e){
  const st=e.state;
  if(st&&st.v){ V=Object.assign({v:st.v},st.o||{}); render(); }
  else { V={v:'home'}; render(); }
});
$('#hom').addEventListener('click',function(){ stopTick(); go('home'); });

/* ══════════════ بناء الجولة ══════════════ */
function startRun(mode,lvl){
  let pool;
  if(mode==='exam'){
    pool=[]; [1,2,3,4].forEach(l=>{ pool=pool.concat(shuf(BYLVL[l]).slice(0,EXAM_N/4)); });
    pool=shuf(pool);
  } else if(mode==='drill'){
    pool=shuf(BYLVL[lvl]).slice(0,6);
  } else {
    pool=shuf(BYLVL[lvl]);
  }
  R={
    mode:mode, lvl:lvl||0, list:pool, i:0,
    ord:pool.map(c=>shuf(c.r.map((_,k)=>k))),   /* ترتيب عرض الردود لكل موقف */
    ans:pool.map(()=>({})),                      /* {فهرس الردّ الأصلي: تقدير} */
    shown:pool.map(()=>false),
    act:0, t0:Date.now(), dl:0, spent:pool.map(()=>0), cs:Date.now(),
  };
  if(mode==='exam') R.dl=Date.now()+EXAM_SEC*1000;
  else if(mode==='sim') R.dl=Date.now()+SIM_SEC*1000;
  else if(mode==='drill') R.dl=Date.now()+DRILL_SEC*1000;
  go('run');
}
function stopTick(){ if(TICK){clearInterval(TICK);TICK=null} }

/* ══════════════ الحساب ══════════════ */
function caseScore(ci){
  const c=R.list[ci], a=R.ans[ci];
  let got=0, n=0;
  c.r.forEach((rr,k)=>{ if(a[k]){ got+=PTS(a[k],rr.k); n++; } });
  return {got:got, max:n*3, n:n, pct:n?got/(n*3):0, full:n===4};
}
function bestPicked(ci){
  const c=R.list[ci], a=R.ans[ci];
  if(Object.keys(a).length<4) return null;
  const bi=c.r.reduce((b,rr,k)=>rr.k>c.r[b].k?k:b,0);
  const top=Math.max.apply(null,c.r.map((_,k)=>a[k]));
  return a[bi]===top;
}
function worstSpotted(ci){
  const c=R.list[ci], a=R.ans[ci];
  if(Object.keys(a).length<4) return null;
  const wi=c.r.reduce((b,rr,k)=>rr.k<c.r[b].k?k:b,0);
  return a[wi]<=2;
}
function runStats(){
  const per=[], us=[], ks=[];
  let conc=0, pairs=0, topHit=0, topN=0, lowHit=0, lowN=0;
  R.list.forEach((c,ci)=>{
    const a=R.ans[ci], s=caseScore(ci);
    per.push(s);
    c.r.forEach((rr,k)=>{ if(a[k]){us.push(a[k]);ks.push(rr.k);
      if(rr.k===4){topN++; if(a[k]===4)topHit++}
      if(rr.k===1){lowN++; if(a[k]<=2)lowHit++} } });
    for(let x=0;x<4;x++)for(let y=x+1;y<4;y++){
      if(!a[x]||!a[y])continue;
      const dk=c.r[x].k-c.r[y].k; if(!dk)continue;
      const du=a[x]-a[y]; pairs++;
      if(du===0) conc+=0.5;
      else if((du>0)===(dk>0)) conc+=1;
    }
  });
  const answered=per.filter(p=>p.n>0).length;
  const got=per.reduce((s,p)=>s+p.got,0), max=per.reduce((s,p)=>s+p.max,0);
  const bests=R.list.map((c,i)=>bestPicked(i)).filter(v=>v!==null);
  const worsts=R.list.map((c,i)=>worstSpotted(i)).filter(v=>v!==null);
  return {
    per:per, answered:answered, total:R.list.length,
    got:got, max:max, pct:max?got/max:0,
    lean: mean(us)-mean(ks),
    spread: sd(ks)>0 ? sd(us)/sd(ks) : 1,
    rank: pairs? conc/pairs : 0,
    top: topN? topHit/topN : 0,
    low: lowN? lowHit/lowN : 0,
    best: bests.length? bests.filter(Boolean).length/bests.length : 0,
    worst: worsts.length? worsts.filter(Boolean).length/worsts.length : 0,

function compScores(){
  const acc={}; CK.forEach(k=>acc[k]={g:0,m:0});

    const s=caseScore(ci); if(!s.n)return;
    c.c.forEach(k=>{ if(acc[k]){acc[k].g+=s.got; acc[k].m+=s.max} });
  });
  return acc;
}

function gauge(pct){
  const r=76, C=2*Math.PI*r, on=C*clamp(pct,0,1);
  return '<div class="gauge-wrap"><svg class="gauge" viewBox="0 0 186 186" role="img" aria-label="الدرجة '+Math.round(pct*100)+'٪">'+
   '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">'+
   '<stop offset="0" stop-color="var(--gold-2)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs>'+
   '<circle class="bg" cx="93" cy="93" r="'+r+'"/>'+
   '<circle class="fg" cx="93" cy="93" r="'+r+'" stroke-dasharray="'+on.toFixed(1)+' '+(C-on).toFixed(1)+'" transform="rotate(-90 93 93)"/>'+
   '<text class="nv" x="93" y="98" text-anchor="middle">'+Math.round(pct*100)+'</text>'+
   '<text class="nu" x="93" y="120" text-anchor="middle">من ١٠٠</text>'+
   '</svg></div>';
}
function radar(items){
  const n=items.length, cx=170, cy=158, R=104;
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]};
  let g='';
  [.25,.5,.75,1].forEach(f=>{
    const p=items.map((_,i)=>pt(i,f).map(v=>v.toFixed(1)).join(',')).join(' ');
    g+='<polygon class="gr" points="'+p+'"/>';
  });
  items.forEach((_,i)=>{const p=pt(i,1);g+='<line class="ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'});
  const poly=items.map((it,i)=>pt(i,Math.max(.04,it.v)).map(v=>v.toFixed(1)).join(',')).join(' ');
  g+='<polygon class="ar" points="'+poly+'"/>';
  items.forEach((it,i)=>{const p=pt(i,Math.max(.04,it.v));
    g+='<circle class="pt'+(it.has?'':' hl')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>'});
  items.forEach((it,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, x=cx+Math.cos(a)*(R+24), y=cy+Math.sin(a)*(R+24)+3;
    const an=Math.abs(Math.cos(a))<.25?'middle':(Math.cos(a)>0?'start':'end');
    g+='<text class="lb'+(it.has?'':' dim')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+an+'">'+E(it.lb)+'</text>';
  });
  return '<div class="radar-box"><svg class="rdr" viewBox="0 0 340 316" role="img" aria-label="خريطة الكفايات">'+g+'</svg></div>';
}
function spark(vals){
  if(vals.length<2)return '';
  const w=320,h=46,p=5, n=vals.length;
  const X=i=>p+(w-2*p)*(n===1?0:i/(n-1)), Y=v=>h-p-(h-2*p)*clamp(v,0,1);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const d='M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
  const fill=d+' L'+X(n-1).toFixed(1)+' '+(h-p)+' L'+X(0).toFixed(1)+' '+(h-p)+' Z';
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="مسار الدرجات">'+
    '<path class="fl" d="'+fill+'"/><path class="ln2" vector-effect="non-scaling-stroke" d="'+d+'"/></svg>';
}
function scaleline(pos,leftCap,rightCap,zoneFrom,zoneTo){
  const p=clamp(pos,0,1)*100;
  let z='';
  if(zoneFrom!=null) z='<div class="zone" style="right:'+(zoneFrom*100).toFixed(1)+'%;width:'+((zoneTo-zoneFrom)*100).toFixed(1)+'%"></div>';
  return '<div class="scaleline"><div class="rail"></div>'+z+
   '<div class="mk" style="right:calc('+p.toFixed(1)+'% - 1.5px)"></div>'+
   '<div class="cap" style="right:0">'+E(rightCap)+'</div>'+
   '<div class="cap" style="left:0">'+E(leftCap)+'</div></div>';
}

function nextCase(auto){
  const last=R.i===R.list.length-1;

  R.i++; R.act=0;
  if(R.mode==='sim') R.dl=Date.now()+SIM_SEC*1000;
  if(R.mode==='drill') R.dl=Date.now()+DRILL_SEC*1000;

function finish(){
  stopTick();
  const st=runStats();
  R.list.forEach((c,i)=>{
    const s=caseScore(i); if(!s.n)return;
    const prev=DB.cases[c.id];
    DB.cases[c.id]={best:Math.max(prev?prev.best:0, s.pct), tries:(prev?prev.tries:0)+1, last:s.pct, ts:Date.now()};
  });
  DB.runs.push({ts:Date.now(),mode:R.mode,lvl:R.lvl,pct:st.pct,n:st.answered,secs:st.secs});
  if(DB.runs.length>60) DB.runs=DB.runs.slice(-60);
  writeDB();
  go('result');
}

  const items=CK.map(k=>({lb:COMPS[k].n, v: cs[k].m? cs[k].g/cs[k].m : 0, has: cs[k].m>0}));
  const missing=items.filter(i=>!i.has).map(i=>i.lb);

  let h='<div class="eb">تقرير الجولة</div>'+
   '<h1 style="font-family:var(--d);font-size:clamp(24px,6.2vw,32px);margin-top:8px">'+E(MODEN[R.mode])+
   (R.lvl?' · '+E(LEVELS.find(l=>l.id===R.lvl).n):'')+'</h1>';

  h+='<div class="card" style="margin-top:18px">'+gauge(st.pct)+
   '<div class="grade-name">'+E(b.n)+'</div><p class="grade-say">'+E(b.s)+'</p>'+
   '<div class="tiles">'+
    '<div class="tile"><div class="v">'+st.got+'<span style="font-size:15px;color:var(--muted)">/'+st.max+'</span></div><div class="k">النقاط</div></div>'+
    '<div class="tile"><div class="v">'+st.answered+'<span style="font-size:15px;color:var(--muted)">/'+st.total+'</span></div><div class="k">مواقف مُقدَّرة</div></div>'+
    '<div class="tile"><div class="v">'+Math.round(st.best*100)+'٪</div><div class="k">التقاط الأفضل</div></div>'+
    '<div class="tile"><div class="v">'+Math.round(st.worst*100)+'٪</div><div class="k">كشف الأسوأ</div></div>'+
    '<div class="tile"><div class="v">'+mmss(st.secs)+'</div><div class="k">الزمن</div></div>'+
   '</div></div>';

  /* مسار الجولة */
  const seq=st.per.map(p=>p.pct);
  if(seq.length>1){
    h+='<div class="card" style="margin-top:14px"><div class="eb">مسار الجولة</div>'+
      '<h3 style="margin-top:7px">دقّتك موقفًا بعد موقف</h3>'+
      '<p class="hint">تراجُع في آخر المواقف غالبًا إرهاق لا نقص قدرة — وهو بحد ذاته معلومة للاختبار الفعلي.</p>'+
      spark(seq)+'</div>';
  }

  /* نمط الحكم */
  h+='<div class="card" style="margin-top:14px"><div class="eb">تحليل نمط الحكم</div>'+
   '<h3 style="margin-top:7px">كيف تحكم، لا كم أصبت فقط</h3>'+
   '<p class="hint">أربعة مؤشرات تصف أسلوبك في التقدير مقارنةً بلجنة الخبراء.</p>';

  const leanPos=clamp((st.lean+1.5)/3,0,1);
  const leanName = st.lean>.35?'ميل إلى التساهل' : st.lean<-.35?'ميل إلى التشدّد' : 'تقدير متوازن';
  const leanSay = st.lean>.35
    ? 'تمنح الردود تقديرات أعلى من لجنة الخبراء بمقدار '+Math.abs(st.lean).toFixed(2)+' درجة وسطيًا. الخطر أنك تقبل ردودًا "معقولة الشكل" فيها خلل جوهري — راجع الردود التي قدّرها الخبراء ١ وقدّرتها أنت ٣.'
    : st.lean<-.35
    ? 'تمنح الردود تقديرات أقل من لجنة الخبراء بمقدار '+Math.abs(st.lean).toFixed(2)+' درجة وسطيًا. الخطر أنك ترفض ردودًا فعّالة لأنها ليست مثالية، فتضيع منك الفروق بين الجيد والأفضل.'
    : 'مستوى تقديرك العام يطابق لجنة الخبراء تقريبًا — لا تتساهل ولا تتشدّد. هذا أصعب المؤشرات ضبطًا وأثمنها.';
  h+='<div class="bias"><div class="bh"><div class="bt">مستوى التقدير</div><span class="chip gd">'+E(leanName)+'</span></div>'+
     '<div class="bs">'+E(leanSay)+'</div>'+scaleline(leanPos,'متساهل','متشدّد',.383,.617)+'</div>';

  const spPos=clamp((st.spread-.4)/1.2,0,1);
  const spName = st.spread<.75?'تقدير مركزي' : st.spread>1.3?'تقدير حادّ' : 'تمييز متّزن';
  const spSay = st.spread<.75
    ? 'تقديراتك متقاربة ومتكدّسة في الوسط. المقيّم يريد منك أن تفصل بوضوح بين الردّ الممتاز والردّ الضار؛ التردد في استخدام طرفي السلّم يكلّف نقاطًا في كل موقف.'
    : st.spread>1.3
    ? 'تستخدم طرفي السلّم أكثر من لجنة الخبراء. الحسم ميزة، لكن بعض الردود "فعّالة جزئيًا" فعلًا — وإعطاؤها ١ أو ٤ يفقدك دقة الفروق الوسطى.'
    : 'توزّع تقديراتك على السلّم بالقدر نفسه الذي توزّعه اللجنة: تحسم في الواضح وتتدرّج في المتقارب.';
  h+='<div class="bias"><div class="bh"><div class="bt">مدى التمييز</div><span class="chip gd">'+E(spName)+'</span></div>'+
     '<div class="bs">'+E(spSay)+'</div>'+scaleline(spPos,'حادّ','مركزي',.25,.55)+'</div>';

  const rkName = st.rank>=.85?'ترتيب ممتاز' : st.rank>=.7?'ترتيب سليم' : 'ترتيب مضطرب';
  h+='<div class="bias"><div class="bh"><div class="bt">اتساق الترتيب</div><span class="chip gd">'+E(rkName)+' · '+Math.round(st.rank*100)+'٪</span></div>'+
     '<div class="bs">من كل زوج من الردود داخل الموقف الواحد، هذه نسبة الأزواج التي رتّبتها بالاتجاه نفسه الذي رتّبته به اللجنة. هذا المؤشر يقيس قدرتك على المفاضلة بغضّ النظر عن مستوى تقديرك العام — ويمكن أن يكون ممتازًا حتى لو كنت متساهلًا أو متشدّدًا.</div>'+
     lines([{a:'أزواج متوافقة',v:st.rank}])+'</div>';

  h+='<div class="bias"><div class="bh"><div class="bt">طرفا السلّم</div><span class="chip gd">'+Math.round((st.top+st.low)/2*100)+'٪</span></div>'+
     '<div class="bs">الطرفان هما ما يفصل المرشّحين: التقاط الردّ الفعّال جدًا، وكشف الردّ الضار قبل أن يبدو معقولًا.</div>'+
     lines([
       {a:'التقاط الردّ الأفضل',v:st.top,c:'linear-gradient(90deg,var(--e4),var(--e3))'},
       {a:'كشف الردّ الضار',v:st.low,c:'linear-gradient(90deg,var(--e1),var(--e2))'},
     ])+'</div>';
  h+='</div>';

  /* الكفايات */
  h+='<div class="card" style="margin-top:14px"><div class="eb">خريطة الكفايات</div>'+
   '<h3 style="margin-top:7px">الكفايات الثماني</h3>'+
   '<p class="hint">النقاط المجوّفة والأسماء الباهتة تعني كفايات لم تُقَس في هذه الجولة — لا ضعفًا فيها.</p>'+
   radar(items)+
   (missing.length?'<p class="hint" style="margin:8px 0 14px">لم تُقَس في هذه الجولة: '+E(missing.join('، '))+'.</p>':'<div style="height:10px"></div>')+
   lines(items.filter(i=>i.has).sort((a,b)=>b.v-a.v).map(i=>({a:i.lb,v:i.v})))+'</div>';

  /* جدول المواقف */
  h+='<div class="card" style="margin-top:14px"><div class="eb">تفصيل المواقف</div><h3 style="margin-top:7px">موقفًا بموقف</h3>'+
   '<div class="tbw" style="margin-top:12px"><table class="tb"><thead><tr><th>#</th><th>الموقف</th><th>النقاط</th><th>الأفضل</th><th>الأسوأ</th></tr></thead><tbody>';
  R.list.forEach((c,i)=>{
    const s=st.per[i];
    h+='<tr><td>'+(i+1)+'</td><td class="s">'+E(c.t)+'</td><td>'+s.got+'/'+MAXC+'</td>'+
      '<td>'+(bestPicked(i)===null?'—':(bestPicked(i)?'✓':'✕'))+'</td>'+
      '<td>'+(worstSpotted(i)===null?'—':(worstSpotted(i)?'✓':'✕'))+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  /* المراجعة الكاملة */
  h+='<div class="card" style="margin-top:14px"><div class="eb">المراجعة</div><h3 style="margin-top:7px">تقدير الخبراء لكل ردّ</h3>'+
   '<p class="hint">المسوّغات هي المادة التعليمية الحقيقية — اقرأ مسوّغ الردّ الذي أخطأت فيه قبل أي شيء آخر.</p>';
  R.list.forEach((c,i)=>{
    const a=R.ans[i], s=st.per[i];
    h+='<div class="entry"><div class="eh"><div class="et">'+(i+1)+'. '+E(c.t)+'</div>'+
      '<span class="chip gd">'+s.got+'/'+MAXC+'</span></div>'+
      '<div class="ec">'+E(c.s)+'</div><details><summary>تقدير الخبراء والمسوّغات</summary>';
    c.r.forEach((rr,k)=>{
      const u=a[k]||0, d=u?Math.abs(u-rr.k):null;
      h+='<div class="mini"><div>'+E(rr.t)+'</div><div class="mt">'+
        '<span class="seal s'+rr.k+'">الخبراء: '+E(RATE[rr.k].s)+'</span>'+
        (u?'<span class="delta '+(d===0?'ok':d===1?'nr':'no')+'">أنت: '+E(RATE[u].s)+' · '+PTS(u,rr.k)+'/3</span>':'<span class="delta no">لم تُقدَّر</span>')+
        '</div><div class="rsn" style="margin-top:6px">'+E(rr.w)+'</div></div>';
    });
    h+='<div class="axiom" style="margin-top:12px"><div class="t">الدرس</div>'+E(c.l)+'</div></details></div>';
  });
  h+='</div>';

  h+='<div class="brow noprint">'+
   '<button class="b g" data-again="1">أعد الجولة بترتيب جديد</button>'+
   '<button class="b o" data-go="home">الرئيسية</button>'+
   '<button class="b o" data-go="record">سجلّ التقدّم</button>'+
   '<button class="b q" data-print="1">طباعة التقرير</button></div>';
  return h+FOOT;
}

/* ── المكتبة ── */
function vLibrary(){
  const f=V.f||0, q=(V.q||'').trim();
  let list=f?BYLVL[f].slice():CASES.slice();
  if(q) list=list.filter(c=>(c.t+' '+c.s+' '+c.l).indexOf(q)>=0);

  let h='<div class="eb">مرجع مفتوح</div>'+
   '<h1 style="font-family:var(--d);font-size:clamp(24px,6.2vw,32px);margin-top:8px">مكتبة المواقف</h1>'+
   '<p style="color:var(--ink-2);max-width:60ch;margin:10px 0 20px;line-height:1.95">الستون موقفًا كاملةً مع تقدير لجنة الخبراء لكل ردّ ومسوّغه ودرس الموقف. لا قفل ولا شرط — اقرأ ما شئت متى شئت.</p>';

  h+='<div class="filter"><button class="'+(!f?'act':'')+'" data-f="0">الكل · '+CASES.length+'</button>';
  LEVELS.forEach(l=>h+='<button class="'+(f===l.id?'act':'')+'" data-f="'+l.id+'">'+E(l.n)+' · '+BYLVL[l.id].length+'</button>');
  h+='</div>';
  h+='<div style="margin-bottom:16px"><input id="q" value="'+E(q)+'" placeholder="ابحث في المواقف…" '+
     'style="width:100%;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--b);font-size:14px"></div>';

  if(!list.length) h+='<div class="blank"><div class="g">❖</div><p>لا نتائج مطابقة.</p></div>';
  list.forEach(c=>{
    const rec=DB.cases[c.id];
    h+='<div class="entry"><div class="eh"><div class="et">'+E(c.t)+'</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      '<span class="chip">'+E(c.id)+'</span>'+
      (rec?'<span class="chip gd">أفضل: '+Math.round(rec.best*100)+'٪</span>':'')+
      c.c.map(k=>'<span class="chip sh">'+E(COMPS[k].n)+'</span>').join('')+'</div></div>'+
      '<div class="ec">'+E(c.s)+'</div><details><summary>الردود الأربعة وتقدير الخبراء</summary>';
    c.r.slice().sort((x,y)=>y.k-x.k).forEach(rr=>{
      h+='<div class="mini"><div>'+E(rr.t)+'</div><div class="mt"><span class="seal s'+rr.k+'">'+E(RATE[rr.k].n)+'</span></div>'+
        '<div class="rsn" style="margin-top:6px">'+E(rr.w)+'</div></div>';
    });
    h+='<div class="axiom" style="margin-top:12px"><div class="t">الدرس</div>'+E(c.l)+'</div></details></div>';
  });
  h+='<div class="brow"><button class="b o" data-go="home">← الرئيسية</button></div>';
  return h+FOOT;
}

/* ── السجل ── */
function vRecord(){
  const o=overall();
  let h='<div class="eb">الأثر التراكمي</div>'+
   '<h1 style="font-family:var(--d);font-size:clamp(24px,6.2vw,32px);margin-top:8px">سجلّ التقدّم</h1>';

  h+='<div class="card" style="margin-top:18px">'+gauge(o.pct)+
   '<div class="grade-name">'+E(bandOf(o.pct).n)+'</div>'+
   '<p class="grade-say">متوسط أفضل نتائجك على المواقف التي خضتها. يرتفع حين تعيد موقفًا وتتحسن فيه، ولا ينخفض بمحاولة أضعف.</p>'+
   '<div class="tiles">'+
    '<div class="tile"><div class="v">'+o.seen+'<span style="font-size:15px;color:var(--muted)">/'+o.all+'</span></div><div class="k">مواقف خُضتها</div></div>'+
    '<div class="tile"><div class="v">'+DB.runs.length+'</div><div class="k">جولات</div></div>'+
    '<div class="tile"><div class="v">'+Math.round(o.seen/o.all*100)+'٪</div><div class="k">تغطية البنك</div></div>'+
   '</div></div>';

  if(DB.runs.length>1){
    h+='<div class="card" style="margin-top:14px"><div class="eb">المنحنى</div><h3 style="margin-top:7px">درجاتك عبر الجولات</h3>'+
      spark(DB.runs.map(r=>r.pct))+'</div>';
  }

  h+='<div class="card" style="margin-top:14px"><div class="eb">المستويات</div><h3 style="margin-top:7px">إتقانك في كل ميدان</h3><div style="margin-top:14px">'+
    lines(LEVELS.map(l=>{const p=lvlProgress(l.id);return {a:l.n,v:p.pct,txt:Math.round(p.pct*100)+'٪'}}))+
    '<p class="hint" style="margin-top:12px">المواقف التي خضتها في كل مستوى: '+
    LEVELS.map(l=>{const p=lvlProgress(l.id);return E(l.n)+' '+p.done+'/'+p.all}).join(' · ')+'</p></div></div>';

  /* الكفايات التراكمية */
  const acc={}; CK.forEach(k=>acc[k]={g:0,m:0});
  CASES.forEach(c=>{ const rec=DB.cases[c.id]; if(!rec)return;
    c.c.forEach(k=>{acc[k].g+=rec.best*MAXC; acc[k].m+=MAXC}) });
  const items=CK.map(k=>({lb:COMPS[k].n,v:acc[k].m?acc[k].g/acc[k].m:0,has:acc[k].m>0}));
  if(items.some(i=>i.has)){
    const missing=items.filter(i=>!i.has).map(i=>i.lb);
    h+='<div class="card" style="margin-top:14px"><div class="eb">الكفايات</div><h3 style="margin-top:7px">خريطتك التراكمية</h3>'+
      '<p class="hint">مبنية على أفضل نتيجة لك في كل موقف خضته.</p>'+radar(items)+
      (missing.length?'<p class="hint" style="margin:8px 0 0">لم تُقَس بعد: '+E(missing.join('، '))+'.</p>':'')+'</div>';
  }

  if(DB.runs.length){
    h+='<div class="card" style="margin-top:14px"><div class="eb">الجولات</div><h3 style="margin-top:7px">آخر ما خضته</h3>'+
     '<div class="tbw" style="margin-top:12px"><table class="tb"><thead><tr><th>الوضع</th><th>الميدان</th><th>مواقف</th><th>الزمن</th><th>الدرجة</th></tr></thead><tbody>';
    DB.runs.slice().reverse().slice(0,14).forEach(r=>{
      h+='<tr><td class="s">'+E(MODEN[r.mode]||r.mode)+'</td><td>'+E(r.lvl?LEVELS.find(l=>l.id===r.lvl).n:'شامل')+'</td>'+
        '<td>'+r.n+'</td><td>'+mmss(r.secs||0)+'</td><td class="s">'+Math.round(r.pct*100)+'٪</td></tr>';
    });
    h+='</tbody></table></div></div>';
  } else {
    h+='<div class="blank"><div class="g">◴</div><p>لم تُسجَّل جولات بعد. ابدأ من أي مستوى — جميعها مفتوحة.</p></div>';
  }

  h+='<div class="brow"><button class="b o" data-go="home">← الرئيسية</button>'+
     '<button class="b q" data-reset="1">مسح السجلّ</button></div>';
  return h+FOOT;
}

   '<p style="color:var(--ink-2);line-height:1.95;margin:14px 0 0">الموقف الواحد اثنتا عشرة نقطة (٤ ردود × ٣)، والدرجة النهائية نسبة ما حصّلته إلى المتاح.</p></div>';

  h+='<div class="card" style="margin-top:14px"><div class="eb">ما وراء الدرجة</div><h3 style="margin-top:7px">مؤشرات نمط الحكم</h3>'+
   '<div class="tbw" style="margin-top:12px"><table class="tb"><tbody>'+
   '<tr><td class="s" style="width:30%">مستوى التقدير</td><td>هل تمنح الردود درجات أعلى أو أدنى من اللجنة على العموم؟ التساهل يقبل الضار، والتشدّد يرفض النافع.</td></tr>'+
   '<tr><td class="s">مدى التمييز</td><td>هل تستخدم طرفي السلّم أم تتكدّس تقديراتك في الوسط؟ التكدّس أشيع خطأ عند المرشّحين.</td></tr>'+
   '<tr><td class="s">اتساق الترتيب</td><td>بصرف النظر عن مستواك العام: هل ترتّب الردود داخل الموقف بالترتيب نفسه الذي ترتّبه به اللجنة؟</td></tr>'+
   '<tr><td class="s">طرفا السلّم</td><td>قدرتك على التقاط الردّ الفعّال جدًا، وكشف الردّ الضار الذي يبدو معقولًا في ظاهره.</td></tr>'+
   '</tbody></table></div></div>';

  h+='<div class="card" style="margin-top:14px"><div class="eb">الكفايات الثماني</div><h3 style="margin-top:7px">ما الذي يُقاس خلف المواقف</h3>'+
   '<div class="tbw" style="margin-top:12px"><table class="tb"><tbody>'+
   CK.map(k=>'<tr><td class="s" style="width:32%">'+E(COMPS[k].n)+'</td><td>'+E(COMPS[k].d)+'</td></tr>').join('')+
   '</tbody></table></div></div>';

  h+='<div class="axiom" style="margin-top:16px"><div class="t">تنبيه</div>'+
   'جميع المواقف والردود والتقديرات في هذه المنصّة مصوغة لأغراض التدريب، ولا تمثّل بنك أسئلة أي اختبار رسمي ولا تُنسب إلى أي جهة.</div>';

  h+='<div class="brow"><button class="b o" data-go="home">← الرئيسية</button></div>';
  return h+FOOT;
}

/* ══════════════ الربط ══════════════ */
function bind(){
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('[data-lvl]').forEach(b=>b.onclick=()=>go('level',{lvl:+b.dataset.lvl}));
  $$('[data-mode]').forEach(b=>b.onclick=()=>startRun(b.dataset.mode,V.lvl));
  $$('[data-exam]').forEach(b=>b.onclick=()=>startRun('exam',0));
  $$('[data-f]').forEach(b=>b.onclick=()=>go('library',{f:+b.dataset.f,q:V.q||''}));
  $$('[data-print]').forEach(b=>b.onclick=()=>window.print());
  $$('[data-again]').forEach(b=>b.onclick=()=>startRun(R.mode,R.lvl));
  $$('[data-reset]').forEach(b=>b.onclick=()=>{
    if(confirm('سيُمسح سجلّ تقدّمك كاملًا على هذا الجهاز. هل تريد المتابعة؟')){
      DB={cases:{},runs:[],theme:DB.theme}; writeDB(); go('record');
    }
  });
  const q=$('#q');
  if(q){ let t=null; q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{V.q=q.value;go('library',{f:V.f||0,q:q.value})},320)};
    q.focus(); try{q.setSelectionRange(q.value.length,q.value.length)}catch(e){} }

  if(V.v==='run'){
    $$('.grade button').forEach(b=>b.onclick=function(){
      const box=b.closest('.opt'), oi=+box.dataset.oi, v=+b.dataset.v;
      R.ans[R.i][oi]=v; R.act=Math.min(3,(+box.dataset.pos)+1);
      $$('button',b.parentNode).forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});
      b.classList.add('on'); b.setAttribute('aria-pressed','true'); box.classList.add('set');
      const done=Object.keys(R.ans[R.i]).length;
      const st=$('#deck .st'); if(st)st.innerHTML=done+' من 4<span class="wide"> ردود مُقدَّرة</span>';
      const nx=$('#bnext'); if(nx&&R.mode==='study') nx.disabled=done<4;
      const nb=$$('.opt')[R.act]; if(nb&&done<4) nb.scrollIntoView({block:'center',behavior:'smooth'});
    });
    const p=$('#bprev'); if(p)p.onclick=()=>{ if(R.i>0){R.i--;R.act=0;
      if(R.mode==='sim')R.dl=Date.now()+SIM_SEC*1000; if(R.mode==='drill')R.dl=Date.now()+DRILL_SEC*1000; go('run')} };
    const n=$('#bnext'); if(n)n.onclick=()=>{
      if(R.mode==='study'&&!R.shown[R.i]){ R.shown[R.i]=true; go('run'); return; }
      nextCase(false);
    };
    if(R.timed) startTimer();
  }
}

/* ══════════════ اختصارات لوحة المفاتيح ══════════════ */
document.addEventListener('keydown',function(e){
  if(V.v!=='run'||!R)return;
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key>='1'&&e.key<='4'){
    const opts=$$('.opt'); const box=opts[R.act]; if(!box||R.shown[R.i])return;
    const b=$$('.grade button',box)[+e.key-1]; if(b&&!b.disabled){b.click();e.preventDefault()}
  } else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    const d=e.key==='ArrowDown'?1:-1; R.act=clamp(R.act+d,0,3);
    const box=$$('.opt')[R.act]; if(box){box.scrollIntoView({block:'center',behavior:'smooth'});e.preventDefault()}
  } else if(e.key==='Enter'){
    const n=$('#bnext'); if(n&&!n.disabled){n.click();e.preventDefault()}
  } else if(e.key==='ArrowRight'){
    const p=$('#bprev'); if(p&&!p.disabled){p.click();e.preventDefault()}
  }
});

/* ══════════════ الإقلاع ══════════════ */
try{history.replaceState({v:'home',o:{}},'','')}catch(e){}
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
