/* ── شاشة الموقف ── */
function vRun(){
  const ci=R.i, c=R.list[ci], ord=R.ord[ci], a=R.ans[ci], shown=R.shown[ci];
  const cfg=MODE_CFG[R.mode];
  const done=Object.keys(a).length;

  let ticks='';
  for(let k=0;k<R.list.length;k++) ticks+='<i class="'+(k===ci?'c':(R.shown[k]||Object.keys(R.ans[k]).length===4?'p':''))+'"></i>';
  let h='<div class="track"><div class="trow">'+
    '<span class="chip gd">'+E(R.label||MODEN(R.mode))+'</span>'+
    '<span class="chip">'+(ci+1)+' / '+R.list.length+'</span>'+
    '<span class="sp"></span>'+
    '<span class="timer" id="elapsed" title="زمنك في هذا الموقف — للقياس لا للإلزام">0:00</span>'+
    '</div><div class="ticks">'+ticks+'</div></div>';

  h+='<article class="dossier"><div class="hd">'+
    '<div class="ref">'+E(c.id)+'</div><h2>'+E(c.t)+'</h2>'+
    '<div class="tags"><span class="chip">'+E(LEVELS.find(l=>l.id===c.lvl).n)+'</span>'+
    c.c.map(k=>'<span class="chip sh">'+E(COMPS[k].n)+'</span>').join('')+'</div></div>'+
    '<div class="bd"><p>'+E(c.s)+'</p></div>'+
    '<div class="prompt">قدّر فعالية كل ردّ من الردود الأربعة على حدة — ليست مفاضلة بين ردّ وآخر، بل حكم مستقل على كل واحد.</div></article>';

  h+='<div class="opts">';
  ord.forEach((oi,pos)=>{
    const rr=c.r[oi], val=a[oi]||0;
    h+='<div class="opt'+(val?' set':'')+'" data-oi="'+oi+'" data-pos="'+pos+'">'+
      '<div class="tx"><span class="no">'+['أ','ب','ج','د'][pos]+'</span><span>'+E(rr.t)+'</span></div>'+
      '<div class="grade" role="group" aria-label="تقدير الفعالية">';
    for(let v=1;v<=4;v++)
      h+='<button data-v="'+v+'" class="'+(val===v?'on':'')+'"'+(shown?' disabled':'')+' aria-pressed="'+(val===v)+'">'+
        '<span class="lv"><i></i><i></i><i></i><i></i></span><span>'+E(RATE[v].s)+'</span></button>';
    h+='</div>';
    if(shown){
      const d=Math.abs((val||0)-rr.k), cls=d===0?'ok':(d===1?'nr':'no');
      const txt=d===0?'مطابق لتقدير الخبراء':(d===1?'فرق درجة واحدة':'فرق '+d+' درجات');
      h+='<div class="ruling"><div class="rl-top">'+
        '<span class="seal s'+rr.k+'">تقدير الخبراء: '+E(RATE[rr.k].n)+'</span>'+
        '<span class="chip">'+E(ARCHS[rr.a].n)+'</span>'+
        (val?'<span class="delta '+cls+'">'+E(txt)+' · '+PTS(val,rr.k)+'/3</span>':'<span class="delta no">لم تُقدَّر · 0/3</span>')+
        '</div><div class="rsn">'+E(rr.w)+'</div></div>';
    }
    h+='</div>';
  });
  h+='</div>';

  /* الثقة */
  if(done===4 && !shown){
    h+='<div class="card" style="margin-top:14px"><div class="conf" style="border:0;padding:0;margin:0">'+
      '<div class="q">ما مدى ثقتك بتقديرك في هذا الموقف؟ (اختياري — يُستخدم لقياس معايرة ثقتك)</div>'+
      '<div class="row">'+[1,2,3].map(v=>'<button data-conf="'+v+'" class="'+(R.conf[ci]===v?'on':'')+'">'+
        ['منخفضة','متوسطة','عالية'][v-1]+'</button>').join('')+'</div></div></div>';
  }

  if(shown){
    h+='<div class="axiom"><div class="t">درس الموقف</div>'+E(c.l)+'</div>';
    const s=caseScore(ci);
    h+='<div class="tiles" style="margin-top:16px">'+
     '<div class="tile"><div class="v">'+s.got+'<span style="font-size:15px;color:var(--muted)">/'+MAXC+'</span></div><div class="k">نقاط الموقف</div></div>'+
     '<div class="tile"><div class="v">'+Math.round(s.pct*100)+'٪</div><div class="k">دقة التقدير</div></div>'+
     '<div class="tile"><div class="v">'+(bestPicked(ci)?'نعم':'لا')+'</div><div class="k">التقط الأفضل</div></div>'+
     '<div class="tile"><div class="v">'+(worstSpotted(ci)?'نعم':'لا')+'</div><div class="k">كشف الأسوأ</div></div>'+
     '<div class="tile"><div class="v">'+mmss(R.spent[ci])+'</div><div class="k">زمنك</div></div></div>';
    h+='<div class="nlab">ملاحظتك على هذا الموقف (تُحفظ على جهازك وتظهر في المكتبة):</div>'+
       '<textarea class="note" id="note" data-cid="'+E(c.id)+'" placeholder="اكتب الدرس بكلماتك أنت — هذه أقوى أداة تثبيت.">'+E(P().notes[c.id]||'')+'</textarea>';
  }

  const deck=$('#deck'); deck.hidden=false;
  const last=ci===R.list.length-1;
  const label = (shown||!cfg.reveal) ? (last?'إنهاء وعرض التقرير':'الموقف التالي ←') : 'اكشف تقدير الخبراء';
  const dis = (cfg.reveal && !shown && done<4) ? ' disabled':'';
  deck.innerHTML =
    (cfg.back?'<button id="bprev"'+(ci===0?' disabled':'')+'>→ السابق</button>':'<span style="width:1px"></span>')+
    '<div class="st">'+done+' من 4<span class="wide"> ردود مُقدَّرة</span></div>'+
    '<button class="pri" id="bnext"'+dis+'>'+label+'</button>';
  return h;
}

/* ══════════════ التقرير ══════════════ */
function vResult(){
  if(!R) return vHome();
  const st=runStats(), b=bandOf(st.pct), cs=compScores();
  const items=CK.map(k=>({lb:COMPS[k].n, v: cs[k].m? cs[k].g/cs[k].m:0, has: cs[k].m>0}));
  const missing=items.filter(i=>!i.has).map(i=>i.lb);
  const pc=pacing(), ar=archStats(), cal=calib();

  let h='<div class="eb">تقرير الجولة</div>'+
   '<h1 style="font-family:var(--d);font-size:clamp(24px,6.2vw,32px);margin-top:8px">'+E(R.label||MODEN(R.mode))+
   (R.lvl?' · '+E(LEVELS.find(l=>l.id===R.lvl).n):'')+'</h1>';

  h+='<div class="card" style="margin-top:18px">'+gauge(st.pct)+
   '<div class="grade-name">'+E(b.n)+'</div><p class="grade-say">'+E(b.s)+'</p>'+
   '<div class="tiles">'+
    '<div class="tile"><div class="v">'+st.got+'<span style="font-size:15px;color:var(--muted)">/'+st.max+'</span></div><div class="k">النقاط</div></div>'+
    '<div class="tile"><div class="v">'+st.answered+'<span style="font-size:15px;color:var(--muted)">/'+st.total+'</span></div><div class="k">مواقف مُقدَّرة</div></div>'+
    '<div class="tile"><div class="v">'+Math.round(st.best*100)+'٪</div><div class="k">التقاط الأفضل</div></div>'+
    '<div class="tile"><div class="v">'+Math.round(st.worst*100)+'٪</div><div class="k">كشف الأسوأ</div></div>'+
    '<div class="tile"><div class="v">'+mmss(st.secs)+'</div><div class="k">الزمن</div></div>'+
    '<div class="tile"><div class="v">'+Math.round(st.rank*100)+'٪</div><div class="k">اتساق الترتيب</div></div>'+
   '</div></div>';

  /* ── خطوات العلاج ── */
  const fixes=[];
  const worstCases=R.list.map((c,i)=>({c:c,s:caseScore(i)})).filter(x=>x.s.n).sort((a,b)=>a.s.pct-b.s.pct).slice(0,3);
  if(worstCases.length && worstCases[0].s.pct<0.9)
    fixes.push({t:'أعد المواقف الثلاثة الأضعف في هذه الجولة',
      s:worstCases.map(x=>x.c.t).join(' · '), act:'list', list:worstCases.map(x=>x.c)});
  const over=ar.slice().sort((a,b)=>b.gap-a.gap)[0];
  if(over&&over.gap>0.3)
    fixes.push({t:'انتبه لنمط «'+ARCHS[over.k].n+'»',
      s:'تمنح هذا النمط '+over.gap.toFixed(2)+' درجة فوق تقدير اللجنة وسطيًا — راجع مسوّغاته في المراجعة أدناه.', act:'none'});
  const cw=compWeak()[0];
  if(cw&&cw.v<0.8)
    fixes.push({t:'جولة علاجية على كفاية «'+COMPS[cw.k].n+'»',
      s:'أضعف كفاياتك حاليًا ('+Math.round(cw.v*100)+'٪). ثمانية مواقف تقيسها، الأضعف أولًا.',
      act:'comp', comp:cw.k});
  if(fixes.length){
    h+='<div class="card" style="margin-top:14px"><div class="eb">ماذا تفعل الآن</div>'+
      '<h3 style="margin-top:7px">أهمّ ثلاث خطوات</h3>'+
      '<p class="hint">مرتّبة بالأثر — الأولى أعلى مردودًا من قراءة التقرير كاملًا.</p><div class="acts">';
    fixes.forEach((f,i)=>{
      const attr = f.act==='comp' ? ' data-fixcomp="'+f.comp+'"' : (f.act==='list'? ' data-fixworst="1"':'');
      h+='<'+(f.act==='none'?'div':'button')+' class="act"'+attr+'><div class="no2">'+AI(i+1)+'</div>'+
        '<div><div class="at">'+E(f.t)+'</div><div class="as">'+E(f.s)+'</div></div>'+
        (f.act==='none'?'':'<div class="ag">←</div>')+'</'+(f.act==='none'?'div':'button')+'>';
    });
    h+='</div></div>';
  }

  /* ── مسار الجولة ── */
  const seq=st.per.map(p=>p.pct);
  if(seq.length>1) h+='<div class="card" style="margin-top:14px"><div class="eb">مسار الجولة</div>'+
    '<h3 style="margin-top:7px">دقّتك موقفًا بعد موقف</h3>'+
    '<p class="hint">تراجُع في آخر المواقف غالبًا إرهاق لا نقص قدرة — وهو بحد ذاته معلومة للاختبار الفعلي.</p>'+spark(seq)+'</div>';

  /* ── الإيقاع ── */
  if(pc){
    const drop=pc.first-pc.second;
    h+='<div class="card" style="margin-top:14px"><div class="eb">تحليل الإيقاع</div>'+
      '<h3 style="margin-top:7px">الزمن مقابل الدقة</h3>'+
      '<p class="hint">كل نقطة موقف. الأيمن أسرع والأيسر أبطأ؛ الأحمر دقّته دون ٦٠٪. الخط المتقطع وسيط زمنك.</p>'+
      (pc.per.length>=3? scatter(pc.per, pc.med) : '')+
      '<div class="tiles" style="margin-top:16px">'+
       '<div class="tile"><div class="v">'+mmss(pc.med)+'</div><div class="k">وسيط الزمن للموقف</div></div>'+
       '<div class="tile"><div class="v">'+pc.rushed.length+'</div><div class="k">مواقف استعجلتها فأخطأت</div></div>'+
       '<div class="tile"><div class="v">'+pc.slow.length+'</div><div class="k">مواقف استنزفت وقتك</div></div>'+
       '<div class="tile"><div class="v">'+(drop>0?'−':'+')+Math.abs(Math.round(drop*100))+'٪</div><div class="k">فرق النصف الثاني</div></div>'+
      '</div>';
    let say;
    if(pc.rushed.length>=2) say='استعجلت '+pc.rushed.length+' مواقف ودفعت ثمنها دقةً. الوقت هنا مفتوح ولا شيء يستعجلك — والقراءة الثانية للموقف هي التي تلتقط القيد المخفي غالبًا.';
    else if(pc.slow.length>=2) say='استنزفت وقتًا كبيرًا في '+pc.slow.length+' مواقف دون مردود في الدقة. حين تتجاوز ضعف وسيط زمنك، غالبًا لن يغيّر التفكير الإضافي تقديرك — احسم وانتقل.';
    else if(drop>0.12) say='دقّتك في النصف الثاني أقل بـ'+Math.round(drop*100)+'٪. هذا إرهاق لا نقص قدرة، وعلاجه التدريب على جولات بطول الاختبار الفعلي لا على مواقف متفرقة.';
    else say='إيقاعك متّزن: لا استعجال مكلف ولا استنزاف بلا مردود، ودقّتك لا تنهار في النصف الثاني. هذا نصف نجاح الاختبار.';
    h+='<p style="color:var(--ink-2);line-height:1.95;margin:16px 0 0">'+E(say)+'</p></div>';
  }

  /* ── نمط الحكم ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">تحليل نمط الحكم</div>'+
   '<h3 style="margin-top:7px">كيف تحكم، لا كم أصبت فقط</h3>'+
   '<p class="hint">أربعة مؤشرات تصف أسلوبك في التقدير مقارنةً بلجنة الخبراء.</p>';
  const leanPos=clamp((st.lean+1.5)/3,0,1);
  const leanName= st.lean>.35?'ميل إلى التساهل': st.lean<-.35?'ميل إلى التشدّد':'تقدير متوازن';
  const leanSay = st.lean>.35
    ? 'تمنح الردود تقديرات أعلى من لجنة الخبراء بمقدار '+Math.abs(st.lean).toFixed(2)+' درجة وسطيًا. الخطر أنك تقبل ردودًا «معقولة الشكل» فيها خلل جوهري — راجع الردود التي قدّرها الخبراء ١ وقدّرتها أنت ٣.'
    : st.lean<-.35
    ? 'تمنح الردود تقديرات أقل من لجنة الخبراء بمقدار '+Math.abs(st.lean).toFixed(2)+' درجة وسطيًا. الخطر أنك ترفض ردودًا فعّالة لأنها ليست مثالية، فتضيع منك الفروق بين الجيد والأفضل.'
    : 'مستوى تقديرك العام يطابق لجنة الخبراء تقريبًا — لا تتساهل ولا تتشدّد. هذا أصعب المؤشرات ضبطًا وأثمنها.';
  h+='<div class="bias"><div class="bh"><div class="bt">مستوى التقدير</div><span class="chip gd">'+E(leanName)+'</span></div>'+
     '<div class="bs">'+E(leanSay)+'</div>'+scaleline(leanPos,'متساهل','متشدّد',.383,.617)+'</div>';
  const spPos=clamp((st.spread-.4)/1.2,0,1);
  const spName= st.spread<.75?'تقدير مركزي': st.spread>1.3?'تقدير حادّ':'تمييز متّزن';
  const spSay = st.spread<.75
    ? 'تقديراتك متقاربة ومتكدّسة في الوسط. المقيّم يريد منك أن تفصل بوضوح بين الردّ الممتاز والردّ الضار؛ التردد في استخدام طرفي السلّم يكلّف نقاطًا في كل موقف.'
    : st.spread>1.3
    ? 'تستخدم طرفي السلّم أكثر من لجنة الخبراء. الحسم ميزة، لكن بعض الردود «فعّالة جزئيًا» فعلًا — وإعطاؤها ١ أو ٤ يفقدك دقة الفروق الوسطى.'
    : 'توزّع تقديراتك على السلّم بالقدر نفسه الذي توزّعه اللجنة: تحسم في الواضح وتتدرّج في المتقارب.';
  h+='<div class="bias"><div class="bh"><div class="bt">مدى التمييز</div><span class="chip gd">'+E(spName)+'</span></div>'+
     '<div class="bs">'+E(spSay)+'</div>'+scaleline(spPos,'حادّ','مركزي',.25,.55)+'</div>';
  const rkName= st.rank>=.85?'ترتيب ممتاز': st.rank>=.7?'ترتيب سليم':'ترتيب مضطرب';
  h+='<div class="bias"><div class="bh"><div class="bt">اتساق الترتيب</div><span class="chip gd">'+E(rkName)+' · '+Math.round(st.rank*100)+'٪</span></div>'+
     '<div class="bs">من كل زوج من الردود داخل الموقف الواحد، هذه نسبة الأزواج التي رتّبتها بالاتجاه نفسه الذي رتّبته به اللجنة. يقيس قدرتك على المفاضلة بغضّ النظر عن مستوى تقديرك العام.</div>'+
     lines([{a:'أزواج متوافقة',v:st.rank}])+'</div>';
  h+='<div class="bias"><div class="bh"><div class="bt">طرفا السلّم</div><span class="chip gd">'+Math.round((st.top+st.low)/2*100)+'٪</span></div>'+
     '<div class="bs">الطرفان هما ما يفصل المرشّحين: التقاط الردّ الفعّال جدًا، وكشف الردّ الضار قبل أن يبدو معقولًا.</div>'+
     lines([{a:'التقاط الردّ الأفضل',v:st.top,c:'linear-gradient(90deg,var(--e4),var(--e3))'},
            {a:'كشف الردّ الضار',v:st.low,c:'linear-gradient(90deg,var(--e1),var(--e2))'}])+'</div></div>';

  /* ── أنماط الردّ ── */
  if(ar.length>=4){
    const sorted=ar.slice().sort((a,b)=>b.gap-a.gap);
    const traps=sorted.filter(x=>x.gap>0.25).slice(0,3);
    h+='<div class="card" style="margin-top:14px"><div class="eb">أنماط الردّ</div>'+
      '<h3 style="margin-top:7px">أيّ نوع من الحلول يغريك</h3>'+
      '<p class="hint">كل ردّ في البنك مصنّف إلى نمط سلوكي. هذا يقارن تقديرك لكل نمط بتقدير اللجنة له.</p>';
    if(traps.length){
      h+='<div class="acts">';
      traps.forEach((t,i)=>{h+='<div class="act" style="cursor:default"><div class="no2">'+AI(i+1)+'</div>'+
        '<div><div class="at">'+E(ARCHS[t.k].n)+' <span class="chip gd">+'+t.gap.toFixed(2)+'</span></div>'+
        '<div class="as">'+E(ARCHS[t.k].hi!=='—'?ARCHS[t.k].hi:ARCHS[t.k].d)+'</div></div></div>'});
      h+='</div>';
    } else {
      h+='<p style="color:var(--ink-2);line-height:1.95;margin:12px 0 0">لا يوجد نمط تُفرط في تقديره في هذه الجولة — تقييمك لكل نوع من الحلول قريب من تقييم اللجنة. هذه نتيجة نادرة ومطلوبة.</p>';
    }
    h+='<div class="tbw" style="margin-top:16px"><table class="tb"><thead><tr><th>النمط</th><th>ردود</th><th>تقديرك</th><th>الخبراء</th><th>الفارق</th></tr></thead><tbody>';
    sorted.forEach(x=>{h+='<tr><td class="s">'+E(ARCHS[x.k].n)+'</td><td>'+x.n+'</td><td>'+x.you.toFixed(2)+'</td><td>'+x.exp.toFixed(2)+'</td>'+
      '<td style="color:'+(Math.abs(x.gap)<.25?'var(--ink-2)':(x.gap>0?'var(--e2)':'var(--e3)'))+'">'+(x.gap>0?'+':'')+x.gap.toFixed(2)+'</td></tr>'});
    h+='</tbody></table></div></div>';
  }

  /* ── المعايرة ── */
  if(cal){
    const nm = cal.over>=.34?'ثقة زائدة': cal.under>=.5?'تقليل من شأن نفسك':'معايرة سليمة';
    const sy = cal.over>=.34
      ? 'في '+Math.round(cal.over*100)+'٪ من المواقف التي قلت إن ثقتك فيها عالية، جاءت دقّتك دون ٦٠٪. الثقة الزائدة أخطر من الجهل لأنها تُغلق باب المراجعة — وهي أخطر نمط في القيادة الفعلية لا في الاختبار وحده.'
      : cal.under>=.5
      ? 'في '+Math.round(cal.under*100)+'٪ من المواقف التي قلت إن ثقتك فيها منخفضة، كانت دقّتك ممتازة. حكمك أفضل مما تظن، والتردّد يكلّفك وقتًا في الاختبار لا درجات.'
      : 'ثقتك تتبع دقّتك: تثق حيث تصيب وتتردّد حيث تخطئ. هذه المعايرة هي ما يجعل القائد يعرف متى يسأل ومتى يحسم.';
    h+='<div class="card" style="margin-top:14px"><div class="eb">معايرة الثقة</div>'+
      '<h3 style="margin-top:7px">هل تعرف متى تكون مخطئًا؟</h3>'+
      '<p class="hint">مبنية على '+cal.n+' موقفًا قدّرت ثقتك فيها.</p>'+
      '<div class="bias"><div class="bh"><div class="bt">'+E(nm)+'</div></div><div class="bs">'+E(sy)+'</div>'+
      lines([{a:'ثقة عالية',v:cal.a3||0,txt:cal.g[3].length?Math.round((cal.a3||0)*100)+'٪':'—'},
             {a:'ثقة متوسطة',v:cal.a2||0,txt:cal.g[2].length?Math.round((cal.a2||0)*100)+'٪':'—'},
             {a:'ثقة منخفضة',v:cal.a1||0,txt:cal.g[1].length?Math.round((cal.a1||0)*100)+'٪':'—'}])+
      '</div></div>';
  }

  /* ── الكفايات ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">خريطة الكفايات</div>'+
   '<h3 style="margin-top:7px">الكفايات الثماني</h3>'+
   '<p class="hint">النقاط المجوّفة والأسماء الباهتة تعني كفايات لم تُقَس في هذه الجولة — لا ضعفًا فيها.</p>'+
   radar(items)+
   (missing.length?'<p class="hint" style="margin:8px 0 14px">لم تُقَس في هذه الجولة: '+E(missing.join('، '))+'.</p>':'<div style="height:10px"></div>')+
   lines(items.filter(i=>i.has).sort((a,b)=>b.v-a.v).map(i=>({a:i.lb,v:i.v})))+'</div>';

  /* ── جدول المواقف ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">تفصيل المواقف</div><h3 style="margin-top:7px">موقفًا بموقف</h3>'+
   '<div class="tbw" style="margin-top:12px"><table class="tb"><thead><tr><th>#</th><th>الموقف</th><th>النقاط</th><th>الزمن</th><th>الأفضل</th><th>الأسوأ</th></tr></thead><tbody>';
  R.list.forEach((c,i)=>{const s=st.per[i];
    h+='<tr><td>'+(i+1)+'</td><td class="s">'+E(c.t)+'</td><td>'+s.got+'/'+MAXC+'</td><td>'+mmss(R.spent[i])+'</td>'+
      '<td>'+(bestPicked(i)===null?'—':(bestPicked(i)?'✓':'✕'))+'</td>'+
      '<td>'+(worstSpotted(i)===null?'—':(worstSpotted(i)?'✓':'✕'))+'</td></tr>'});
  h+='</tbody></table></div></div>';

  /* ── المراجعة ── */
  h+='<div class="card" style="margin-top:14px"><div class="eb">المراجعة</div><h3 style="margin-top:7px">تقدير الخبراء لكل ردّ</h3>'+
   '<p class="hint">المسوّغات هي المادة التعليمية الحقيقية — اقرأ مسوّغ الردّ الذي أخطأت فيه قبل أي شيء آخر.</p>';
  R.list.forEach((c,i)=>{
    const a=R.ans[i], s=st.per[i], mk=P().marks[c.id];
    h+='<div class="entry"><div class="eh"><div class="et">'+(i+1)+'. '+E(c.t)+'</div>'+
      '<div style="display:flex;gap:7px;align-items:center"><span class="chip gd">'+s.got+'/'+MAXC+'</span>'+
      '<button class="star'+(mk?' on':'')+'" data-mark="'+E(c.id)+'" title="حفظ الموقف">★</button></div></div>'+
      '<div class="ec">'+E(c.s)+'</div><details><summary>تقدير الخبراء والمسوّغات</summary>';
    c.r.forEach((rr,k)=>{
      const u=a[k]||0, d=u?Math.abs(u-rr.k):null;
      h+='<div class="mini"><div>'+E(rr.t)+'</div><div class="mt">'+
        '<span class="seal s'+rr.k+'">الخبراء: '+E(RATE[rr.k].s)+'</span>'+
        '<span class="chip">'+E(ARCHS[rr.a].n)+'</span>'+
        (u?'<span class="delta '+(d===0?'ok':d===1?'nr':'no')+'">أنت: '+E(RATE[u].s)+' · '+PTS(u,rr.k)+'/3</span>':'<span class="delta no">لم تُقدَّر</span>')+
        '</div><div class="rsn" style="margin-top:6px">'+E(rr.w)+'</div></div>';
    });
    h+='<div class="axiom" style="margin-top:12px"><div class="t">الدرس</div>'+E(c.l)+'</div>'+
       '<div class="nlab">ملاحظتك:</div><textarea class="note" data-cid="'+E(c.id)+'" placeholder="اكتب الدرس بكلماتك.">'+E(P().notes[c.id]||'')+'</textarea>'+
       '</details></div>';
  });
  h+='</div>';

  h+='<div class="brow noprint">'+
   '<button class="b g" data-again="1">أعد الجولة بترتيب جديد</button>'+
   '<button class="b o" data-go="home">الرئيسية</button>'+
   '<button class="b o" data-go="record">سجلّ التقدّم</button>'+
   '<button class="b q" data-share="1">حفظ بطاقة النتيجة</button>'+
   '<button class="b q" data-print="1">طباعة التقرير</button></div>';
  return h+FOOT;
}

/* بطاقة نتيجة قابلة للحفظ والمشاركة */
function shareCard(){
  const st=runStats(), b=bandOf(st.pct);
  const cv=document.createElement('canvas'); cv.width=1200; cv.height=630;
  const x=cv.getContext('2d');
  const dark=document.documentElement.getAttribute('data-theme')!=='light';
  const bg=dark?'#08090d':'#f2f1ed', ink=dark?'#eff2f7':'#15171c', sub=dark?'#a9b1bf':'#4c525d', gold='#c9a86a';
  x.fillStyle=bg; x.fillRect(0,0,1200,630);
  const gr=x.createRadialGradient(980,40,0,980,40,520);
  gr.addColorStop(0,'rgba(201,168,106,.16)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr; x.fillRect(0,0,1200,630);
  x.direction='rtl'; x.textAlign='right';
  x.fillStyle=gold; x.font='600 22px "IBM Plex Sans Arabic",sans-serif';
  x.fillText('Leadership Test Ability',1130,86);
  x.fillStyle=sub; x.font='500 18px "IBM Plex Sans Arabic",sans-serif';
  x.fillText('منصّة الحكم على المواقف القيادية',1130,120);
  x.strokeStyle=gold; x.globalAlpha=.35; x.beginPath(); x.moveTo(1130,146); x.lineTo(700,146); x.stroke(); x.globalAlpha=1;
  /* المؤشر */
  const cx=280,cy=330,r=120;
  x.lineWidth=18; x.strokeStyle=dark?'#181c25':'#e2ded6';
  x.beginPath(); x.arc(cx,cy,r,0,2*Math.PI); x.stroke();
  x.strokeStyle=gold; x.lineCap='round';
  x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+2*Math.PI*clamp(st.pct,0,1)); x.stroke();
  x.textAlign='center'; x.fillStyle=ink; x.font='700 82px "IBM Plex Sans Arabic",sans-serif';
  x.fillText(Math.round(st.pct*100)+'',cx,cy+22);
  x.fillStyle=sub; x.font='500 20px "IBM Plex Sans Arabic",sans-serif'; x.fillText('من ١٠٠',cx,cy+58);
  /* النص */
  x.textAlign='right'; x.fillStyle=ink; x.font='700 46px "IBM Plex Sans Arabic",sans-serif';
  x.fillText(b.n,1130,260);
  x.fillStyle=sub; x.font='500 22px "IBM Plex Sans Arabic",sans-serif';
  x.fillText(MODEN(R.mode)+(R.lvl?' · '+LEVELS.find(l=>l.id===R.lvl).n:''),1130,305);
  const rows=[['مواقف',st.answered+' / '+st.total],['التقاط الردّ الأفضل',Math.round(st.best*100)+'٪'],
              ['اتساق الترتيب',Math.round(st.rank*100)+'٪'],['الزمن',mmss(st.secs)]];
  rows.forEach((rw,i)=>{const y=370+i*46;
    x.fillStyle=sub; x.font='500 22px "IBM Plex Sans Arabic",sans-serif'; x.fillText(rw[0],1130,y);
    x.fillStyle=gold; x.font='700 24px "IBM Plex Sans Arabic",sans-serif'; x.fillText(rw[1],830,y);});
  x.fillStyle=sub; x.globalAlpha=.75; x.font='500 17px "IBM Plex Sans Arabic",sans-serif';
  x.textAlign='center'; x.fillText('© ALFALASI26481',600,596);
  try{
    const a=document.createElement('a');
    a.download='LTA-'+Math.round(st.pct*100)+'.png'; a.href=cv.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('تعذّر حفظ البطاقة على هذا المتصفح.'); }
}

/* ══════════════ المكتبة ══════════════ */
function vLibrary(){
  const f=V.f||0, q=(V.q||'').trim(), only=V.only||'';
  let list = f? BYLVL[f].slice() : CASES.slice();
  if(only==='mark') list=list.filter(c=>P().marks[c.id]);
  if(only==='note') list=list.filter(c=>P().notes[c.id]);
  if(q) list=list.filter(c=>(c.t+' '+c.s+' '+c.l).indexOf(q)>=0);

  let h='<div class="eb">مرجع مفتوح</div>'+
   '<h1 style="font-family:var(--d);font-size:clamp(24px,6.2vw,32px);margin-top:8px">مكتبة المواقف</h1>'+
   '<p style="color:var(--ink-2);max-width:60ch;margin:10px 0 20px;line-height:1.95">المئة والعشرون موقفًا كاملةً مع تقدير لجنة الخبراء لكل ردّ ومسوّغه ونمطه ودرس الموقف. لا قفل ولا شرط — اقرأ ما شئت متى شئت.</p>';

  h+='<div class="filter"><button class="'+(!f&&!only?'act':'')+'" data-f="0">الكل · '+CASES.length+'</button>';
  LEVELS.forEach(l=>h+='<button class="'+(f===l.id?'act':'')+'" data-f="'+l.id+'">'+E(l.n)+' · '+BYLVL[l.id].length+'</button>');
  const nm=CASES.filter(c=>P().marks[c.id]).length, nn=CASES.filter(c=>P().notes[c.id]).length;
  if(nm) h+='<button class="'+(only==='mark'?'act':'')+'" data-only="mark">★ المحفوظة · '+nm+'</button>';
  if(nn) h+='<button class="'+(only==='note'?'act':'')+'" data-only="note">ملاحظاتي · '+nn+'</button>';
  h+='</div>';
  h+='<div style="margin-bottom:16px"><input id="q" value="'+E(q)+'" placeholder="ابحث في المواقف…" '+
     'style="width:100%;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--b);font-size:14px"></div>';

  if(!list.length) h+='<div class="blank"><div class="g">❖</div><p>لا نتائج مطابقة.</p></div>';
  list.forEach(c=>{
    const r=rec(c.id), mk=P().marks[c.id];
    h+='<div class="entry"><div class="eh"><div class="et">'+E(c.t)+'</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
      '<span class="chip">'+E(c.id)+'</span>'+
      (r?'<span class="chip gd">أفضل: '+Math.round((r.best||0)*100)+'٪</span>':'')+

      '<button class="star'+(mk?' on':'')+'" data-mark="'+E(c.id)+'" title="حفظ الموقف">★</button></div></div>'+
      '<div class="ec">'+E(c.s)+'</div><details><summary>الردود الأربعة وتقدير الخبراء</summary>';

      h+='<div class="mini"><div>'+E(rr.t)+'</div><div class="mt"><span class="seal s'+rr.k+'">'+E(RATE[rr.k].n)+'</span>'+
        '<span class="chip">'+E(ARCHS[rr.a].n)+'</span></div>'+
        '<div class="rsn" style="margin-top:6px">'+E(rr.w)+'</div></div>'});

       '</details></div>';

  h+='<div class="brow"><button class="b o" data-go="home">← الرئيسية</button></div>';

    h+='<div class="card" style="margin-top:14px"><div class="eb">المنحنى</div><h3 style="margin-top:7px">درجاتك عبر الجولات</h3>'+
      spark(p.runs.map(r=>r.pct))+'</div>';

    '<p class="hint" style="margin-top:12px">المواقف التي خضتها: '+
    LEVELS.map(l=>{const q=lvlProgress(l.id);return E(l.n)+' '+q.done+'/'+q.all}).join(' · ')+'</p></div></div>';

  /* جدول المراجعة */
  const due=dueList(), soon=CASES.filter(c=>{const r=rec(c.id);return r&&r.due&&r.due>Date.now()&&r.due<Date.now()+7*DAY});
  h+='<div class="card" style="margin-top:14px"><div class="eb">التكرار المتباعد</div>'+
   '<h3 style="margin-top:7px">جدول المراجعة</h3>'+
   '<p class="hint">كل موقف تتقنه يبتعد موعد إعادته (١ ← ٣ ← ٧ ← ١٤ ← ٣٠ ← ٦٠ يومًا)، وكل موقف تتعثّر فيه يعود غدًا.</p>'+
   '<div class="tiles" style="margin-top:14px">'+
    '<div class="tile"><div class="v">'+due.length+'</div><div class="k">مستحق الآن</div></div>'+
    '<div class="tile"><div class="v">'+soon.length+'</div><div class="k">خلال أسبوع</div></div>'+
    '<div class="tile"><div class="v">'+freshList().length+'</div><div class="k">لم تُخَض بعد</div></div>'+
   '</div>';
  if(due.length) h+='<div class="brow"><button class="b g" data-run="due">ابدأ المراجعة المستحقة ('+due.length+')</button></div>';
  h+='</div>';

  /* الكفايات التراكمية */
  const acc={}; CK.forEach(k=>acc[k]={g:0,m:0});
  CASES.forEach(c=>{const r=rec(c.id); if(!r)return; c.c.forEach(k=>{acc[k].g+=(r.best||0);acc[k].m+=1})});
  const items=CK.map(k=>({lb:COMPS[k].n,v:acc[k].m?acc[k].g/acc[k].m:0,has:acc[k].m>0}));
  if(items.some(i=>i.has)){
    const missing=items.filter(i=>!i.has).map(i=>i.lb);
    h+='<div class="card" style="margin-top:14px"><div class="eb">الكفايات</div><h3 style="margin-top:7px">خريطتك التراكمية</h3>'+
      '<p class="hint">مبنية على أفضل نتيجة لك في كل موقف خضته.</p>'+radar(items)+
      (missing.length?'<p class="hint" style="margin:8px 0 0">لم تُقَس بعد: '+E(missing.join('، '))+'.</p>':'');
    const cw=compWeak().slice(0,3).filter(x=>x.v<0.85);
    if(cw.length){
      h+='<div class="acts">';
      cw.forEach((x,i)=>{h+='<button class="act" data-fixcomp="'+x.k+'"><div class="no2">'+AI(i+1)+'</div>'+
        '<div><div class="at">جولة علاجية: '+E(COMPS[x.k].n)+'</div>'+
        '<div class="as">'+Math.round(x.v*100)+'٪ على '+x.n+' موقفًا — ثمانية مواقف تقيسها، الأضعف أولًا.</div></div><div class="ag">←</div></button>'});
      h+='</div>';
    }
    h+='</div>';
  }

  if(p.runs.length){
    h+='<div class="card" style="margin-top:14px"><div class="eb">الجولات</div><h3 style="margin-top:7px">آخر ما خضته</h3>'+

     '<button class="b o" data-go="settings">الملف والنسخ الاحتياطي</button></div>';
  return h+FOOT;
}

   '<p style="color:var(--ink-2);line-height:1.95;margin:10px 0 0">الموقف الذي تتقنه (٨٥٪ فأعلى) يبتعد موعد إعادته خطوة: يوم، ثم ثلاثة، ثم سبعة، ثم ١٤، ثم ٣٠، ثم ٦٠. والموقف الذي تتعثّر فيه (دون ٦٠٪) يعود إلى بداية السلّم ويستحق غدًا. هذا يجعل وقت مراجعتك يذهب إلى ما تحتاجه فعلًا لا إلى ما أتقنته.</p></div>';

  h+='<div class="card" style="margin-top:14px"><div class="eb">الكفايات الثماني</div><h3 style="margin-top:7px">ما الذي يُقاس خلف المواقف</h3>'+
   '<div class="tbw" style="margin-top:12px"><table class="tb"><tbody>'+
   CK.map(k=>'<tr><td class="s" style="width:32%">'+E(COMPS[k].n)+'</td><td>'+E(COMPS[k].d)+'</td></tr>').join('')+
   '</tbody></table></div></div>';

  h+='<div class="axiom" style="margin-top:16px"><div class="t">تنبيه</div>'+
   'جميع المواقف والردود والتقديرات في هذه المنصّة مصوغة لأغراض التدريب بمنطق مفصّل لكل ردّ، وليست مفتاح تصحيح مُعايَرًا إحصائيًا على عيّنة، ولا تمثّل بنك أسئلة أي اختبار رسمي ولا تُنسب إلى أي جهة.</div>';
  h+='<div class="brow"><button class="b o" data-go="home">← الرئيسية</button></div>';
  return h+FOOT;
}

/* ══════════════ الربط ══════════════ */
function bind(){
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('[data-lvl]').forEach(b=>b.onclick=()=>go('level',{lvl:+b.dataset.lvl}));
  $$('[data-mode]').forEach(b=>b.onclick=()=>startRun(b.dataset.mode,{lvl:V.lvl}));
  $$('[data-run]').forEach(b=>b.onclick=()=>startRun(b.dataset.run,{}));
  $$('[data-planday]').forEach(b=>b.onclick=()=>startPlanDay(+b.dataset.planday));
  $$('[data-newplan]').forEach(b=>b.onclick=()=>{
    if(P().plan && !confirm('ستبدأ خطة جديدة ويُمسح تتبّع الخطة الحالية. متابعة؟')) return;
    makePlan(); go('plan');
  });
  $$('[data-f]').forEach(b=>b.onclick=()=>go('library',{f:+b.dataset.f,q:V.q||''}));
  $$('[data-only]').forEach(b=>b.onclick=()=>go('library',{only:b.dataset.only,q:V.q||''}));
  $$('[data-print]').forEach(b=>b.onclick=()=>window.print());
  $$('[data-share]').forEach(b=>b.onclick=()=>shareCard());
  $$('[data-again]').forEach(b=>b.onclick=()=>startRun(R.mode,{lvl:R.lvl,list:R.list}));
  $$('[data-fixcomp]').forEach(b=>b.onclick=()=>startRun('fix',
    {list:casesForComp(b.dataset.fixcomp,8), label:'جولة علاجية · '+COMPS[b.dataset.fixcomp].n}));
  $$('[data-fixworst]').forEach(b=>b.onclick=()=>{
    const w=R.list.map((c,i)=>({c:c,s:caseScore(i)})).filter(x=>x.s.n).sort((a,b2)=>a.s.pct-b2.s.pct).slice(0,3).map(x=>x.c);
    startRun('fix',{list:w,label:'إعادة المواقف الأضعف'});
  });
  $$('[data-mark]').forEach(b=>b.onclick=function(){
    const id=b.dataset.mark, m=P().marks;
    if(m[id]) delete m[id]; else m[id]=1;
    b.classList.toggle('on',!!m[id]); save();
  });
  $$('textarea.note').forEach(t=>{
    let z=null;
    t.oninput=()=>{clearTimeout(z);z=setTimeout(()=>{
      const id=t.dataset.cid, v=t.value.trim();
      if(v) P().notes[id]=v; else delete P().notes[id];
      save();
    },400)};
  });
  $$('[data-conf]').forEach(b=>b.onclick=function(){
    R.conf[R.i]=+b.dataset.conf;
    $$('[data-conf]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
  /* الملفات والنسخ الاحتياطي */
  $$('[data-prof]').forEach(b=>b.onclick=()=>{DB.active=b.dataset.prof;save();go('settings')});
  $$('[data-newprof]').forEach(b=>b.onclick=()=>{
    const n=prompt('اسم الملف الجديد:','متدرّب '+(Object.keys(DB.profiles).length+1));
    if(!n)return; const id='p'+Date.now().toString(36);
    DB.profiles[id]=blankProfile(n.trim()); DB.profiles[id].intro=true; DB.active=id; save(); go('settings');
  });
  $$('[data-renprof]').forEach(b=>b.onclick=()=>{
    const n=prompt('اسم الملف:',P().name); if(!n)return; P().name=n.trim(); save(); go('settings');
  });
  $$('[data-delprof]').forEach(b=>b.onclick=()=>{
    if(Object.keys(DB.profiles).length<2)return;
    if(!confirm('سيُحذف ملف «'+P().name+'» وكل تقدّمه نهائيًا. متابعة؟'))return;
    delete DB.profiles[DB.active]; DB.active=Object.keys(DB.profiles)[0]; save(); go('settings');
  });
  $$('[data-export]').forEach(b=>b.onclick=()=>{const t=$('#iobox'); if(t){t.value=JSON.stringify(DB); t.focus(); t.select()}});
  $$('[data-copy]').forEach(b=>b.onclick=()=>{
    const t=$('#iobox'); if(!t)return; if(!t.value) t.value=JSON.stringify(DB);
    t.select();
    const done=()=>{b.textContent='✓ نُسخ'; setTimeout(()=>b.textContent='نسخ إلى الحافظة',1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done,()=>{try{document.execCommand('copy');done()}catch(e){}});
    else {try{document.execCommand('copy');done()}catch(e){}}
  });
  $$('[data-dl]').forEach(b=>b.onclick=()=>{
    try{
      const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='LTA-backup-'+ymd()+'.json'; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    }catch(e){alert('تعذّر حفظ الملف على هذا المتصفح — استخدم النسخ إلى الحافظة.')}
  });
  $$('[data-import]').forEach(b=>b.onclick=()=>{
    const t=$('#iobox'); if(!t||!t.value.trim()){alert('الصق نص النسخة الاحتياطية في الصندوق أولًا.');return}
    let o; try{o=JSON.parse(t.value.trim())}catch(e){alert('النص غير صالح — تأكد من نسخه كاملًا.');return}
    if(!o||!o.profiles||!Object.keys(o.profiles).length){alert('لا يحتوي هذا النص على ملفات تقدّم.');return}
    if(!confirm('سيستبدل هذا كل الملفات الحالية على هذا الجهاز. متابعة؟'))return;
    DB={v:2, profiles:o.profiles, active:(o.profiles[o.active]?o.active:Object.keys(o.profiles)[0]), theme:o.theme||DB.theme};
    Object.keys(DB.profiles).forEach(k=>{const p=DB.profiles[k];
      ['cases','notes','marks'].forEach(f=>{if(!p[f])p[f]={}}); if(!p.runs)p.runs=[];
      if(!p.streak)p.streak={last:'',n:0,best:0}; if(!p.name)p.name='المتدرّب';});
    save(); alert('تم الاستيراد بنجاح.'); go('record');
  });
  $$('[data-reset]').forEach(b=>b.onclick=()=>{
    if(!confirm('سيُمسح تقدّم ملف «'+P().name+'» كاملًا على هذا الجهاز. متابعة؟'))return;
    const n=P().name; DB.profiles[DB.active]=blankProfile(n); DB.profiles[DB.active].intro=true; save(); go('settings');
  });

  const q=$('#q');
  if(q){ let z=null; q.oninput=()=>{clearTimeout(z);z=setTimeout(()=>{V.q=q.value;go('library',{f:V.f||0,only:V.only||'',q:q.value})},320)};
    q.focus(); try{q.setSelectionRange(q.value.length,q.value.length)}catch(e){} }

  if(V.v==='run'){
    $$('.grade button').forEach(b=>b.onclick=function(){
      const box=b.closest('.opt'), oi=+box.dataset.oi, v=+b.dataset.v;
      const was=Object.keys(R.ans[R.i]).length;
      R.ans[R.i][oi]=v; R.act=Math.min(3,(+box.dataset.pos)+1);
      $$('button',b.parentNode).forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});
      b.classList.add('on'); b.setAttribute('aria-pressed','true'); box.classList.add('set');
      const done=Object.keys(R.ans[R.i]).length;
      const st=$('#deck .st'); if(st)st.innerHTML=done+' من 4<span class="wide"> ردود مُقدَّرة</span>';
      const nx=$('#bnext'); if(nx&&MODE_CFG[R.mode].reveal) nx.disabled=done<4;
      if(done===4&&was<4){ redraw(); return; }        /* لإظهار مقياس الثقة */
      const nb=$$('.opt')[R.act]; if(nb&&done<4) nb.scrollIntoView({block:'center',behavior:'smooth'});
    });
    const p=$('#bprev'); if(p)p.onclick=()=>{ if(R.i>0){stopTick();R.i--;R.act=0;redraw()} };
    const n=$('#bnext'); if(n)n.onclick=()=>{
      if(MODE_CFG[R.mode].reveal && !R.shown[R.i]){ stopTick(); R.shown[R.i]=true; redraw(); return; }
      stopTick(); advance();
    };
    startClock();
  }
}

/* ══════════════ اختصارات لوحة المفاتيح ══════════════ */
document.addEventListener('keydown',function(e){
  if(V.v!=='run'||!R)return;
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if($('.intro'))return;
  if(e.key>='1'&&e.key<='4'){
    const box=$$('.opt')[R.act]; if(!box||R.shown[R.i])return;
    const b=$$('.grade button',box)[+e.key-1]; if(b&&!b.disabled){b.click();e.preventDefault()}
  } else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    R.act=clamp(R.act+(e.key==='ArrowDown'?1:-1),0,3);
    const box=$$('.opt')[R.act]; if(box){box.scrollIntoView({block:'center',behavior:'smooth'});e.preventDefault()}
  } else if(e.key==='Enter'){
    const n=$('#bnext'); if(n&&!n.disabled){n.click();e.preventDefault()}
  } else if(e.key==='ArrowRight'){
    const p=$('#bprev'); if(p&&!p.disabled){p.click();e.preventDefault()}
  }
});

/* ══════════════ التعريف عند أول استخدام ══════════════ */
const INTRO=[
 {h:'أنت لا تختار — أنت تُقيّم',
  p:'في هذه الفقرة لا يُطلب منك اختيار الردّ الأفضل من بين أربعة. يُطلب منك الحكم على <b>كل ردّ على حدة</b>: ما مدى فعاليته؟ قد تكون الردود الأربعة فعّالة، وقد تكون الأربعة ضعيفة.'},
 {h:'سلّم من أربع درجات',
  p:'لكل ردّ أربعة خيارات: غير فعّال إطلاقًا · غير فعّال · فعّال · فعّال جدًا. ولجنة خبراء وضعت تقديرها لكل ردّ مع مسوّغ مكتوب تقرؤه بعد إجابتك.'},
 {h:'جرّبها الآن',
  p:'هذا ردّ على موقف حقيقي من البنك. قدّر فعاليته — لا توجد إجابة تُسجَّل عليك، هذه تجربة فقط.'},
];
function showIntro(){
  let step=0, picked=0;
  const demo=BYLVL[1][0];
  function draw(){
    const s=INTRO[step];
    let body='<div class="introbox"><div class="eb">تعريف سريع · '+(step+1)+' من '+INTRO.length+'</div>'+
      '<h3 style="margin-top:8px">'+s.h+'</h3><p>'+s.p+'</p>';
    if(step===2){
      const rr=demo.r[0];
      body+='<div class="demo"><div class="ds" style="font-size:12px;color:var(--muted);margin-bottom:8px">'+E(demo.s.slice(0,120))+'…</div>'+
        '<div class="dq">'+E(rr.t)+'</div>'+
        '<div class="grade" id="dg">'+[1,2,3,4].map(v=>'<button data-dv="'+v+'"'+(picked===v?' class="on"':'')+'>'+
          '<span class="lv"><i></i><i></i><i></i><i></i></span><span>'+E(RATE[v].s)+'</span></button>').join('')+'</div>';
      if(picked) body+='<div class="ruling" style="margin-top:12px"><div class="rl-top">'+
        '<span class="seal s'+rr.k+'">تقدير الخبراء: '+E(RATE[rr.k].n)+'</span>'+
        '<span class="delta '+(picked===rr.k?'ok':Math.abs(picked-rr.k)===1?'nr':'no')+'">'+PTS(picked,rr.k)+'/3 نقاط</span></div>'+
        '<div class="rsn">'+E(rr.w)+'</div></div>';
      body+='</div>';
    }
    body+='<div class="brow" style="margin-top:18px">'+
      (step<INTRO.length-1?'<button class="b g" id="inext">التالي ←</button>':'<button class="b g" id="idone">ابدأ التدريب</button>')+
      '<button class="b q" id="iskip">تخطّي</button></div>'+
      '<div class="dots">'+INTRO.map((_,i)=>'<i class="'+(i===step?'on':'')+'"></i>').join('')+'</div></div>';
    ov.innerHTML=body;
    const nx=$('#inext'); if(nx)nx.onclick=()=>{step++;draw()};
    const dn=$('#idone'); if(dn)dn.onclick=close;
    $('#iskip').onclick=close;
    $$('#dg button').forEach(b=>b.onclick=()=>{picked=+b.dataset.dv;draw()});
  }
  function close(){ P().intro=true; save(); ov.remove(); }
  const ov=document.createElement('div'); ov.className='intro'; document.body.appendChild(ov);
  draw();
}
